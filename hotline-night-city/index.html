    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const osc = (dest, type, midi, t, dur, vol, detune, attack) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = hz(midi); o.detune.value = detune || 0;
      if (attack) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); }
      else g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
    };
    /** Like osc, but it holds full volume and only fades in the last few milliseconds: for the held rave bass. */
    const hosc = (dest, type, midi, t, dur, vol, detune) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = hz(midi); o.detune.value = detune || 0;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
      g.gain.setValueAtTime(vol, t + dur - 0.02); g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
    };
    /** The phonk cowbell: two square waves a fifth-and-a-bit apart (the 808 cowbell's 540/800 ratio), bandpassed, fast decay. */
    const cowbell = (m, t, v) => {
      const f = hz(m), bp = ac.createBiquadFilter(), g = ac.createGain();
      bp.type = 'bandpass'; bp.frequency.value = f * 1.6; bp.Q.value = 1.6;
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(v * 0.35, t + 0.03); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      for (const k of [1, 1.48]) { const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = f * k; o.connect(bp); o.start(t); o.stop(t + 0.35); }
      bp.connect(g); g.connect(cowDist);
    };
    /** The 808: a sine that punches in from above its pitch (or slides over from the last note), then rings out, clipped. */
    let last808 = 29;
    const bass808 = (note, t, dur, v) => {
      const m = Math.abs(note), o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      if (note < 0) { o.frequency.setValueAtTime(hz(last808), t); o.frequency.exponentialRampToValueAtTime(hz(m), t + 0.09); }   // the slide
      else { o.frequency.setValueAtTime(hz(m) * 2.2, t); o.frequency.exponentialRampToValueAtTime(hz(m), t + 0.035); }          // the punch
      g.gain.setValueAtTime(v, t); g.gain.setValueAtTime(v, t + dur * 0.55); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(dist808); o.start(t); o.stop(t + dur + 0.03);
      last808 = m;
    };
    /** The hoover: the classic rave lead. A stack of detuned saws plus one an octave down, each bending up into pitch
        from a little below, through a crunchy filter. */
    const hooverLP = lowpass(2800, 4), hooverDist = shaper(7), hooverOut = ac.createGain(); hooverOut.gain.value = 1.1;
    hooverDist.connect(hooverLP); hooverLP.connect(hooverOut); hooverOut.connect(duck); hooverOut.connect(reverb);
    const hoover = (m, t, dur, v) => {
      for (const [dt, oct] of [[-38, 0], [-16, 0], [0, 0], [16, 0], [38, 0], [0, -12]]) {
        const o = ac.createOscillator(), g = ac.createGain(), f = hz(m + oct);
        o.type = 'sawtooth'; o.detune.value = dt;
        o.frequency.setValueAtTime(f * 0.72, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.07);
        g.gain.setValueAtTime(v, t); g.gain.setValueAtTime(v, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(hooverDist); o.start(t); o.stop(t + dur + 0.03);
      }
    };
    /** Build-up riser: noise through a band filter that climbs over the build. */
    const riser = (t, dur) => {
      const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = sound.noiseBuf; src.loop = true; bp.type = 'bandpass'; bp.Q.value = 2;
      bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(9000, t + dur);
      g.gain.setValueAtTime(0.02, t); g.gain.exponentialRampToValueAtTime(0.5, t + dur); g.gain.setValueAtTime(0.0001, t + dur + 0.01);
      src.connect(bp); bp.connect(g); g.connect(music); src.start(t); src.stop(t + dur + 0.05);
    };
    /** Crash cymbal on the drop. */
    const crash = t => { burst(hatHP, t, 1.3, 0.55); burst(clapBP, t, 0.4, 0.3); };

    /** Supersaw chord: five detuned saws per note, the big rave stab. */
    const supersaw = (notes, t, dur, v) => { for (const m of notes) for (const dt of [-24, -11, 0, 11, 24]) osc(stabLP, 'sawtooth', m, t, dur, v, dt); };
    const pad = (notes, t, d, v) => { for (const m of notes) { osc(padLP, 'sawtooth', m, t, d, v, -10, d * 0.3); osc(padLP, 'sawtooth', m, t, d, v, 10, d * 0.3); } };
    const burst = (dest, t, dur, vol) => {                               // a shaped hit of noise: hats and claps
      const src = ac.createBufferSource(), g = ac.createGain();
      src.buffer = sound.noiseBuf;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(g); g.connect(dest); src.start(t, Math.random() * 0.2); src.stop(t + dur + 0.02);
    };
    const sweep = (dest, t, from, to, dur, vol) => {                     // pitched thump: the kick's body
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(from, t); o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
    };
    const kick = (t, hard) => {
      sweep(drums, t, 200, 42, 0.17, 1); burst(clapBP, t, 0.015, 0.3);
      if (hard) { sweep(kickDist, t, 340, 40, 0.36, 1.5); sweep(kickDist, t + 0.02, 110, 36, 0.32, 0.9); }   // the hard kick: a long clipped tail you feel
      duck.gain.setValueAtTime(0.6, t); duck.gain.linearRampToValueAtTime(1, t + 0.12);   // a light dip only: heavy pumping is its own bounce
    };
    const clap = t => { for (const k of [0, 0.011, 0.022]) burst(clapBP, t + k, 0.02, 0.6); burst(clapBP, t + 0.03, 0.18, 0.55); };

    // ---------- the sequencer ----------
    let next = ac.currentTime + 0.1, pos = 0, name = musicMood(), T = TRACKS[name];
    sound.track = name;
    setInterval(() => {
      while (next < ac.currentTime + 0.25) {
        if (pos % 16 === 0) {                                           // on each bar line: has the mood changed?
          const want = musicMood();
          if (want !== name && TRACKS[want]) { name = want; T = TRACKS[want]; pos = 0; sound.track = name; }
        }
        const s = pos % (T.bars * 16), d = s % 16, bar = (s / 16) | 0, step = 60 / T.bpm / 4;
        if (d === 0) echo.delayTime.setValueAtTime(Math.min(0.9, step * 3), next);
        // build-ups: the last two bars of each phrase roll the snare and lift a riser, then the final beat goes silent before the drop
        const building = T.build && bar >= T.bars - 2, lastBar = T.build && bar === T.bars - 1, gap = lastBar && d >= 12;
        if (T.build && bar === 0 && d === 0 && pos > 0) crash(next);
        if (T.build && bar === T.bars - 2 && d === 0) riser(next, step * 28);
        if (building && !gap && (lastBar || d % 2 === 0)) {
          const k = lastBar ? d / 12 : d / 32;                            // the roll gets louder as it goes
          for (const off of [0, 0.008]) burst(clapBP, next + off, 0.03, 0.25 + 0.45 * k);
        }
        if (T.cowbell && T.cowbell[s]) cowbell(T.cowbell[s], next, T.cowVol);
        if (T.b808 && T.b808[s]) bass808(T.b808[s], next, step * T.b808Dur, T.b808Vol);
        if (T.rbass && T.rbass[s] && !gap) {                                     // rave bass: a short growl, the filter breathing over the bar
          rbassLP.frequency.setValueAtTime(220, next); rbassLP.frequency.linearRampToValueAtTime(650, next + step * 6);    // a dark growl that opens up a little over each note
          const held = step * 8.05;                                     // held right up to the next note, so there is no gap
          hosc(rbassDist, 'sawtooth', T.rbass[s], next, held, T.rbassVol, -14); hosc(rbassDist, 'sawtooth', T.rbass[s], next, held, T.rbassVol, 14);
          hosc(rbassDist, 'square', T.rbass[s] + 12, next, held, T.rbassVol * 0.15);   // just a hint of growl an octave up, so it still cuts on small speakers
          hosc(music, 'sine', T.rbass[s], next, held, T.rbassVol * 2.3);               // and a clean, heavy sub on the same note: most of the weight now
          hosc(music, 'triangle', T.rbass[s], next, held, T.rbassVol * 0.5);           // with a little body so the sub is felt, not just measured
        }
        if (T.chords && T.stab[d] === 'x' && !gap) supersaw(T.chords[bar % T.chords.length], next, step * (T.stabDur || 1.4), T.stabVol);
        if (T.hoover && T.hoover[s] && !gap) hoover(T.hoover[s], next, step * T.hooverDur, T.hooverVol);
        if (T.arp && T.arp[s] && !gap) osc(arpLP, 'square', T.arp[s], next, step * 1.4, 0.08);
        if (T.pads && d === 0) pad(T.pads[bar % T.pads.length], next, step * 16, T.padVol);
        if ((T.kick[d] === 'x' || T.kick[d] === 'K') && !gap && !(lastBar && d >= 8 && T.kick[d] !== 'K')) kick(next, T.kick[d] === 'K');
        if (T.clap[d] === 'x' && !building) clap(next);
        const hv = T.hatVol || 1, hd = gap ? '.' : T.hat[d];          // the gap before a drop is silent
        if (hd === 'x') burst(hatHP, next, 0.03, 0.24 * hv);
        else if (hd === 'o') burst(hatHP, next, 0.14, 0.28 * hv);
        else if (hd === 'r') for (let k = 0; k < 3; k++) burst(hatHP, next + k * step / 3, 0.025, (0.14 + k * 0.06) * hv);   // a hat roll
        next += step; pos++;
      }
    }, 60);
  },
};

/* =====================================================================

function showOverlay(title, body, hint, choices) {
  oTitle.textContent = title; oBody.innerHTML = body; oHint.textContent = hint;
  oChoices.innerHTML = choices || '';
  if (choices) oChoices.classList.add('show'); else oChoices.classList.remove('show');
  overlay.classList.add('show');
}
function hideOverlay() { overlay.classList.remove('show'); }

function showTitle() {
  showOverlay('Hotline Night City',
    'A platinum client is bleeding out in gang territory. Get in, stabilize them, carry them out.<br><br>' +
    '<b>Esc</b> opens the menu: controls, new map, volume. <b>' + kl('cyberMenu') + '</b> picks your cyberware and guns.' +
    '<br><br><span style="font-size:11px;opacity:.55;line-height:1.4;display:inline-block;max-width:420px">' +
    'Unofficial fan game, free to play. Not affiliated with, approved by or endorsed by CD PROJEKT RED, R. Talsorian Games, ' +

    'Click to deploy');
}

/** Starts or instantly restarts the mission. Bound to 9 and the title click. */
function startMission() {
  Sound.init();
  pickingDiff = false;
  loadout = randomGunsNow() ? rollLoadout() : [...manualLoadout];
  buildWorld();
  for (const set of layerSets) set.decal.getContext('2d').clearRect(0, 0, WORLD_W, WORLD_H);
  missionTime = 0; kills = 0; shake = 0; hurt = 0;
  stats = { spotted: 0 }; mapAttempts++; hackGame = null;
  banner = { text: '', t: 0 };
  mouse.down = false; ePressed = false;
  cam.x = player.x; cam.y = player.y;
  state = 'play';
  hideOverlay(); toggleBinds(false); toggleCyber(false); togglePause(false);
  if (randomGunsNow()) say('Guns: ' + loadout.map(id => WEAPONS[id].short || WEAPONS[id].name).join(', '), 3.5);
}

/* ---------- pause menu (Esc) ---------- */
function renderPause() {
  const slider = (kind, label) => '<label>' + label + '<input type="range" min="0" max="100" step="5" value="' + Math.round(Sound[kind] * 100) +
    '" data-vol="' + kind + '"><span class="val">' + Math.round(Sound[kind] * 100) + '%</span></label>';
  const inRun = state === 'play';
  pauseEl.innerHTML = '<h2>' + (inRun ? 'Paused' : 'Menu') + '</h2><button type="button" class="main" data-p="resume">' + (inRun ? 'Resume' : 'Back') + '</button>' +
    slider('musicVol', 'Music') + slider('sfxVol', 'Effects') +
    '<div class="row"><button type="button" data-p="mute">' + (Sound.muted ? 'Unmute all' : 'Mute all') + '</button>' +
    '<button type="button" data-p="controls">Controls</button>' +
    (state === 'win' ? '' : '<button type="button" data-p="respawn">Respawn</button>') +
    '<button type="button" data-p="newmap">New map</button></div><p class="foot">Esc ' + (inRun ? 'resumes' : 'closes') + '.</p>';
}
function togglePause(force) {
  pauseOpen = force === undefined ? !pauseOpen : force;
  if (pauseOpen) { mouse.down = false; toggleBinds(false); toggleCyber(false); renderPause(); pauseEl.classList.add('show'); }
  else pauseEl.classList.remove('show');
}
pauseEl.addEventListener('input', e => {
  const r = e.target.closest('[data-vol]');
  if (!r) return;
  Sound.setVolume(r.dataset.vol, r.value / 100);
  r.parentElement.querySelector('.val').textContent = r.value + '%';
});
pauseEl.addEventListener('click', e => {
  const b = e.target.closest('[data-p]');
  if (!b) return;
  const what = b.dataset.p;
  if (what === 'resume') togglePause(false);
  else if (what === 'mute') Sound.toggleMute();
  else if (what === 'controls') { togglePause(false); toggleBinds(true); }
  else if (what === 'respawn') { togglePause(false); startMission(); }
  else if (what === 'newmap') { togglePause(false); nextMap(); }
});
try { const v = JSON.parse(localStorage.getItem('flatline.volume')); if (v) { Sound.musicVol = clamp(+v.musicVol, 0, 1); Sound.sfxVol = clamp(+v.sfxVol, 0, 1); } } catch (err) { /* fine */ }

/* ---------- controls panel: every bind with live state. Click a row, then press a key, to rebind it. ---------- */
function renderBinds() {
  const p = player, carrying = !!(client && client.carried);
  const secs = v => (v > 0 ? Math.ceil(v) + 's' : 'ready');
  const gun = n => { const id = loadout[n - 1]; return { action: 'slot' + n, label: 'Slot ' + n + ': ' + (WEAPONS[id].short || WEAPONS[id].name),
                       note: carrying ? 'locked' : WEAPONS[id].melee ? 'melee' : p.ammo[id] + '/' + WEAPONS[id].mag,
                       cls: carrying ? 'off' : (p.weapon === id ? 'on' : '') }; };
  // action = rebindable row, fixed = not rebindable. cls 'on' = in use now, 'off' = unavailable now.
  const rows = [
    { action: 'up', label: 'Move up' },
    { action: 'left', label: 'Move left' },
    { action: 'down', label: 'Move down' },
    { action: 'right', label: 'Move right' },
    { fixed: 'Mouse', label: 'Aim' },
    { fixed: 'Click', label: 'Shoot' },
    { action: 'reload', label: 'Reload' },
    gun(1), gun(2), gun(3),
    { fixed: 'auto', label: 'Carry pistol', note: p.ammo.pistol + '/' + WEAPONS.pistol.mag, cls: carrying ? 'on' : 'off' },
    { action: 'interact', label: 'Interact: client, stairs' },
    { action: 'medkit', label: 'Medkit', note: 'x' + p.medkits, cls: p.medkits ? '' : 'off' },
    { action: 'grenade', label: 'Grenade', note: secs(p.grenadeCooldown) },
    { action: 'cyber', label: CYBERWARE[selectedCyber].name, note: (selectedCyber === 'sandevistan' && p.sandy > 0) || (selectedCyber === 'smartlink' && p.smart > 0) || (selectedCyber === 'camo' && p.camo > 0) ? 'active' : secs(p.cyberCd[selectedCyber]) },
    { action: 'cyber2', label: selectedCyber2 ? CYBERWARE[selectedCyber2].name : 'Second cyberware', note: selectedCyber2 ? secs(p.cyberCd[selectedCyber2]) : 'not Sandevistan', cls: selectedCyber2 ? '' : 'off' },
    { action: 'cyberMenu', label: 'Cyberware and guns' },
    { action: 'restart', label: 'Respawn', note: state === 'win' ? 'after a win: pick a new map' : '', cls: state === 'win' ? 'off' : '' },
    { action: 'mute', label: 'Mute', note: Sound.muted ? 'muted' : (Sound.track ? 'track: ' + Sound.track : 'sound on') },
    { action: 'skipWave', label: 'Wave mode: next wave now', cls: diffOf(level).waves && wave.started && wave.rest > 0 && wave.n > 0 ? 'on' : 'off' },
  ];
  const html = rows.map(r => {
    const waiting = !!r.action && rebinding === r.action;
    const tag = r.action ? 'button' : 'div';
    return '<' + tag + ' class="row ' + (r.cls || '') + (waiting ? ' wait' : '') + '"' +
           (r.action ? ' type="button" data-action="' + r.action + '"' : '') + '>' +
           '<kbd>' + (r.action ? (waiting ? '...' : kl(r.action)) : r.fixed) + '</kbd>' +
           '<span>' + (waiting ? 'Press a key' : r.label) + '</span>' +
           (r.note && !waiting ? '<span class="note">' + r.note + '</span>' : '') + '</' + tag + '>';
  }).join('');
  bindsEl.innerHTML = '<h2>Controls</h2><div class="grid">' + html + '</div><p class="foot">' +
    (rebinding ? 'Press the new key. Esc cancels.'
               : (bindNote || 'Paused. Click a row to change its key.') + ' <button type="button" data-reset>Reset all</button>') + '</p>';
}

function toggleBinds(force) {
  bindsOpen = force === undefined ? !bindsOpen : force;
  rebinding = null;
  if (bindsOpen) { bindNote = ''; toggleCyber(false); renderBinds(); bindsEl.classList.add('show'); }
  else bindsEl.classList.remove('show');
}

bindsEl.addEventListener('click', e => {
  const row = e.target.closest('[data-action]');
  if (row) { rebinding = rebinding === row.dataset.action ? null : row.dataset.action; renderBinds(); return; }   // click again to cancel
  if (e.target.closest('[data-reset]')) { BINDS = { ...DEFAULT_BINDS }; rebinding = null; bindNote = 'Controls reset.'; saveBinds(); renderBinds(); }
  else if (rebinding) { rebinding = null; renderBinds(); }
});

/* ---------- cyberware menu: pick what goes in your one cyberware slot ---------- */
function renderCyber() {
  const p = player;
  const tabs = '<div class="tabs">' + [['cyber', 'Cyberware'], ['guns', 'Guns']].map(([id, label]) =>
    '<button type="button" class="tab' + (cyberTab === id ? ' on' : '') + '" data-tab="' + id + '">' + label + '</button>').join('') + '</div>';
  const locked = loadoutLocked();
  const lock = locked ? '<p class="lock">Locked. Stand in the evac zone to change weapons or cyberware.</p>' : '';
  if (locked) cyberEl.classList.add('locked'); else cyberEl.classList.remove('locked');
  if (cyberTab === 'guns') { cyberEl.innerHTML = tabs + lock + gunsTabHtml(); return; }
  cyberEl.innerHTML = tabs + lock + '<p class="sub">Click to pick up to two: the first goes on ' + kl('cyber') + ', the second on ' + kl('cyber2') +
    '. Click a picked one again to drop it. The Sandevistan takes both slots.</p><div class="list">' +
    Object.keys(CYBERWARE).map(id => {
      const c = CYBERWARE[id], cd = p ? p.cyberCd[id] : 0;
      const tag = id === selectedCyber ? ' (' + kl('cyber') + ')' : id === selectedCyber2 ? ' (' + kl('cyber2') + ')' : '';
      return '<button type="button" class="opt' + (id === selectedCyber || id === selectedCyber2 ? ' on' : '') + '" data-cyber="' + id + '">' +
             '<span class="kind">' + c.kind + tag + '</span>' +
             '<span class="name">' + c.name + '</span>' +
             '<span class="note">' + (cd > 0 ? Math.ceil(cd) + 's left' : c.cooldown + 's cooldown') + '</span>' +
             '<span class="desc">' + c.desc + '</span></button>';
    }).join('') +
    '</div><p class="foot">Paused. Up/down picks. Left/right switches tab. ' + kl('cyberMenu') + ' closes.</p>';
}

/** Every gun that can go in a weapon slot. */
function gunPool() { return Object.keys(WEAPONS).filter(id => !WEAPONS[id].carryOnly && !WEAPONS[id].pickupOnly); }

/** Three different guns picked at random, one per slot. */
function rollLoadout() {
  const pool = gunPool();
  for (let i = pool.length - 1; i > 0; i--) { const j = randInt(0, i); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, 3);
}

/** The Guns tab: the random-guns switch, then one row per weapon slot with a Change button that opens the weapon chart. */
function gunsTabHtml() {
  if (gunPick !== null) return gunChartHtml(gunPick);
  const cap = id => (WEAPONS[id].melee ? 'melee' : WEAPONS[id].mag + ' rd');
  const D = diffOf(level);
  return '<p class="sub">' + (D.randomGuns ? 'Hard map: your three guns are rolled at random and cannot be changed here. Take weapons off the dead instead.'
                                           : 'You keep the guns you pick here.') +
    (D.finiteAmmo ? ' Ammo is limited on this map: hold ' + kl('interact') + ' on a dropped weapon to swap.' : ' Ammo is unlimited on this map.') + '</p>' +
    '<div class="slots">' + loadout.map((cur, i) =>
      '<div class="slot"><span><kbd>' + kl('slot' + (i + 1)) + '</kbd>Slot ' + (i + 1) + '</span>' +
      '<span class="gunname">' + WEAPONS[cur].name + '<span class="note">' + cap(cur) + '</span></span>' +
      (D.randomGuns ? '<span class="note">random</span>' : '<button type="button" class="pick" data-pick="' + i + '">Change</button>') + '</div>').join('') +
    '</div><p class="foot">Paused. Left/right switches tab. ' + kl('cyberMenu') + ' closes.</p>';
}

/** The numbers shown for one weapon in the chart, worked out from its WEAPONS entry. */
function gunStats(id) {
  const w = WEAPONS[id];
  const kills = hp => (w.rect ? '1-2' : w.melee || w.dmg >= hp ? '1' : w.falloff ? '1+' : String(Math.ceil(hp / w.dmg)));
  return {
    type: w.cyberware ? 'Cyberware' : w.melee || w.thrown ? 'Blade' : 'Gun',   // throwing knives count as blades
    mag: w.melee ? '-' : w.mag,
    rate: (1 / w.fireDelay).toFixed(1),
    kill: kills(CFG.enemy.grunt.hp) + ' / ' + kills(CFG.enemy.heavy.hp),
    range: w.melee ? (w.reach / TILE).toFixed(1) : w.range >= 1000 ? 'any' : (w.range / TILE).toFixed(0),
    reload: w.melee ? '-' : w.reload + 's',
  };
}

/** The weapon chart for one slot: every weapon side by side with its stats. Click a row to equip it. */
function gunChartHtml(slot) {
  return '<p class="sub">Slot ' + (slot + 1) + ': click a row to put that weapon here. One that is already in another slot swaps places.</p>' +
    '<table class="chart"><thead><tr><th>Weapon</th><th>Type</th><th>Mag</th><th>Shots/s</th><th>Kill</th><th>Range</th><th>Reload</th></tr></thead><tbody>' +
    gunPool().map(id => {
      const g = gunStats(id), at = loadout.indexOf(id);
      return '<tr class="' + (at === slot ? 'on' : '') + '" data-choose="' + id + '"><td>' + WEAPONS[id].name +
             (at >= 0 ? ' <span class="note">' + (at === slot ? 'here' : 'slot ' + (at + 1)) + '</span>' : '') + '</td>' +
             '<td>' + g.type + '</td><td>' + g.mag + '</td><td>' + g.rate + '</td><td>' + g.kill + '</td><td>' + g.range + '</td><td>' + g.reload + '</td></tr>';
    }).join('') +
    '</tbody></table><p class="foot">Kill = hits to drop a grunt / a heavy. Range is in tiles. <button type="button" data-back>Back</button></p>';
}

/** Puts a gun in a weapon slot (0 to 2). If it was already in another slot, the two swap. */
function assignSlot(i, id) {
  if (!WEAPONS[id] || WEAPONS[id].carryOnly || loadout[i] === id) return;
  if (randomGunsNow() && state === 'play') { Sound.click(); say('Hard mode: guns are random. Cyberware can still be changed', 2); return; }
  if (loadoutLocked()) { denyChange(); return; }
  const other = loadout.indexOf(id);
  if (other >= 0) loadout[other] = loadout[i];
  loadout[i] = id;
  if (player.finite && other < 0) { player.ammo[id] = WEAPONS[id].mag; player.reserve[id] = WEAPONS[id].thrown ? 0 : WEAPONS[id].mag * randInt(...SPARE_MAGS); }   // a fresh gun from the AV (knives: no spares)
  if (!randomGunsNow()) {                                  // on hard (random guns), a change only lasts for this run
    manualLoadout = [...loadout];
    try { localStorage.setItem(LOADOUT_KEY, JSON.stringify(manualLoadout)); } catch (err) { /* fine */ }
  }
  // if the gun in your hands just left the loadout, you are now holding its replacement
  if (player.weapon !== 'pistol' && !loadout.includes(player.weapon)) { player.weapon = id; player.reloadTimer = 0; }
  if (!loadout.includes(player.prevWeapon)) player.prevWeapon = id;
  Sound.click();
  if (cyberOpen) renderCyber();
}

/** Weapons and cyberware can only be swapped at the AV. True while a run is on and you are not standing in the evac zone. */
function loadoutLocked() {
  return state === 'play' && !(floorIdx === 0 && tileAt(tileOf(player.x), tileOf(player.y)) === 'X');
}
function denyChange() {
  Sound.click(); say('Go to the evac zone to change gear', 2.5);
  if (cyberOpen) renderCyber();
}

function selectCyber(id) {
  if (!CYBERWARE[id]) return;
  if (loadoutLocked()) { denyChange(); return; }
  const prev = selectedCyber;
  selectedCyber = id;
  if (!canPair(id)) selectedCyber2 = null;                 // the Sandevistan takes both slots
  else if (selectedCyber2 === id) selectedCyber2 = canPair(prev) ? prev : null;  // picked your G piece for F: they swap
  saveCyber();
  Sound.click();
  if (cyberOpen) renderCyber();
}

/** Clicking a card in the cyberware menu: pick up to two (the first on F, the second on G), click a picked one to drop it.
    The Sandevistan always takes both slots on its own. */
function toggleCyberCard(id) {
  if (!CYBERWARE[id]) return;
  if (loadoutLocked()) { denyChange(); return; }
  if (!canPair(id) || !canPair(selectedCyber)) { selectCyber(id); return; }        // Sandevistan in or out: it stands alone
  if (id === selectedCyber2) selectedCyber2 = null;                                 // drop the G one
  else if (id === selectedCyber) {                                                  // drop the F one: G moves up to F
    if (!selectedCyber2) return;                                                    // always keep at least one
    selectedCyber = selectedCyber2; selectedCyber2 = null;
  }
  else if (!selectedCyber2) selectedCyber2 = id;                                    // free second slot: take it
  else selectedCyber2 = id;                                                         // both full: swap out the G one
  saveCyber(); Sound.click();
  if (cyberOpen) renderCyber();
}

/** Puts a second piece of cyberware (or nothing) on the second key. Never with the Sandevistan. */
function selectCyber2(id) {
  if (loadoutLocked()) { denyChange(); return; }
  if (id && (!canPair(id) || !canPair(selectedCyber))) return;
  if (id === selectedCyber) { selectedCyber = selectedCyber2 || selectedCyber; }     // swap with the first slot
  selectedCyber2 = id && id !== selectedCyber ? id : null;
  saveCyber();
  Sound.click();
  if (cyberOpen) renderCyber();
}
function saveCyber() {
  try { localStorage.setItem(CYBER_KEY, selectedCyber); localStorage.setItem(CYBER2_KEY, selectedCyber2 || ''); } catch (err) { /* fine */ }
}
function cycleCyber(dir) {
  const ids = Object.keys(CYBERWARE);
  selectCyber(ids[(ids.indexOf(selectedCyber) + dir + ids.length) % ids.length]);
}

function toggleCyber(force) {
  cyberOpen = force === undefined ? !cyberOpen : force;
  gunPick = null;
  if (cyberOpen) { toggleBinds(false); renderCyber(); cyberEl.classList.add('show'); }
  else cyberEl.classList.remove('show');
}

cyberEl.addEventListener('click', e => {
  const opt = e.target.closest('[data-cyber]');
  if (opt) { toggleCyberCard(opt.dataset.cyber); return; }
  const two = e.target.closest('[data-cyber2]');
  if (two) { selectCyber2(two.dataset.cyber2 || null); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { cyberTab = tab.dataset.tab; gunPick = null; renderCyber(); return; }
  const pickBtn = e.target.closest('[data-pick]');
  if (pickBtn) { if (loadoutLocked()) denyChange(); else { gunPick = +pickBtn.dataset.pick; renderCyber(); } return; }             // open the weapon chart for that slot
  const row = e.target.closest('[data-choose]');
  if (row && gunPick !== null) { const slot = gunPick; gunPick = null; assignSlot(slot, row.dataset.choose); renderCyber(); return; }
  if (e.target.closest('[data-back]')) { gunPick = null; renderCyber(); return; }
});

let pickerReturn = null;              // the screen the new-map picker was opened over, to put back if you cancel

/** Opens the new-map picker: three difficulties, plus a way back. Works mid-run (the game pauses), after a win, or after dying. */
function nextMap() {
  if (state === 'title') return;
  if (pickingDiff) { closePicker(); return; }             // the same key again backs out
  pickingDiff = true; mouse.down = false;
  toggleBinds(false); toggleCyber(false);
  pickerReturn = state === 'play' ? null : { title: oTitle.textContent, body: oBody.innerHTML, hint: oHint.textContent };
  const back = state === 'play' ? 'Back to playing' : 'Back';
  showOverlay(state === 'win' ? 'Next map' : 'New map', 'Pick how hard the new building should be, or try wave mode. The current map is thrown away.',
    'Press 1 to 4, or click one. Esc goes back.',
    Object.keys(DIFFICULTY).map((id, i) => '<button type="button" data-diff="' + id + '"><strong><kbd>' + (i + 1) + '</kbd>' + DIFFICULTY[id].label +
      '</strong><small>' + DIFFICULTY[id].blurb + (id === 'waves' && bestWave ? '. Best: wave ' + bestWave : '') + '</small></button>').join('') +
    '<button type="button" class="back" data-back-play>' + back + '</button>');
}

/** Cancels the new-map picker: back to the run, or back to the win or death screen it was opened over. */
function closePicker() {
  if (!pickingDiff) return;
  pickingDiff = false;
  if (pickerReturn) showOverlay(pickerReturn.title, pickerReturn.body, pickerReturn.hint);
  else hideOverlay();
  pickerReturn = null;
}

/** Rolls a brand new building at that difficulty and drops you in. The old map is gone for good. */
function chooseDifficulty(diff) {
  if (!pickingDiff || !DIFFICULTY[diff]) return;
  pickingDiff = false;
  newLevel(diff);
  startMission();
}
oChoices.addEventListener('click', e => {
  const btn = e.target.closest('[data-diff]');
  if (btn) chooseDifficulty(btn.dataset.diff);
  else if (e.target.closest('[data-back-play]')) closePicker();
});

/** Which track the soundtrack should be on right now. */
function musicMood() {
  if (window.__forceMood) return window.__forceMood;      // test hook: lets a recording pin one track
  if (state !== 'play') return 'menu';
  if (clients.some(c => c.crit && !c.extracted && c.timeLeft <= 30)) return 'critical';
  if (clients.some(c => c.carried)) return 'extract';
  return enemies.some(e => e.state === 'chase') ? 'combat' : 'stealth';
}

function say(text, seconds = 3) { banner = { text, t: seconds }; }
function addShake(n) { shake = Math.min(7, shake + n); }

/** Wave mode: waits for you to enter the building, then sends wave after wave. Clearing one gives a breather and a medkit. */
function updateWaves(dt) {
  if (!diffOf(level).waves) return;
  if (!wave.started) {
    if (floorIdx === 0 && roomAt(player.x, player.y) >= 0) { wave.started = true; wave.rest = 2; say('They know you are here', 2); Sound.alarm(); }
    return;
  }
  if (wave.rest > 0) {
    wave.rest -= dt;
    if (wave.rest <= 0) spawnWave();
    return;
  }
  if (!enemies.some(e => !e.dead)) {
    wave.best = wave.n;
    if (wave.n > bestWave) {                              // new record
      bestWave = wave.n;
      try { localStorage.setItem('flatline.bestWave', String(bestWave)); } catch (err) { /* fine */ }
    }
    wave.rest = WAVES.rest;
    player.medkits++;
    player.hp = CFG.player.hp;                               // between waves: full health
    player.burn = 0; player.blind = 0;
    say('Wave ' + wave.n + ' cleared. Healed, +1 medkit', 3.5);
    Sound.win();
  }
}

/** Wave mode: skip the rest of the break and bring the next wave in now. */
function skipWaveRest() {
  if (state !== 'play' || !diffOf(level).waves || !wave.started || wave.n === 0 || wave.rest <= 0) return;
  wave.rest = 0;
  spawnWave();
}

/** Spawns the next wave: spread over spots far from you and out of your sight, all of them hunting you. */
function spawnWave() {
  wave.n++;
  const n = wave.n, count = WAVES.size(n), spots = [];
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    if (tileAt(tx, ty) !== '.') continue;
    const x = tx * TILE + TILE / 2, y = ty * TILE + TILE / 2;
    if (roomAt(x, y) < 0 && ty < STREET_TOP) continue;
    if (Math.hypot(x - player.x, y - player.y) < WAVES.minSpawnDist || hasLOS(x, y, player.x, player.y)) continue;
    spots.push({ x, y });
  }
  const bossCount = WAVES.bosses(n);
  for (let i = 0; i < count && spots.length; i++) {
    const s = spots.splice(randInt(0, spots.length - 1), 1)[0];
    const type = Math.random() < WAVES.drone(n) ? 'drone' : Math.random() < WAVES.shield(n) ? 'shield' : Math.random() < WAVES.hacker(n) ? 'hacker' : Math.random() < WAVES.heavy(n) ? 'heavy' : 'grunt';
    const isBoss = i < bossCount;
    const e = makeEnemy(isBoss ? (Math.random() < 0.5 ? 'heavy' : 'grunt') : type, s.x, s.y);
    e.hp = Math.max(1, Math.round(e.cfg.hp * WAVES.hpMult(n)));
    if (e.type === 'drone') e.hp = 1;                     // drones always die to one hit
    if (isBoss) makeBoss(e);
    e.hunter = true; e.born = missionTime; e.pingT = rand(0.2, 1.5);
    e.state = 'chase'; e.lastX = player.x + rand(-40, 40); e.lastY = player.y + rand(-40, 40); e.pathTimer = 0;
    enemies.push(e);
  }
  say('Wave ' + n + ': ' + count + ' incoming' + (bossCount ? (bossCount > 1 ? ', ' + bossCount + ' elites' : ', elite') : ''), 3);
  Sound.alarm();
}

/** Turns a freshly made enemy into a boss: lots more health, a real gun, and either a Sandevistan or one or two quickhacks. */
function makeBoss(e) {
  do { e.weapon = rollEnemyWeapon(); } while (e.weapon === 'pistol');
  e.burstLeft = ENEMY_WEAPONS[e.weapon].burst;
  e.hp = Math.round(e.hp * BOSS.hpMult); e.maxHp = e.hp;
  const pickHacks = () => { const h = [...BOSS.hacks]; for (let i = h.length - 1; i > 0; i--) { const j = randInt(0, i); [h[i], h[j]] = [h[j], h[i]]; } return h.slice(0, randInt(1, 2)); };
  e.boss = Math.random() < 0.4 ? { sandy: 0, sandyCd: rand(2, 5), hacks: [], hackCd: 0, cast: null, castT: 0, trail: [] }
                               : { sandy: 0, sandyCd: 0, hacks: pickHacks(), hackCd: rand(2, 4), cast: null, castT: 0, trail: [] };
  e.boss.hasSandy = !e.boss.hacks.length;
  e.look = { ...e.look, accent: YELLOW };
}

/** Boss turn: trigger its Sandevistan, or wind up a quickhack on you (warned by a gold line), when it can see you. */
function updateBoss(e, dt, sees, dist) {
  const b = e.boss;
  if (b.sandy > 0) {
    b.sandy -= dt;
    b.trail.push({ x: e.x, y: e.y, a: e.angle, life: 0.45 });
  }
  for (const t of b.trail) t.life -= dt;
  b.trail = b.trail.filter(t => t.life > 0).slice(-14);
  if (b.hasSandy) {
    b.sandyCd -= dt;
    if (sees && b.sandyCd <= 0) { b.sandy = BOSS.sandy.duration; b.sandyCd = BOSS.sandy.cooldown; Sound.tone(90, 0.5, 'sawtooth', 0.3, 900); }
    return;
  }
  if (b.cast) {
    b.castT -= dt;
    if (player.dead) { b.cast = null; return; }                  // locked on: only killing the elite stops it
    if (b.castT <= 0) { bossHack(b.cast); b.cast = null; b.hackCd = rand(...BOSS.hackCooldown); }
    return;
  }
  b.hackCd -= dt;
  if (sees && dist < BOSS.hackRange && b.hackCd <= 0) { b.cast = b.hacks[randInt(0, b.hacks.length - 1)]; b.castT = BOSS.hackWarn; Sound.tone(500, 0.3, 'square', 0.15, 1200); }
}

/** A boss quickhack lands on you. */
function bossHack(id) {
  const p = player;
  if (id === 'overheat') { p.burn = BOSS.playerBurn; p.burnTick = 0.5; say('Overheated!', 1.5); Sound.tone(200, 0.35, 'sawtooth', 0.25, 900); }
  else if (id === 'optics') { p.blind = BOSS.playerBlind; glitchT = 0.3; say('Optics rebooting!', 1.5); Sound.tone(1400, 0.25, 'square', 0.15, 90); }
  else if (id === 'detonate') {                             // your own grenade goes off at your feet: move!
    grenades.push({ x: p.x, y: p.y, vx: 0, vy: 0, fuse: 0.8, flight: 0 });
    say('Grenade at your feet!', 1.5); Sound.tick();
  }
}

/** A critical client is on a real-time clock from the moment you deploy. It only stops when they are in the evac zone. */
function updateCritical(dt) {
  if (player && player.sandy > 0) dt *= CFG.critSandySlow;  // the Sandevistan slows the bleed-out clock too, but not as much as the world
  for (const c of clients) {
    if (!c.crit || c.extracted) continue;
    const before = Math.ceil(c.timeLeft);
    c.timeLeft -= dt;
    if (c.timeLeft <= 10 && Math.ceil(c.timeLeft) !== before) Sound.tick();     // last ten seconds tick
    if (c.timeLeft <= 0) { loseMission(); return; }
  }
}

function loseMission() {
  for (const c of clients) c.carried = false;
  hackGame = null;
  state = 'dead';
  addShake(5); Sound.die();
  showOverlay('Client flatlined', 'The critical client bled out before you got them to the evac.', 'Press ' + kl('restart') + ' to respawn, or 0 for a new map');
}

/** A net hacker's upload finished: no gun fires for this many seconds. Blades are unaffected. */
function jamPlayer(seconds) {
  player.jam = seconds;
  glitchT = 0.35; addShake(2);
  Sound.tone(900, 0.4, 'sawtooth', 0.25, 80);
  say('Guns jammed! Blades still work', 2.5);
}

function killPlayer() {
  player.dead = true; client.carried = false; hackGame = null;
  state = 'dead';
  spawnBlood(player.x, player.y, rand(0, 6.28), 26);
  addShake(7); Sound.die();
  const msg = diffOf(level).waves ? 'You made it to wave <b>' + wave.n + '</b> and cleared <b>' + wave.best + '</b>. Kills <b>' + kills + '</b>. Best ever: <b>' + bestWave + '</b>.' : 'The client is still in there.';
  showOverlay('You flatlined', msg, 'Press ' + kl('restart') + ' to respawn, or 0 for a new map');
}

function winMission() {
  state = 'win'; Sound.win(); hackGame = null;
  const sc = missionScore(), diff = level.diff || 'medium', prev = bestGrades[diff];
  const rank = g => GRADE_RANK.indexOf(g);
  const isBest = !prev || rank(sc.grade) > rank(prev.grade) || (sc.grade === prev.grade && sc.total > prev.total);
  if (isBest) { bestGrades[diff] = { grade: sc.grade, total: sc.total }; try { localStorage.setItem(GRADES_KEY, JSON.stringify(bestGrades)); } catch (err) { /* fine */ } }
  const gradeCol = { 'S+': '#ff6af0', S: '#f9f871', A: '#39ff88', B: '#05d9e8', C: '#ff9a1f', D: '#ff2a6d' }[sc.grade];
  const row = ([label, detail, pts, max]) => '<tr><td style="text-align:left;padding:2px 12px 2px 0">' + label + '</td><td style="text-align:left;padding:2px 12px 2px 0;opacity:.75">' + detail +
    '</td><td style="text-align:right;padding:2px 0"><b>' + pts + '</b>/' + max + '</td></tr>';
  showOverlay((clients.length > 1 ? 'Clients' : 'Client') + ' extracted',
    '<div style="font-size:48px;line-height:1;color:' + gradeCol + ';text-shadow:0 0 14px ' + gradeCol + ';margin:4px 0 10px">' + sc.grade + '</div>' +
    '<table style="margin:0 auto;border-collapse:collapse">' + sc.rows.map(row).join('') +
    '<tr><td style="text-align:left;padding:6px 12px 0 0"><b>Score</b></td><td></td><td style="text-align:right;padding:6px 0 0"><b>' + sc.core + '</b>/100</td></tr>' +
    '<tr style="color:#ff6af0"><td style="text-align:left;padding:6px 12px 0 0">' + sc.stealth[0] + '</td><td style="text-align:left;padding:6px 12px 0 0;opacity:.75">' + sc.stealth[1] +
    '</td><td style="text-align:right;padding:6px 0 0"><b>+' + sc.stealth[2] + '</b>/' + sc.stealth[3] + '</td></tr></table>' +
    (sc.grade === 'S' ? '<p style="margin:6px 0 0;opacity:.75">Stay hidden (stealth ' + SCORE.plusStealth + '+) on an S run for S+</p>' : '') +
    '<p style="margin:10px 0 0">Map <b>' + levelNum + '</b> ' + diffOf(level).label + ' &nbsp; Kills <b>' + kills + '</b></p>' +
    '<p style="margin:4px 0 0;color:' + (isBest ? '#f9f871' : 'inherit') + '">' + (isBest ? 'New best on ' + diffOf(level).label + '!' : 'Best on ' + diffOf(level).label + ': ' + prev.grade + ' (' + prev.total + ')') + '</p>',
    'Press 0 for a new map');
}

/* =====================================================================
   9. PLAYER
   ===================================================================== */
function useMedkit() {
  if (state !== 'play') return;
  const p = player;
  if (p.medkits <= 0) { say('No medkits', 1); return; }
  if (p.hp >= CFG.player.hp) { say('Health already full', 1); return; }
  p.medkits--;
  p.hp = Math.min(CFG.player.hp, p.hp + CFG.medkit.heal);
  spawnSparks(p.x, p.y, '#5dff9b', 12); Sound.stim();
}

/** Lobs a grenade toward the cursor. It bounces off walls and blows when the fuse runs out. */
function throwGrenade() {
  if (state !== 'play') return;
  const p = player, g = CFG.grenade;
  if (p.grenadeCooldown > 0) { say('Grenade ready in ' + Math.ceil(p.grenadeCooldown) + 's', 1); Sound.click(); return; }
  const m = screenToWorld(mouse.sx, mouse.sy);
  const dist = Math.min(g.maxThrow, Math.hypot(m.x - p.x, m.y - p.y));
  const flight = g.fuse * 0.75, speed = dist / flight;     // lands on the cursor, then sits briefly
  grenades.push({ x: p.x, y: p.y, vx: Math.cos(p.angle) * speed, vy: Math.sin(p.angle) * speed, fuse: g.fuse, flight });
  p.grenadeCooldown = g.cooldown;
  Sound.click(); breakCamo();
}

function updateGrenades(dt) {
  for (const gr of grenades) {
    if (gr.flight > 0) {
      gr.flight -= dt;
      if (gr.flight <= 0) {                                // it clatters to the floor: everyone in that room hears it
        const room = roomAt(gr.x, gr.y);
        for (const e of enemies) if (!e.dead && e.state !== 'chase' && (room >= 0 ? roomAt(e.x, e.y) === room : hears(e, gr.x, gr.y, AI.hear.grenade))) {
          e.startleT = gr.fuse + 0.1; e.startleX = gr.x; e.startleY = gr.y; e.wonderT = e.startleT;   // they freeze and stare at it; the blast is what sends them in
        }
      }
      const nx = gr.x + gr.vx * dt;
      if (blocksSight(tileOf(nx), tileOf(gr.y))) gr.vx *= -0.5; else gr.x = nx;
      const ny = gr.y + gr.vy * dt;
      if (blocksSight(tileOf(gr.x), tileOf(ny))) gr.vy *= -0.5; else gr.y = ny;
    }
    gr.fuse -= dt;
    if (gr.fuse <= 0) explode(gr.x, gr.y);
  }
  grenades = grenades.filter(gr => gr.fuse > 0);
  for (const b of blasts) b.t -= dt;
  blasts = blasts.filter(b => b.t > 0);
}

/** Smashes a door (and the other half of a double door) for good. Shotgun blasts and grenades do this. */
function breakDoor(tx, ty) {
  const stack = [[tx, ty]];
  let broke = false;
  while (stack.length) {
    const [x, y] = stack.pop();
    if (tileAt(x, y) !== 'D' || doorOpen[y * COLS + x] === 2) continue;
    doorOpen[y * COLS + x] = 2;          // 0 closed, 1 open, 2 destroyed
    broke = true;
    const cx = x * TILE + TILE / 2, cy = y * TILE + TILE / 2;
    spawnSparks(cx, cy, YELLOW, 8);
    decals.fillStyle = '#8a8540';        // splinters left on the floor
    for (let i = 0; i < 6; i++) decals.fillRect(Math.round(cx + rand(-11, 11)), Math.round(cy + rand(-11, 11)), randInt(1, 3), 1);
    for (const [dx, dy] of DIRS) stack.push([x + dx, y + dy]);
  }
  if (broke) {
    addShake(2.5); Sound.door(); Sound.noise(0.14, 0.45);
    // the crash is heard by everyone in the rooms on either side: they flinch and stare at the door, then come to check it
    const cx = tx * TILE + TILE / 2, cy = ty * TILE + TILE / 2, rooms = new Set();
    for (const [dx, dy] of DIRS) for (let k = 1; k <= 2; k++) { const r = roomAt(cx + dx * TILE * k, cy + dy * TILE * k); if (r >= 0) rooms.add(r); }
    for (const e of enemies) {
      if (e.dead || e.state === 'chase') continue;
      const r = roomAt(e.x, e.y);
      if (rooms.has(r) || (r < 0 && hears(e, cx, cy, AI.hear.door))) { e.startleT = AI.doorStartle; e.startleX = cx; e.startleY = cy; e.startleThen = true; e.wonderT = e.startleT; }
    }
  }
}

/* The explosion burst drawn on barrels, 9 x 8 pixels ('#' = black): thin spikes flaring up from a flat, notched base. */
const BURST_ART = [
  '....#....',
  '#...#...#',
  '.#..#..#.',
  '.#.###.#.',
  '..#####..',
  '.#######.',
  '#########',
  '##.#.#.##',
];
const BURST_PX = [], BURST_RIM = [];
BURST_ART.forEach((row, y) => [...row].forEach((c, x) => { if (c === '#') BURST_PX.push([x, y]); }));
{
  const on = (x, y) => (BURST_ART[y] || '')[x] === '#';
  for (let y = -1; y <= BURST_ART.length; y++) for (let x = -1; x <= 9; x++) {
    if (on(x, y)) continue;
    if (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1)) BURST_RIM.push([x, y]);
  }
}

/** The live explosive barrel on this tile, if any. */
function barrelAt(tx, ty) {
  const st = floorStates[floorIdx];
  return st ? st.barrels.find(b => b.alive && b.x === tx && b.y === ty) || null : null;
}

/** Sets off a barrel: the tile clears, a scorch mark stays, and it blows like a grenade. */
function explodeBarrel(br) {
  br.alive = false;
  tiles[br.y][br.x] = '.';
  const x = br.x * TILE + TILE / 2, y = br.y * TILE + TILE / 2;
  decals.fillStyle = 'rgba(10,5,10,0.6)'; decals.beginPath(); decals.arc(x, y, 14, 0, Math.PI * 2); decals.fill();
  explode(x, y);
}

function explode(x, y, g = CFG.grenade) {
  // nearby barrels catch the blast and go up a moment later: chain reactions
  for (const br of floorStates[floorIdx].barrels) {
    if (!br.alive) continue;
    const bx = br.x * TILE + TILE / 2, by = br.y * TILE + TILE / 2;
    if (Math.hypot(bx - x, by - y) < g.radius) { br.alive = false; tiles[br.y][br.x] = '.'; grenades.push({ x: bx, y: by, vx: 0, vy: 0, fuse: 0.15, flight: 0, silent: true }); }
  }
  // doors caught in the blast go first, so the explosion carries through the doorway
  for (const d of doors) {
    if (Math.hypot(d.x * TILE + TILE / 2 - x, d.y * TILE + TILE / 2 - y) < g.radius) breakDoor(d.x, d.y);
  }
  for (const cm of floorStates[floorIdx].cameras || []) if (cm.alive && Math.hypot(cm.x - x, cm.y - y) < g.radius && hasLOS(x, y, cm.x, cm.y)) destroyCamera(cm);
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    if (hears(e, x, y, AI.hear.blast)) alertEnemy(e, x, y);      // a blast is loud, but walls still muffle it
    if (d < g.radius && hasLOS(x, y, e.x, e.y)) {
      damageEnemy(e, Math.atan2(e.y - y, e.x - x), g.dmg + (g.minDmg - g.dmg) * (d / g.radius));
    }
  }
  // your own grenade hurts you too
  if (Math.hypot(player.x - x, player.y - y) < g.radius && hasLOS(x, y, player.x, player.y)) {
    for (let i = 0; i < g.selfDmg && !player.dead; i++) damagePlayer(Math.atan2(player.y - y, player.x - x));
  }
  blasts.push({ x, y, t: 0.45, life: 0.45, r: g.radius });
  spawnSparks(x, y, YELLOW, 30); spawnSparks(x, y, '#ff9a1f', 24);
  spawnSmoke(x, y, 16, 18, '#6f6688'); spawnSmoke(x, y, 8, 8, '#3a3350');
  addLight(x, y, 150, '#ffb347', 0.5, 0.85);
  if (!isSolid(tileOf(x), tileOf(y))) {                    // scorch mark burnt into the floor
    const sg = decals.createRadialGradient(x, y, 2, x, y, 20);
    sg.addColorStop(0, 'rgba(6,3,8,0.7)'); sg.addColorStop(1, 'rgba(6,3,8,0)');
    decals.fillStyle = sg; decals.fillRect(x - 20, y - 20, 40, 40);
  }
  addShake(7); Sound.boom();
}

/* ---------- cyberware: Sandevistan and quickhacks ---------- */
let lastCyberTap = 0;                 // when the cyberware key was last pressed, for double-tap items

function useCyber(id = selectedCyber) {
  if (state !== 'play' || !CYBERWARE[id]) return;
  const p = player, c = CYBERWARE[id];
  if ((id === 'sandevistan' && p.sandy > 0) || (id === 'smartlink' && p.smart > 0) || (id === 'camo' && p.camo > 0)) return;   // already running
  if (p.cyberCd[id] > 0) { say(c.name + ' ready in ' + Math.ceil(p.cyberCd[id]) + 's', 1); Sound.click(); return; }
  if (c.doubleTap) {                                       // needs two quick presses, so it never goes off by accident
    const now = Date.now();
    if (now - lastCyberTap > c.doubleTap * 1000) { lastCyberTap = now; Sound.click(); return; }
    lastCyberTap = 0;
  }
  if (id === 'sandevistan') {
    p.sandy = c.duration; p.ghostTimer = 0; ghosts = [];
    p.cyberCd[id] = c.cooldown;                            // the cooldown counts down from the moment you trigger it
    Sound.tone(110, 0.5, 'sawtooth', 0.3, 1400);
  } else if (id === 'smartlink') {
    p.smart = c.duration;
    p.cyberCd[id] = c.cooldown;                            // the cooldown counts down from the moment you trigger it
    Sound.tone(600, 0.25, 'square', 0.2, 1500); Sound.tick();
  } else if (id === 'camo') {
    p.camo = c.duration;
    p.cyberCd[id] = c.cooldown;                            // the cooldown counts down from the moment you trigger it
    Sound.tone(1200, 0.4, 'sine', 0.2, 300);
  } else {
    const target = hackTarget(hackLine(id));
    if (!target) { say('No enemy on the hack line', 1); Sound.click(); return; }   // a miss costs nothing
    if (id === 'overheat') {                              // area burn, two charges inside a short window
      for (const e of enemies) if (!e.dead && Math.hypot(e.x - target.x, e.y - target.y) <= c.radius && (e === target || hasLOS(target.x, target.y, e.x, e.y))) applyHack(id, e);
      spawnRing(target.x, target.y, c.radius);
      if (p.ohWindow > 0) p.ohLeft--; else { p.ohLeft = c.charges - 1; p.ohWindow = c.window; }
      if (p.ohLeft <= 0) { p.ohLeft = 0; p.ohWindow = 0; p.cyberCd[id] = c.cooldown; }
      return;
    }
    applyHack(id, target);
    p.cyberCd[id] = c.cooldown;
  }
}

/** The quickhack aim line: from you toward the cursor, as long as the hack's range, cut short by walls. */
function hackLine(id = selectedCyber) {
  const p = player, range = CYBERWARE[id].range || 0;
  const dx = Math.cos(p.angle), dy = Math.sin(p.angle);
  let len = 0;
  while (len < range && !blocksSight(tileOf(p.x + dx * (len + 3)), tileOf(p.y + dy * (len + 3)))) len += 3;
  return { x: p.x, y: p.y, dx, dy, len: Math.min(len, range) };
}

/** First enemy standing on the hack line, or null. */
function hackTarget(line) {
  let best = null, bestT = Infinity;
  for (const e of enemies) {
    if (e.dead) continue;
    const rx = e.x - line.x, ry = e.y - line.y;
    const along = rx * line.dx + ry * line.dy;                // how far down the line
    const side = Math.abs(rx * line.dy - ry * line.dx);       // how far off to the side
    if (along > 0 && along <= line.len + e.r && side <= e.r + 5 && along < bestT) { best = e; bestT = along; }
  }
  return best;
}

/** What each quickhack does to its target. New quickhacks get a case here. */
/** Optical Camo ends the moment you attack. */
function breakCamo() {
  if (!(player.camo > 0)) return;
  player.camo = 0;
  say('Camo broken', 1.2); Sound.tone(300, 0.25, 'sine', 0.15, 1200);
}

function applyHack(id, e) {
  breakCamo();
  const c = CYBERWARE[id];
  switch (id) {
    case 'overheat':                                       // scaled to the target's health, so the kill time is the same for everyone
      e.burn = c.ttk + 0.15; e.burnDps = e.cfg.hp / c.ttk;
      spawnSparks(e.x, e.y, '#ff9a1f', 14);
      Sound.tone(200, 0.35, 'sawtooth', 0.25, 900);
      break;
    case 'detonate':
      e.cook = c.fuse;
      Sound.tone(900, 0.08, 'square', 0.2); Sound.tick();
      break;
  }
  alertEnemy(e, player.x, player.y);
}

function switchWeapon(id) {
  if (state !== 'play' || player.weapon === id) return;
  if (client.carried) { say('Pistol only while carrying the client', 1.5); return; }
  player.weapon = id;
  player.reloadTimer = 0;                                  // switching cancels a reload
  player.fireTimer = Math.max(player.fireTimer, 0.2);      // short draw time
  Sound.click();
}

/** Does this gun use limited ammo right now? Only with random guns on; the carry pistol and blades never run dry. */
function finiteAmmo(id) { const w = WEAPONS[id]; return !!(player && player.finite && w && !w.carryOnly && !w.melee); }

function startReload() {
  if (state !== 'play') return;
  const p = player, w = WEAPONS[p.weapon];
  if (p.reloadTimer > 0 || p.ammo[p.weapon] >= w.mag || w.melee) return;
  if (finiteAmmo(p.weapon) && p.reserve[p.weapon] <= 0) { Sound.click(); say(w.thrown ? 'Out of knives. Walk over thrown ones to pick them up' : 'No spare ammo. Hold ' + kl('interact') + ' on a dropped weapon', 1.8); return; }
  p.reloadTimer = w.reload;
  Sound.reload();
}

/** Melee attack. The katana cuts an arc around you; mantis blades thrust a long narrow rectangle straight ahead.
    Kills everything in that zone that is not behind a wall or behind its own raised riot shield. Makes no noise. */
function meleeSwing(w) {
  const p = player, ca = Math.cos(p.angle), sa = Math.sin(p.angle);
  p.fireTimer = w.fireDelay; p.slash = 0.14; p.slashWeapon = p.weapon;
  addShake(w.shake); Sound.slash(); breakCamo();
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - p.x, dy = e.y - p.y;
    let inZone;
    let blades = 2;                                        // how many blades connect. The katana always counts as a full hit.
    if (w.rect) {
      // each mantis blade is its own line, bladeGap apart. A target dead ahead catches both; one off to the side catches one.
      const along = dx * ca + dy * sa, side = dx * sa - dy * ca;
      blades = along > 0 && along <= w.reach + e.r ? [-1, 1].filter(k => Math.abs(side - k * w.bladeGap / 2) <= e.r + 1).length : 0;
      inZone = blades > 0;
    } else {
      inZone = Math.hypot(dx, dy) <= w.reach + e.r && Math.abs(angDiff(Math.atan2(dy, dx), p.angle)) <= w.arc / 2;
    }
    if (!inZone || !hasLOS(p.x, p.y, e.x, e.y)) continue;
    if (shieldBlocks(e, Math.atan2(-dy, -dx))) { spawnSparks(e.x, e.y, '#eaffff', 6); Sound.click(); alertEnemy(e, p.x, p.y); continue; }
    damageEnemy(e, p.angle, blades === 2 ? 9999 : Math.ceil(e.cfg.hp / 2));   // one blade: half its health, so a second hit finishes it
  }
  for (const cm of floorStates[floorIdx].cameras || []) {   // blades smash cameras too
    if (cm.alive && Math.hypot(cm.x - p.x, cm.y - p.y) <= (w.reach || 20) + 6 && Math.abs(angDiff(Math.atan2(cm.y - p.y, cm.x - p.x), p.angle)) <= 1.2) destroyCamera(cm);
  }
}

function updatePlayer(dt) {
  const p = player, c = CFG.player;

  // movement
  let mx = 0, my = 0;
  if (held('up')) my -= 1;
  if (held('down')) my += 1;
  if (held('left')) mx -= 1;
  if (held('right')) mx += 1;
  const len = Math.hypot(mx, my);
  if (len && !hackGame) {
    let speed = c.speed;
    if (client.carried) speed *= c.carrySpeedMult;
    if (p.burn > 0) speed *= BOSS.playerBurnSlow;          // overheated by a boss
    const gunInHand = WEAPONS[p.weapon];                   // heavy guns slow you down while the trigger is held
    if (gunInHand.fireMoveMult && mouse.down && p.ammo[p.weapon] > 0 && p.reloadTimer <= 0) speed *= gunInHand.fireMoveMult;
    if (p.sandy > 0) speed *= CYBERWARE.sandevistan.speedMult;     // the Sandevistan also speeds you up for its whole run
    moveEntity(p, mx / len * speed * dt, my / len * speed * dt);
  }

  // stairs: stand on or right beside a staircase and press interact. This wins over dropping a client.
  const stair = stairNear();
  if (stair && ePressed) { ePressed = false; changeFloor(stair.up ? 1 : -1); }

  // the security room laptop: press interact to hack this floor's cameras
  const lap = !stair && laptopNear();
  if (lap && ePressed && !hackGame) {
    ePressed = false;
    if (lap.lockT > 0) { say('Laptop locked: ' + Math.ceil(lap.lockT) + 's', 1.5); Sound.click(); }
    else startHack(lap);
  }

  // random guns: hold interact over a dropped weapon to swap it for the one in your hands
  const drop = weaponNear();
  if (drop && held('interact') && !stair && !client.carried) {
    p.swapT += dt;
    if (p.swapT >= 0.5) { p.swapT = 0; takeWeapon(drop); }
  } else p.swapT = 0;

  // aim
  const m = screenToWorld(mouse.sx, mouse.sy);
  p.angle = Math.atan2(m.y - p.y, m.x - p.x);

  // timers
  p.fireTimer -= dt; p.muzzle -= dt; p.flash -= dt; p.slash -= dt; p.jam = Math.max(0, p.jam - dt);
  p.blind = Math.max(0, p.blind - dt);
  if (p.burn > 0) {                                        // overheated: 1 health a second until it burns out
    p.burn -= dt; p.burnTick -= dt;
    if (Math.random() < dt * 30) particles.push({ x: p.x + rand(-4, 4), y: p.y + rand(-4, 4), vx: rand(-12, 12), vy: rand(-45, -15), life: rand(0.2, 0.4), color: ['#ff9a1f', '#ffd23f'][randInt(0, 1)], size: 2, stain: false });
    if (p.burnTick <= 0) { p.burnTick = 1; damagePlayer(rand(0, 6.28)); if (p.dead) return; }
  }

  // shoot
  if (p.reloadTimer > 0) {                                 // reload in progress
    p.reloadTimer -= dt;
    if (p.reloadTimer <= 0) {
      const id = p.weapon, mag = WEAPONS[id].mag;
      if (finiteAmmo(id)) { const take = Math.min(mag - p.ammo[id], p.reserve[id]); p.ammo[id] += take; p.reserve[id] -= take; }
      else p.ammo[id] = mag;
      Sound.click();
    }
  }
  // charged guns (the railgun): the click starts a charge, and the shot leaves by itself when the charge finishes
  if (p.charge > 0) {
    p.charge -= dt;
    if (p.weapon !== p.chargeWeapon || p.jam > 0 || p.reloadTimer > 0 || p.dead) { p.charge = 0; if (p.chargeStop) p.chargeStop(); }      // switched guns or got jammed: the charge is lost
    else if (p.charge <= 0) p.fireNow = true;
  }
  if ((mouse.down || p.fireNow) && p.fireTimer <= 0 && p.reloadTimer <= 0 && !hackGame) {
    const w = WEAPONS[p.weapon];
    if (w.melee) {
      meleeSwing(w);
    } else if (p.jam > 0 && !w.thrown) {                   // jammed by a net hacker: guns only click (knives are blades, so they still work)
      p.fireTimer = 0.25; Sound.click();
    } else if (p.ammo[p.weapon] <= 0) {
      p.fireTimer = 0.25;
      if (finiteAmmo(p.weapon) && p.reserve[p.weapon] <= 0) { Sound.click(); say('Out of ammo. Hold ' + kl('interact') + ' on a dropped weapon', 1.5); }
      else startReload();                                  // empty with spares left: reload rather than click
    } else {
      if (w.charge && !p.fireNow) {                        // this click only starts the charge
        if (!(p.charge > 0)) { p.charge = w.charge; p.chargeWeapon = p.weapon; p.chargeStop = Sound.railCharge(w.charge); }
      } else {
      p.fireNow = false;
      p.ammo[p.weapon]--;
      const spread = w.spread;
      const side = w.akimbo ? (p.akimboSide = -(p.akimboSide || 1)) * 3.5 : 0;   // dual pistols fire from alternating hands
      for (let i = 0; i < w.pellets; i++) {
        spawnBullet(p.x + Math.cos(p.angle) * 8 - Math.sin(p.angle) * side, p.y + Math.sin(p.angle) * 8 + Math.cos(p.angle) * side,
                    p.angle + rand(-spread, spread),
                    w.bulletSpeed * (w.pellets > 1 ? rand(0.85, 1.1) : 1), 'player', w);
      }
      p.fireTimer = w.fireDelay;
      p.muzzle = w.thrown ? 0 : 0.05;
      if (!w.thrown) {                                     // the shot lights up the room for a frame or two, and leaves a wisp of smoke
        const mx = p.x + Math.cos(p.angle) * 14, my = p.y + Math.sin(p.angle) * 14;
        if (w.pierce) addLight(mx, my, 40, (WEAPON_ART[p.weapon] || {}).glow || '#ffd27a', 0.06, 0.22);
        if (Math.random() < (w.pellets > 1 || w.pierce ? 1 : 0.35)) spawnSmoke(mx, my, w.pellets > 1 ? 3 : 1, 2, '#9a94b8');
      }
      addShake(w.shake);
      if (w.pierce) beams.push({ x: p.x, y: p.y, a: p.angle, t: 0.35 });   // the rail's afterglow, straight through everything
      if (w.thrown) Sound.slash(); else Sound.gun(p.weapon);
      if (!w.thrown) alertByNoise();                       // knives make no sound at all
      breakCamo();
      if (p.ammo[p.weapon] <= 0) startReload();            // that was the last round: reload on its own
      }
    }
  }

  // walk over medkits to pocket them
  if (loadout.includes('knives')) {                        // walk over your thrown knives to take them back
    const ks = floorStates[floorIdx].knives;
    for (let i = ks.length - 1; i >= 0; i--) {
      if (Math.hypot(ks[i].x - p.x, ks[i].y - p.y) < 12 && p.ammo.knives < WEAPONS.knives.mag) { ks.splice(i, 1); p.ammo.knives++; Sound.tick(); }
    }
  }
  for (const k of pickups) {
    if (Math.hypot(k.x - p.x, k.y - p.y) < 12) { k.taken = true; p.medkits++; say('Medkit picked up. Press ' + kl('medkit') + ' to use', 2); Sound.tick(); }
  }
  pickups = pickups.filter(k => !k.taken);

  // cyberware timers run in real time, even while the world is slowed
  for (const id in p.cyberCd) p.cyberCd[id] = Math.max(0, p.cyberCd[id] - dt);
  if (p.ohWindow > 0 && (p.ohWindow -= dt) <= 0) { p.ohWindow = 0; p.ohLeft = 0; p.cyberCd.overheat = CYBERWARE.overheat.cooldown; }   // second Overheat not used in time
  if (p.camo > 0) {                                        // Optical Camo running out
    p.camo -= dt;
    if (p.camo <= 0) { p.camo = 0; Sound.tone(300, 0.3, 'sine', 0.15, 1200); }
  }
  if (p.smart > 0) {                                       // Smart Link running out
    p.smart -= dt;
    if (p.smart <= 0) { p.smart = 0; Sound.tone(1500, 0.25, 'square', 0.15, 300); }
  }
  if (p.sandy > 0) {
    p.sandy -= dt; p.ghostTimer -= dt;
    const last = ghosts[ghosts.length - 1];
    if (!last || Math.hypot(last.x - p.x, last.y - p.y) >= GHOST_GAP) {     // drop an afterimage
      p.ghostHue = (p.ghostHue + 47) % 360;                // each copy takes the next color
      ghosts.push({ x: p.x, y: p.y, angle: p.angle, hue: p.ghostHue, life: GHOST_LIFE,
                    carrying: client.carried, weapon: p.weapon, walk: p.walk });

    }
    if (p.sandy <= 0) {                                    // it ran out: the trail vanishes
      p.sandy = 0; ghosts = [];
      Sound.tone(880, 0.3, 'sawtooth', 0.2, 110);
    }
  }
  for (const gh of ghosts) gh.life -= dt;
  ghosts = ghosts.filter(gh => gh.life > 0);

  // grenade cooldown
  if (p.grenadeCooldown > 0) {
    p.grenadeCooldown -= dt;
    if (p.grenadeCooldown <= 0) { p.grenadeCooldown = 0; Sound.stim(); }
  }

  updateClient(dt);

  if (client.carried && tileAt(tileOf(p.x), tileOf(p.y)) === 'X') extractClient();
}

function damagePlayer(angle) {
  if (player.dead) return;
  if (hackGame) cancelHack('Hit! Hack interrupted');
  player.hp--; player.flash = 0.08; hurt = 1; glitchT = 0.2;
  spawnBlood(player.x, player.y, angle, 7);
  addShake(4); Sound.hurt();
  if (player.hp <= 0) killPlayer();
}

/* =====================================================================
   10. CLIENT  -  stabilize, carry, drop
   ===================================================================== */
function setWeapon(id) {
  player.weapon = id;
  player.reloadTimer = 0;
  player.fireTimer = Math.max(player.fireTimer, 0.25);
  Sound.click();
}

/** Carrying takes one arm: you are locked to the pistol until you put the client down. */
function pickUpClient() {
  client.carried = true;
  if (player.weapon !== 'pistol') player.prevWeapon = player.weapon;
  setWeapon('pistol');
}

function dropClient() {
  client.carried = false; client.x = player.x; client.y = player.y;
  setWeapon(player.prevWeapon);
}

/** Hands the carried client over at the evac zone. The mission is won once every client is out. */
function extractClient() {
  client.carried = false; client.extracted = true;
  const left = clients.filter(c => !c.extracted).length;
  if (!left) { winMission(); return; }
  setWeapon(player.prevWeapon);
  Sound.win();
  say('Client out. ' + left + ' still inside', 3.5);
}

function updateClient(dt) {
  const p = player;
  // the active client: whoever you are carrying, otherwise the closest one that is not out yet
  const waiting = clients.filter(c => !c.extracted);
  const dist = c => Math.hypot(c.x - p.x, c.y - p.y);
  const pool = waiting.some(c => c.f === floorIdx) ? waiting.filter(c => c.f === floorIdx) : waiting;   // ones on this floor first
  client = waiting.find(c => c.carried) || pool.reduce((a, b) => (dist(a) <= dist(b) ? a : b), pool[0]) || client;
  const cl = client;
  for (const c of waiting) if (c !== cl && !c.stabilized) c.progress = Math.max(0, c.progress - dt * 1.5);
  const near = cl.f === floorIdx && Math.hypot(cl.x - p.x, cl.y - p.y) < CFG.interactRange;

  if (!cl.stabilized) {
    if (near && held('interact')) {
      const before = Math.floor(cl.progress * 4);
      cl.progress += dt;
      if (Math.floor(cl.progress * 4) !== before) Sound.tick();
      if (cl.progress >= CFG.stabilizeTime) {
        cl.stabilized = true; pickUpClient();
        const bonus = cl.crit ? cl.f * CFG.critBonusPerFloor : 0;   // ground floor 0s, 2nd floor 30s, 3rd floor 60s
        if (bonus) {                                       // critical client stabilized upstairs: extra time for the trip down
          cl.timeLeft += bonus; cl.crit = Math.max(cl.crit, cl.timeLeft);
          say('Stabilized: +' + bonus + 's on the clock', 2.5);
        }
        callBackup(); alertOnSecure(cl.x, cl.y);
      }
    } else {
      cl.progress = Math.max(0, cl.progress - dt * 1.5);   // letting go loses progress
    }
  } else if (ePressed) {
    if (cl.carried) dropClient();
    else if (near) pickUpClient();
  }

  if (cl.carried) { cl.x = p.x; cl.y = p.y; cl.f = floorIdx; }
}

/** Stabilizing the client trips the alarm: backup spawns and hunts you. */
/** Where backup can arrive: open street on the far side from the evac zone or in the middle of the street,
    never on or right beside the evac zone (at least EVAC_CLEAR tiles from its center). */
const EVAC_CLEAR = 13;
function backupSpots() {
  const spots = [], ecx = tileOf(evac.x + evac.w / 2);
  for (let ty = STREET_TOP + 1; ty < ROWS; ty++) for (let tx = 1; tx < COLS - 1; tx++) {
    if (tileAt(tx, ty) !== '.' || Math.abs(tx - ecx) < EVAC_CLEAR) continue;
    spots.push({ x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2 });
  }
  return spots;
}

function callBackup() {
  // a fresh wave arrives every time a client is stabilized, so a two-client map means two waves
  backupCalled = true;
  const count = spawns.length ? randInt(...diffOf(level).backup) : 0;         // wave size depends on the map's difficulty
  const arrive = backupSpots();
  for (let i = 0; i < count; i++) {
    const s = arrive.length ? arrive[randInt(0, arrive.length - 1)] : spawns[i % spawns.length];
    // backup is the same mix as the building: riot shields, net hackers, heavies, and blade users (katana or mantis)
    const D = diffOf(level), type = Math.random() < (D.droneChance || 0) ? 'drone' : Math.random() < D.shieldChance ? 'shield' : Math.random() < D.hackerChance ? 'hacker'
            : Math.random() < D.heavyChance ? 'heavy' : 'grunt';
    const e = makeEnemy(type, s.x + rand(-4, 4), s.y + rand(-4, 4));
    e.state = 'chase'; e.hunter = true; e.born = missionTime; e.pingT = rand(...AI.hunter.ping);
    e.homeX = evac.x + evac.w / 2; e.homeY = evac.y + evac.h / 2;
    if (floorIdx === 0) { e.lastX = player.x; e.lastY = player.y; enemies.push(e); }
    else { e.stakeout = true; e.lastX = e.homeX; e.lastY = e.homeY; floorStates[0].enemies.push(e); }   // you are upstairs: they take up positions while you are away
  }
  if (spawns.length) { say('Client stable. ' + count + ' gang backup inbound', 4); Sound.alarm(); }
}

/* =====================================================================
   11. ENEMIES  -  patrol -> chase -> search -> patrol
   ===================================================================== */
function alertEnemy(e, x, y) {
  if (e.state !== 'chase') { e.state = 'chase'; e.alertT = 0.7; e.reaction = e.cfg.reaction * (e.wary ? AI.wary.reaction : 1); e.pathTimer = 0; }
  e.lastX = x; e.lastY = y; e.lostTimer = 0;
}

/** Did this enemy hear a noise of this radius made at (x, y)? Walls and shut doors in between halve the radius. */
function hears(e, x, y, radius) {
  const d = Math.hypot(e.x - x, e.y - y);
  if (d > radius) return false;
  return d <= radius * AI.wallDamp || hasLOS(e.x, e.y, x, y);
}

/** A noise at (x, y): every enemy that hears it comes to investigate that spot. kind is a key of AI.hear. */
function makeNoise(x, y, kind, except, radius) {
  const r = radius || AI.hear[kind];
  for (const e of enemies) if (e !== except && !e.dead && hears(e, x, y, r)) alertEnemy(e, x, y);
}

/** The room (index into this floor's rooms) a world position is in, or -1 out on the street, in a doorway or a wall. */
function roomAt(x, y) {
  const tx = tileOf(x), ty = tileOf(y), rooms = level.floors[floorIdx].rooms;
  for (let i = 0; i < rooms.length; i++) { const r = rooms[i]; if (tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h) return i; }
  return -1;
}

/** Your gunshot. How far it carries depends on the gun; the loudest ones also reach every corner of the room you are in. */
function alertByNoise() {
  const id = player.weapon;
  makeNoise(player.x, player.y, 'shot', null, AI.gunNoise[id] || AI.gunNoise.ar);
  if (AI.roomWide[id]) {
    const room = roomAt(player.x, player.y);
    if (room >= 0) for (const e of enemies) if (!e.dead && roomAt(e.x, e.y) === room) alertEnemy(e, player.x, player.y);
  }
}

function clearWalk(e, node) {
  const tx = node.x * TILE + TILE / 2, ty = node.y * TILE + TILE / 2;
  const dx = tx - e.x, dy = ty - e.y, steps = Math.ceil(Math.hypot(dx, dy) / 4);
  for (let i = 1; i <= steps; i++) {
    if (boxHitsSolid(e.x + dx * i / steps, e.y + dy * i / steps, e.r + 1)) return false;
  }
  return true;
}

/** Walks along e.path. Returns false when there is nothing left to follow. */
function followPath(e, speed, dt) {
  if (!e.path || !e.path.length) return false;
  while (e.path.length > 1 && clearWalk(e, e.path[1])) e.path.shift();   // cut corners when safe
  const n = e.path[0];
  const dx = n.x * TILE + TILE / 2 - e.x, dy = n.y * TILE + TILE / 2 - e.y, d = Math.hypot(dx, dy);
  if (d < 2.5) { e.path.shift(); return e.path.length > 0; }
  const s = Math.min(d, speed * dt);
  moveEntity(e, dx / d * s, dy / d * s);
  e.angle = turnToward(e.angle, Math.atan2(dy, dx), (e.cfg.turn || 8) * dt);   // riot shields turn slowly even when walking
  return true;
}

/* ---------- enemy AI settings ---------- */
const AI = {
  minDist: { pistol: 38, smg: 28, ar: 62, lmg: 72 },       // a gunner backs away if you get closer than this (px). Shotguns and blades never retreat.
  // Hearing. Every enemy has a set radius for each kind of noise; a wall or shut door between it and the noise halves it.
  // An enemy that hears something goes to the spot the noise came from, not straight to you.
  hear: { kill: 110, bladeKill: 60, blast: 215, shout: 145, grenade: 90, door: 110 },   // door = smashed, for anyone out in a hallway or street
  doorStartle: 0.7,      // seconds enemies freeze staring at a door that just got smashed before they come to check it   // grenade = landing, out on the street where there is no room
  railNearMiss: 30,      // px: a railgun round passing this close makes an enemy suspicious, even through a wall
  // How far each of your guns is heard, in px (16 px = 1 tile). roomWide = also heard by everyone in the room you fired in.
  gunNoise: { knives: 28, pistol: 92, sidearm: 92, dual: 108, smg: 124, ar: 145, lmg: 175, shotgun: 200, sniper: 215 },
  roomWide: { shotgun: true, sniper: true },
  wallDamp: 0.5,
  bodySight: 130,        // how far away an enemy notices a body
  coverChance: 0.6,      // after a burst, how often a gunner ducks behind something until its gun is ready again
  hitCoverChance: 0.3,   // chance it dives for cover when you wound it
  missChance: 0.14,      // share of enemy bullets that are thrown wide on purpose, so even point blank they land about 85-90% of the time
  coverRadius: 7,        // how many tiles away it will go for cover
  // Backup are hunters: every ping seconds they get a rough fix on you (off by up to fuzz px) and close in on it.
  // If you are upstairs when they arrive, they stake out the evac zone and the building's entrances instead.
  hunter: { ping: [2.5, 4], fuzz: 40, travel: 5 },
  clueSight: 120,        // how far an enemy notices a clue: a door you opened or broke, or one of your knives lying around
  search: { lost: 7, body: 13, clue: 9, radius: 5, wideRadius: 7, speed: 1.4, look: [0.7, 1.4] },   // searching: seconds, tiles from the spot, pace, pause to look
  roamAfter: 60,         // an enemy alive this many seconds stops guarding its room and roams the whole floor
  roamer: { roam: 14, maxLen: 44 },
  wary: { speed: 1.7, fov: 2.9, reaction: 0.5, roam: 9 },  // after finding a body: faster patrol, wider view, quicker trigger, and it roams instead of holding its post
};

/** Has this enemy given up guarding its post? True once it has found a body, or after it has been around long enough. */
function roams(e) { return e.wary || e.hunter || missionTime - (e.born || 0) > AI.roamAfter; }

function pickPatrolPath(e) {
  // on its post an enemy wanders near home; a wary one hunts outward from wherever it is; an old one roams the floor
  const old = roams(e) && !e.wary;
  const r = old ? AI.roamer.roam : e.wary ? AI.wary.roam : 5, maxLen = old ? AI.roamer.maxLen : e.wary ? 34 : 16;
  const free = roams(e);
  const hx = tileOf(free ? e.x : e.homeX), hy = tileOf(free ? e.y : e.homeY);
  for (let i = 0; i < 8; i++) {
    const tx = hx + randInt(-r, r), ty = hy + randInt(-r + 1, r - 1);
    if (isSolid(tx, ty) || tileAt(tx, ty) === 'D') continue;
    if (tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS && noGo[ty * COLS + tx] && !e.guard) continue;   // calm enemies never stroll into the server room
    const p = findPath(tileOf(e.x), tileOf(e.y), tx, ty);
    if (p && p.length > 0 && p.length <= maxLen) return p;
  }
  return null;
}

/** An enemy has just spotted you: allies close by hear the shout and head for the same spot. */
/** A kamikaze drone goes off by itself (it reached you). Shot down, it goes off in damageEnemy instead. */
function droneDetonate(e) {
  if (e.dead) return;
  e.dead = true;
  stampWreck(e.x, e.y);
  explode(e.x, e.y, e.cfg.blast);
}

function callOut(e) {
  for (const o of enemies) {
    if (o === e || o.dead || o.state === 'chase' || o.seated) continue;
    if (hears(o, e.x, e.y, AI.hear.shout)) alertEnemy(o, player.x, player.y);
  }
}

/** Sends an enemy (not already fighting) to walk over to (x, y) and then search the area for `searchFor` seconds. */
function investigate(e, x, y, searchFor) {
  if (e.state === 'chase') return;
  e.state = 'investigate'; e.invX = x; e.invY = y; e.invSearch = searchFor; e.path = null; e.pathTimer = 0;
}

/** Starts a proper search around (x, y): walk to spots nearby, stop, look around, move on. */
function startSearch(e, x, y, seconds) {
  e.state = 'search'; e.searchTimer = seconds; e.searchX = x; e.searchY = y;
  e.path = null; e.lookT = rand(0.5, 1); e.lookAng = e.angle + rand(-1.5, 1.5);
}

/** A reachable spot near the search center, not where it is already standing. */
function pickSearchSpot(e) {
  const R = e.wary ? AI.search.wideRadius : AI.search.radius, cx = tileOf(e.searchX), cy = tileOf(e.searchY);
  for (let i = 0; i < 10; i++) {
    const tx = cx + randInt(-R, R), ty = cy + randInt(-R, R);
    if (isSolid(tx, ty) || tileAt(tx, ty) === 'D') continue;
    if (tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS && noGo[ty * COLS + tx] && !e.guard) continue;   // searches stay outside the server room
    if (Math.abs(tx - tileOf(e.x)) + Math.abs(ty - tileOf(e.y)) < 3) continue;
    const p = findPath(tileOf(e.x), tileOf(e.y), tx, ty);
    if (p && p.length > 0 && p.length <= R * 3) return p;
  }
  return null;
}

/** Puts an enemy on edge for the rest of the run and sends it to look at (x, y). It knows someone is here, not where. */
function makeWary(e, x, y) {
  e.wary = true; e.wonderT = 1.4;
  e.reaction = e.cfg.reaction * AI.wary.reaction;
  investigate(e, x, y, AI.search.body);
}

/** Something is off (a door you opened, one of your knives): go and have a look, then search. Not wary for good. */
/** A client was just stabilized: every enemy in the building is now on edge, like it found a body.
    The ones on this floor go to look where the client was; the ones on other floors stay wary until you get there. */
function alertOnSecure(x, y) {
  for (let f = 0; f < floorStates.length; f++) {
    for (const e of (f === floorIdx ? enemies : floorStates[f].enemies)) {
      if (e.dead || e.seated) continue;
      if (f === floorIdx && e.state !== 'chase') makeWary(e, x, y);
      else { e.wary = true; e.reaction = e.cfg.reaction * AI.wary.reaction; }
    }
  }
}

function makeSuspicious(e, x, y) {
  if (e.state === 'chase') return;
  e.wonderT = 1.2;
  investigate(e, x, y, AI.search.clue);
}

/** Does this enemy see a clue it has not seen before: a door you opened or broke, or a knife you threw? */
function noticeClues(e, c) {
  const st = floorStates[floorIdx];
  const sees = (x, y) => {
    const dx = x - e.x, dy = y - e.y, d = Math.hypot(dx, dy);
    if (d > AI.clueSight) return false;
    if (d > 26 && Math.abs(angDiff(Math.atan2(dy, dx), e.angle)) > c.fov / 2) return false;
    return hasLOS(e.x, e.y, x, y);
  };
  for (const d of doors) {
    const i = d.y * COLS + d.x;
    if (!(doorOpen[i] === 2 || st.doorBy[i] === 2) || e.seenClues.has(i)) continue;      // broken, or opened by you
    const x = d.x * TILE + TILE / 2, y = d.y * TILE + TILE / 2;
    if (!sees(x, y)) continue;
    for (const o of doors) if (Math.abs(o.x - d.x) + Math.abs(o.y - d.y) <= 2) e.seenClues.add(o.y * COLS + o.x);   // the whole doorway
    makeSuspicious(e, x, y); return;
  }
  for (const k of st.knives) {
    if (e.seenClues.has(k) || !sees(k.x, k.y)) continue;
    e.seenClues.add(k);
    makeSuspicious(e, k.x, k.y); return;
  }
}

/** Does this enemy see a body it has not seen before? If so it, and any allies in earshot, turn wary. */
function noticeBodies(e, c) {
  for (const b of floorStates[floorIdx].bodies) {
    if (e.seenBodies.has(b)) continue;
    const bx = b.x - e.x, by = b.y - e.y, d = Math.hypot(bx, by);
    if (d > AI.bodySight) continue;
    if (d > 26 && Math.abs(angDiff(Math.atan2(by, bx), e.angle)) > c.fov / 2) continue;
    if (!hasLOS(e.x, e.y, b.x, b.y)) continue;
    e.seenBodies.add(b);
    makeWary(e, b.x, b.y);
    for (const o of enemies) {
      if (o !== e && !o.dead && !o.wary && hears(o, e.x, e.y, AI.hear.shout)) { o.seenBodies.add(b); makeWary(o, b.x, b.y); }
    }
    return;
  }
}

/** Is another enemy standing in this one's line of fire? Gunners hold their shot and sidestep instead of shooting a friend. */
function allyInLine(e, dist) {
  const fa = Math.cos(e.angle), fb = Math.sin(e.angle);
  for (const o of enemies) {
    if (o === e || o.dead) continue;
    const rx = o.x - e.x, ry = o.y - e.y, along = rx * fa + ry * fb;
    if (along > 4 && along < dist && Math.abs(rx * fb - ry * fa) < o.r + 3) return true;
  }
  return false;
}

/** Is another enemy that is also after you right next to this one? */
function crowded(e) {
  for (const o of enemies) if (o !== e && !o.dead && o.state === 'chase' && Math.hypot(o.x - e.x, o.y - e.y) < 34) return true;
  return false;
}

/** Sends a gunner to the nearest spot you cannot see (behind furniture, round a corner, through a doorway) for `stay` seconds. */
function takeCover(e, stay) {
  if (ENEMY_WEAPONS[e.weapon].melee || e.weapon === 'shotgun' || e.type === 'shield' || e.cover) return;
  const ex = tileOf(e.x), ey = tileOf(e.y), R = AI.coverRadius;
  let best = null, bestD = Infinity;
  for (let ty = ey - R; ty <= ey + R; ty++) for (let tx = ex - R; tx <= ex + R; tx++) {
    if (isSolid(tx, ty) || tileAt(tx, ty) === 'D') continue;
    const cx = tx * TILE + TILE / 2, cy = ty * TILE + TILE / 2, d = Math.hypot(cx - e.x, cy - e.y);
    if (d >= bestD || hasLOS(cx, cy, player.x, player.y)) continue;      // you can see that spot: it is not cover
    best = { tx, ty }; bestD = d;
  }
  if (!best) return;
  const path = findPath(ex, ey, best.tx, best.ty);
  if (!path || path.length > R + 6) return;
  e.cover = true; e.coverT = stay; e.path = path;
}

function updateEnemy(e, dt) {
  pathGuard = !!e.guard;
  const p = player;
  // c = this enemy's stats this frame: its body type, plus the gun it carries, slowed if it is overheating
  const gun = ENEMY_WEAPONS[e.weapon], slow = e.burn > 0 ? CYBERWARE.overheat.slow : 1;
  const c = { ...e.cfg, ...gun, patrolSpeed: e.cfg.patrolSpeed * slow, chaseSpeed: e.cfg.chaseSpeed * slow * (gun.speedMult || 1) };
