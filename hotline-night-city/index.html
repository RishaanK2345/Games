  if (e.cfg.keepAway) c.keepDist = e.cfg.keepAway;        // net hackers stand further off than their pistol would
  if (e.type === 'drone') c.keepDist = 0;                 // kamikaze drones fly right into you
  if (e.wary) { c.patrolSpeed *= AI.wary.speed; c.fov = AI.wary.fov; c.reaction *= AI.wary.reaction; }
  if (e.state === 'investigate' || e.state === 'search') c.fov = Math.max(c.fov, 2.5);   // eyes open while looking for you
  if (e.seated) { c.sight = SECURITY.guardSight; c.fov = SECURITY.guardFov; }   // the guard at the laptop only sees the screen in front of him
  if (e.boss) {                                            // bosses: faster, sharper, and much faster still under their Sandevistan
    c.chaseSpeed *= BOSS.speed; c.sight = BOSS.sight; c.reaction *= BOSS.reaction;
    if (e.boss.sandy > 0) {
      c.chaseSpeed *= BOSS.sandy.speed; c.patrolSpeed *= BOSS.sandy.speed; c.turn = 20;
      c.fireDelay *= BOSS.sandy.fire; c.burstDelay *= BOSS.sandy.fire; if (c.windup) c.windup *= 0.4;
    }
  }
  if (e.dead) return;
  if (e.type === 'shield') {                               // riot shield: block for a while, lower it to shoot for a while, repeat
    if (e.state === 'chase') { e.phase -= dt; if (e.phase <= 0) { e.blocking = !e.blocking; e.phase = e.cfg.phase; } }
    else { e.blocking = true; e.phase = e.cfg.phase; }     // not fighting: shield stays up
  }
  if (e.cook > 0) {                                        // Grenade Detonate: holding a live grenade
    e.cook -= dt;
    if (e.cook <= 0) { e.cook = 0; explode(e.x, e.y); if (e.dead) return; }
  }
  if (e.burn > 0) {                                        // on fire from the Overheat quickhack
    e.burn -= dt; e.hp -= e.burnDps * dt;
    if (Math.random() < dt * 40) {
      particles.push({ x: e.x + rand(-4, 4), y: e.y + rand(-4, 4), vx: rand(-12, 12), vy: rand(-45, -15), life: rand(0.2, 0.45),
                       color: ['#ff9a1f', '#ffd23f', '#ff4d1f'][randInt(0, 2)], size: 2, stain: false });
    }
    if (e.hp <= 0) { damageEnemy(e, rand(0, Math.PI * 2), 0); return; }
  }
  const dx = p.x - e.x, dy = p.y - e.y, dist = Math.hypot(dx, dy);
  const angTo = Math.atan2(dy, dx);
  e.flash -= dt; e.alertT -= dt; e.muzzle -= dt; e.fireTimer -= dt; e.swing -= dt; e.wonderT -= dt;

  // --- perception: vision cone + line of sight ---
  let sees = false;
  if (e.blind > 0) e.blind -= dt;                          // Reboot Optics: no vision at all
  if (!p.dead && dist < c.sight && !(e.blind > 0) && !(p.camo > 0)) {      // Optical Camo: they simply cannot see you
    // anyone right beside an enemy gets noticed. The seated guard only notices people at his sides or in front, so you can creep up from behind.
    const close = e.seated ? dist < SECURITY.closeDetect && Math.abs(angDiff(angTo, e.angle)) < SECURITY.closeArc : dist < 26;
    const inCone = e.state === 'chase' || close || Math.abs(angDiff(angTo, e.angle)) < c.fov / 2;
    sees = inCone && hasLOS(e.x, e.y, p.x, p.y);
  }
  e.seesP = sees;
  if (sees) {
    if (e.state !== 'chase' && !e.spotted) { e.spotted = true; stats.spotted++; }   // for the score: how many enemies ever saw you
    if (e.state !== 'chase' || e.wonderT > 0) callOut(e);  // first sighting: shout for help
    e.wonderT = 0;
    alertEnemy(e, p.x, p.y);
  } else if (e.state !== 'chase' && !(e.blind > 0)) { noticeBodies(e, c); if (e.state !== 'chase') noticeClues(e, c); }
  if (e.startleT > 0) {                                    // heard a grenade land: stop dead and look at it until it goes off
    e.startleT -= dt;
    if (!sees) {
      e.angle = turnToward(e.angle, Math.atan2(e.startleY - e.y, e.startleX - e.x), c.turn * 2 * dt);
      if (e.startleT <= 0 && e.startleThen) { e.startleThen = false; alertEnemy(e, e.startleX, e.startleY); }   // a smashed door: now go see who did it
      return;
    }
    e.startleT = 0; e.startleThen = false;
  }
  if (e.type === 'drone') {                                // kamikaze: close enough and in the clear, it arms; then it blows
    if (e.fuse > 0) {
      e.fuse -= dt; e.beepT = (e.beepT || 0) - dt;
      if (e.beepT <= 0) { e.beepT = 0.09; Sound.tone(2200, 0.05, 'square', 0.13); }
      moveEntity(e, Math.cos(angTo) * c.chaseSpeed * 0.5 * dt, Math.sin(angTo) * c.chaseSpeed * 0.5 * dt);   // still drifting at you
      if (e.fuse <= 0) droneDetonate(e);
      return;
    }
    if (!p.dead && dist < e.cfg.trigger && hasLOS(e.x, e.y, p.x, p.y)) { e.fuse = e.cfg.fuse; e.beepT = 0; }
  }
  if (e.seated) {                                          // the security guard: glued to his laptop until something gets his attention himself
    if (e.state === 'patrol') { e.angle = turnToward(e.angle, e.seatAngle, 4 * dt); return; }
    e.seated = false;                                      // on his feet
  }

  if (e.hunter && !sees && !p.dead && !(p.camo > 0)) {                      // backup: a radio fix on roughly where you are, every few seconds
    e.pingT -= dt;
    if (e.pingT <= 0) {
      e.pingT = rand(...AI.hunter.ping);
      const fx = clamp(p.x + rand(-AI.hunter.fuzz, AI.hunter.fuzz), 8, WORLD_W - 8), fy = clamp(p.y + rand(-AI.hunter.fuzz, AI.hunter.fuzz), 8, WORLD_H - 8);
      if (e.state === 'chase' && e.path) { e.lastX = fx; e.lastY = fy; e.pathTimer = 0; e.lostTimer = 0; }
      else alertEnemy(e, fx, fy);
    }
  }

  if (e.boss) updateBoss(e, dt, sees, dist);

  if (e.type === 'hacker') {                               // net hacker: uploads a jam for as long as it can see you
    e.hackCd -= dt;
    const already = e.hackType === 'optics' ? p.blind > 0 : p.jam > 0;   // no point hacking what is already hacked
    // once an upload has started it is locked on: hiding or hitting the hacker does not stop it, only killing it does
    if (e.hack > 0 || (sees && dist < c.hackRange && e.hackCd <= 0 && !already)) {
      e.hack += dt;
      if (e.hack >= c.hackTime) { e.hack = 0; e.hackCd = c.hackCooldown; if (e.hackType === 'optics') bossHack('optics'); else jamPlayer(c.jam); }
    }
  }

  // --- behavior ---
  pathGuard = !!e.guard || (e.state === 'chase' && serverDoorOpen());   // alerted, and the door is open: the server room is fair game
  if (e.state === 'patrol') {
    if (!followPath(e, c.patrolSpeed, dt)) {
      e.wait -= dt;
      if (e.wait <= 0) { e.path = pickPatrolPath(e); e.wait = e.wary ? rand(0.3, 1) : rand(1, 3); }
    }
  } else if (e.state === 'chase') {
    if (e.cover) {
      // ducked behind something between bursts: go there, wait facing where you were, come back out when the gun is ready
      e.coverT -= dt;
      const moving = followPath(e, c.chaseSpeed, dt);
      if (!moving) e.angle = turnToward(e.angle, Math.atan2(e.lastY - e.y, e.lastX - e.x), 6 * dt);
      if (e.coverT <= 0 || (sees && !moving)) { e.cover = false; e.path = null; e.pathTimer = 0; e.lostTimer = 0; }   // time is up, or you walked round its cover
    } else if (sees) {
      e.path = null;
      e.angle = turnToward(e.angle, angTo, (c.turn || 7) * dt);
      const minDist = e.type === 'shield' || e.type === 'drone' ? 0 : e.cfg.keepAway ? e.cfg.keepAway * 0.6 : (AI.minDist[e.weapon] || 0);
      if (e.windup > 0) {
        /* committed to the swing */
      } else if (dist > c.keepDist) {
        // close in. With an ally right beside it, it angles off to one side so they fan out instead of queueing up.
        let mx = dx / dist, my = dy / dist;
        if (crowded(e)) { mx += -dy / dist * 0.7 * e.strafeDir; my += dx / dist * 0.7 * e.strafeDir; const m = Math.hypot(mx, my); mx /= m; my /= m; }
        moveEntity(e, mx * c.chaseSpeed * dt, my * c.chaseSpeed * dt);
      } else if (dist < minDist) {
        // too close for this weapon: back away, still facing you
        moveEntity(e, -dx / dist * c.chaseSpeed * 0.8 * dt, -dy / dist * c.chaseSpeed * 0.8 * dt);
      } else {
        // in its preferred range: sidestep
        e.strafeTimer -= dt;
        if (e.strafeTimer <= 0) { e.strafeDir *= -1; e.strafeTimer = rand(0.6, 1.4); }
        moveEntity(e, -dy / dist * c.chaseSpeed * 0.5 * e.strafeDir * dt, dx / dist * c.chaseSpeed * 0.5 * e.strafeDir * dt);
      }
      e.reaction -= dt;
      if (c.melee) {
        // blade: wind up once in reach (a red arc warns you), then cut. Back out of reach in time and it misses.
        if (e.windup > 0) {
          e.windup -= dt;
          if (e.windup <= 0) {
            e.swing = 0.14; e.fireTimer = c.fireDelay; Sound.slash();
            let landed = 0;
            if (c.rect) {                                  // mantis thrust: each blade is its own line
              const fa = Math.cos(e.angle), fb = Math.sin(e.angle), along = dx * fa + dy * fb, side = dx * fb - dy * fa;
              if (along > 0 && along <= c.reach + p.r) landed = [-1, 1].filter(k => Math.abs(side - k * c.bladeGap / 2) <= p.r + 1).length;
            } else if (dist <= c.reach + p.r && Math.abs(angDiff(angTo, e.angle)) < 1.1) landed = c.hits;      // katana arc
            for (let i = 0; i < landed; i++) damagePlayer(e.angle);
          }
        } else if (!e.blocking && e.reaction <= 0 && e.fireTimer <= 0 && dist <= c.reach) e.windup = c.windup;   // a riot shield lowers it to swing
      } else if (e.type === 'drone') {                     // no gun: it just flies into you
      } else if (!e.blocking && e.reaction <= 0 && e.fireTimer <= 0 && Math.abs(angDiff(angTo, e.angle)) < 0.35 && !allyInLine(e, dist)) {
        // guns: shoot after a short reaction delay, once roughly facing you and with no friend in the way
        for (let i = 0; i < c.pellets; i++) {
          const wide = Math.random() < AI.missChance ? (Math.random() < 0.5 ? -1 : 1) * rand(0.24, 0.4) : 0;   // a deliberate miss
          spawnBullet(e.x + Math.cos(e.angle) * 8, e.y + Math.sin(e.angle) * 8, e.angle + rand(-c.spread, c.spread) + wide,
                      c.bulletSpeed * (c.pellets > 1 ? rand(0.85, 1.1) : 1), 'enemy');
          bullets[bullets.length - 1].range = c.range;
        }
        e.muzzle = 0.05; Sound.enemyShot();
        e.burstLeft--;
        if (e.burstLeft > 0) e.fireTimer = c.burstDelay;
        else {
          e.burstLeft = c.burst; e.fireTimer = c.fireDelay * rand(0.8, 1.2);
          if (Math.random() < AI.coverChance) takeCover(e, e.fireTimer + 0.2);       // burst done: duck away until it can fire again
        }
      }
    } else {
      // lost sight: head for the last known position
      e.reaction = Math.min(c.reaction, e.reaction + dt);
      e.lostTimer += dt; e.pathTimer -= dt;
      if (e.pathTimer <= 0 || !e.path) {
        e.path = findPath(tileOf(e.x), tileOf(e.y), tileOf(e.lastX), tileOf(e.lastY));
        e.pathTimer = 0.5;
      }
      const moving = followPath(e, c.chaseSpeed, dt);
      if (!moving || e.lostTimer > 7 || Math.hypot(e.lastX - e.x, e.lastY - e.y) < 10) {
        startSearch(e, e.lastX, e.lastY, AI.search.lost);
      }
    }
  } else if (e.state === 'investigate') {
    // walking over to something that looked wrong
    if (!e.path) { e.path = findPath(tileOf(e.x), tileOf(e.y), tileOf(e.invX), tileOf(e.invY)) || []; }
    const moving = followPath(e, c.patrolSpeed * AI.search.speed, dt);
    if (!moving || Math.hypot(e.invX - e.x, e.invY - e.y) < 14) startSearch(e, e.invX, e.invY, e.invSearch);
  } else if (e.state === 'search') {
    // a real search: walk to a nearby spot, stop and look around, pick another, until time is up
    e.searchTimer -= dt;
    if (e.lookT > 0) {
      e.lookT -= dt;
      e.angle = turnToward(e.angle, e.lookAng, 4.5 * dt);
      if (Math.abs(angDiff(e.lookAng, e.angle)) < 0.1) e.lookAng = e.angle + (Math.random() < 0.5 ? -1 : 1) * rand(0.9, 1.8);
      if (e.lookT <= 0) { e.path = pickSearchSpot(e); if (!e.path) e.lookT = 0.6; }
    } else if (!followPath(e, c.patrolSpeed * AI.search.speed, dt)) {
      e.lookT = rand(...AI.search.look); e.lookAng = e.angle + rand(-1.6, 1.6);   // got there: stop and look
    }
    if (e.searchTimer <= 0) {
      e.state = 'patrol';
      // back to its post, unless it has found a body: then it keeps hunting from here
      e.path = roams(e) ? pickPatrolPath(e) : findPath(tileOf(e.x), tileOf(e.y), tileOf(e.homeX), tileOf(e.homeY));
      e.wait = e.wary ? 0.3 : 1;
    }
  }
}

/** True if this enemy's raised riot shield stops an attack. dirToAttacker = the angle from the enemy toward whoever hit it. */
function shieldBlocks(e, dirToAttacker) {
  return e.type === 'shield' && e.blocking && Math.abs(angDiff(dirToAttacker, e.angle)) < e.cfg.blockArc;
}

function damageEnemy(e, angle, dmg) {
  if (e.boss && dmg >= 9999) dmg = Math.ceil(e.maxHp * BOSS.bigHit);        // one-shot weapons only take a chunk off a boss
  e.hp -= dmg; e.flash = 0.08;
 
  spawnBlood(e.x, e.y, angle, 6);
  alertEnemy(e, player.x, player.y);
  if (e.hp <= 0) {
    e.dead = true; kills++;
    spawnBlood(e.x, e.y, angle, 16);
    const drone = e.type === 'drone';
    const dropping = player.finite && DROP_ID[e.weapon] && !drone;      // random guns: its weapon lands on the floor as a pickup instead
    if (drone) { stampWreck(e.x, e.y); explode(e.x, e.y, e.cfg.blast); }   // shot down: it still goes off, right where it is
    else stampCorpse(e.x, e.y, angle, e.look, e.weapon, !!dropping);
    if (dropping) {
      const id = DROP_ID[e.weapon], w = WEAPONS[id];
      floorStates[floorIdx].weapons.push({ x: e.x + rand(-6, 6), y: e.y + rand(-6, 6), id, angle: rand(0, Math.PI * 2),
                                           ammo: w.melee ? 0 : w.mag, reserve: w.melee ? 0 : w.mag * randInt(...SPARE_MAGS) });
    }
    if (!drone) floorStates[floorIdx].bodies.push({ x: e.x, y: e.y });          // other enemies can find this later
    // the dying cry: blades are quick and quiet, a thrown knife is silent, anything else is heard further off
    if (!(WEAPONS[player.weapon] && WEAPONS[player.weapon].thrown && dmg >= 9999))
      makeNoise(e.x, e.y, WEAPONS[player.weapon] && WEAPONS[player.weapon].melee && dmg >= 9999 ? 'bladeKill' : 'kill', e);
    if (e.boss) { pickups.push({ x: e.x - 6, y: e.y }, { x: e.x + 6, y: e.y }); say('Elite down', 2); }   // an elite always drops two medkits
    else if (!drone && Math.random() < CFG.medkit.dropChance) pickups.push({ x: e.x, y: e.y });
    addShake(2.5); Sound.kill();
  } else {
    Sound.hit();
    if (e.state === 'chase' && Math.random() < AI.hitCoverChance) takeCover(e, 1.2);     // wounded: may dive behind something
  }
}

/** Keeps enemies from stacking on the exact same spot. */
function separateEnemies() {
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d > 0 && d < 10) {
      const push = (10 - d) / 2;
      moveEntity(a, -dx / d * push, -dy / d * push);
      moveEntity(b, dx / d * push, dy / d * push);
    }
  }
}


/* =====================================================================
   11b. SECURITY: cameras, the laptop and its hack
   ===================================================================== */
let hackGame = null;      // the laptop minigame while it is open: { type: 'breach' | 'rhythm', ... }

/** Cameras on this floor sweep, and raise the alarm if they keep you in view. dt is world time (Sandevistan slows them). */
function updateCameras(dt) {
  const p = player, st = floorStates[floorIdx];
  if (st.security && st.security.lockT > 0) st.security.lockT -= dt;
  for (const c of st.cameras || []) {
    if (!c.alive || c.off) { c.sees = false; c.seeT = 0; continue; }
    c.t += dt;
    c.angle = c.base + Math.sin(c.t * CAMERA.sweepSpeed) * CAMERA.sweep;
    const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy);
    c.sees = !p.dead && !(p.camo > 0) && d < CAMERA.range && Math.abs(angDiff(Math.atan2(dy, dx), c.angle)) < CAMERA.fov / 2 && hasLOS(c.x, c.y, p.x, p.y);
    if (c.bodyFx > 0) c.bodyFx -= dt;
    for (const b of st.bodies) {                           // a body in view: reported once, as a body, not as you
      if (b.camSeen || Math.hypot(b.x - c.x, b.y - c.y) > CAMERA.range) continue;
      if (Math.abs(angDiff(Math.atan2(b.y - c.y, b.x - c.x), c.angle)) < CAMERA.fov / 2 && hasLOS(c.x, c.y, b.x, b.y)) { b.camSeen = true; cameraBody(c, b); }
    }
    if (c.sees) {
      c.seeT += dt; c.cd -= dt;
      if (c.seeT >= CAMERA.notice && c.cd <= 0) { c.cd = CAMERA.repeat; cameraAlarm(c); }
    } else { c.seeT = Math.max(0, c.seeT - dt * 2); c.cd = 0; }
  }
}

/** A camera has you: every enemy on this floor (except the seated guard) now knows exactly where you are. */
function cameraAlarm(c) {
  // only the closest few enemies to you get sent (3 to 5, rolled once per camera); the rest of the floor carries on
  c.alertN = c.alertN || randInt(CAMERA.alertMin, CAMERA.alertMax);
  enemies.filter(e => !e.dead && !e.seated)
    .sort((a, b) => Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y))
    .slice(0, c.alertN).forEach(e => alertEnemy(e, player.x, player.y));
  if (!c.spottedOnce) { c.spottedOnce = true; stats.spotted += 2; say('Camera spotted you: backup is on the way', 2.5); }
  Sound.tone(1250, 0.12, 'square', 0.16); if (Sound.ctx) Sound.tone(900, 0.16, 'square', 0.16, 0, Sound.ctx.currentTime + 0.14);
}

/** A camera caught a body. Like a guard finding one, but nobody learns where you are: the closest couple of calm enemies
    walk over to look and search around it, and everyone else on the floor goes wary (quicker to react, wider view) where they stand. */
function cameraBody(c, b) {
  const calm = enemies.filter(e => !e.dead && !e.seated && e.state !== 'chase')
    .sort((a, d) => Math.hypot(a.x - b.x, a.y - b.y) - Math.hypot(d.x - b.x, d.y - b.y));
  calm.forEach((e, i) => {
    if (i < CAMERA.bodySenders) makeWary(e, b.x, b.y);
    else { e.wary = true; e.reaction = e.cfg.reaction * AI.wary.reaction; }
  });
  c.bodyFx = 1.2;
  say('A camera spotted a body', 2);
  Sound.tone(700, 0.1, 'square', 0.12); if (Sound.ctx) Sound.tone(700, 0.1, 'square', 0.12, 0, Sound.ctx.currentTime + 0.16);
}

/** The camera (still working or switched off, but not shot) within r px of a point on this floor, if any. */
function cameraAt(x, y, r) {
  for (const c of floorStates[floorIdx].cameras || []) if (c.alive && Math.hypot(c.x - x, c.y - y) < r) return c;
  return null;
}

function destroyCamera(c) {
  c.alive = false; c.sees = false;
  spawnSparks(c.x, c.y, '#ffffff', 10); spawnSparks(c.x, c.y, '#ff3b3b', 6); spawnSmoke(c.x, c.y, 3, 2);
  Sound.fnoise(0.12, 0.45, 'highpass', 3200, 1500, 0.8); Sound.tone(900, 0.18, 'square', 0.08, 120);
}

/** The laptop you are standing at, if it can still be hacked. */
function laptopNear() {
  const sec = floorStates[floorIdx] && floorStates[floorIdx].security;
  return sec && !sec.hacked && player && Math.hypot(sec.x - player.x, sec.y - player.y) < SECURITY.reach ? sec : null;
}

function startHack(sec) {
  hackGame = Math.random() < 0.5 ? makeBreach(sec) : makeRhythm(sec);
  mouse.down = false;
  Sound.tone(600, 0.12, 'square', 0.12, 1400);
}

/** Breach Protocol. The matrix always has a solution: a legal chain of picks (row, column, row...) whose codes,
    after one free first pick, spell the sequence. The buffer leaves a little room for a wrong pick or two. */
function makeBreach(sec) {
  const N = HACK.size, L = level.diff === 'hard' ? HACK.seqHard : HACK.seqMedium;
  const grid = Array.from({ length: N }, () => Array.from({ length: N }, () => HACK.codes[randInt(0, HACK.codes.length - 1)]));
  const path = [[0, randInt(0, N - 1)]];
  for (let i = 1; i <= L; i++) {
    const [r0, c0] = path[path.length - 1], opts = [];
    for (let k = 0; k < N; k++) {
      const cell = i % 2 ? [k, c0] : [r0, k];          // odd steps move along the column, even steps along the row
      if (!path.some(q => q[0] === cell[0] && q[1] === cell[1])) opts.push(cell);
    }
    path.push(opts[randInt(0, opts.length - 1)]);
  }
  const seq = path.slice(1).map(([r0, c0]) => grid[r0][c0]);
  return { type: 'breach', sec, grid, seq, buf: [], used: new Set(), axis: 'row', line: 0, t: HACK.time };
}

/** Rhythm hack: 16 notes over four lanes, with a four-beat count-in. */
function makeRhythm(sec) {
  const R = HACK.rhythm, beat = 60 / R.bpm, notes = [];
  let t = beat * 4, prev = -1;
  for (let i = 0; i < R.notes; i++) {
    let lane = randInt(0, R.keys.length - 1);
    notes.push({ t, lane, hit: false, miss: false });
    const half = Math.random() < R.halfChance;          // quick half-beat doubles (off for now: keeps it readable)
    t += beat * (half ? 0.5 : Math.random() < 0.15 ? 2 : 1);
    if (half) { do { lane = randInt(0, R.keys.length - 1); } while (lane === prev); }   // quick doubles always jump lanes
    prev = lane;
  }
  return { type: 'rhythm', sec, beat, notes, t: 0, nextBeat: 0, hits: 0, misses: 0, end: notes[notes.length - 1].t + 0.6, flash: R.keys.map(() => 0), bad: R.keys.map(() => 0) };
}

function updateHack(dt) {
  const g = hackGame;
  if (g.type === 'breach') {
    g.t -= dt;
    if (g.t <= 0) finishHack(false, 'Out of time');
    return;
  }
  const R = HACK.rhythm;
  g.t += dt;
  for (let i = 0; i < g.flash.length; i++) { g.flash[i] = Math.max(0, g.flash[i] - dt); g.bad[i] = Math.max(0, g.bad[i] - dt); }
  while (g.t >= g.nextBeat && g.nextBeat < g.end) {         // the beat: a kick on every count, so the notes have something to sit on
    Sound.tone(120, 0.09, 'sine', 0.45, 45);
    g.nextBeat += g.beat;
  }
  for (const n of g.notes) if (!n.hit && !n.miss && g.t > n.t + R.window) { n.miss = true; g.misses++; g.bad[n.lane] = 0.2; }
  if (g.misses > R.maxMiss) finishHack(false, 'Too many misses');
  else if (g.t >= g.end) finishHack(true);
}

function rhythmPress(lane) {
  const g = hackGame, R = HACK.rhythm;
  const n = g.notes.find(n => n.lane === lane && !n.hit && !n.miss && Math.abs(n.t - g.t) <= R.window);
  if (n) { n.hit = true; g.hits++; g.flash[lane] = 0.15; Sound.tone([523, 659, 784][lane], 0.12, 'square', 0.12); }
  else { g.misses++; g.bad[lane] = 0.2; Sound.tone(140, 0.08, 'sawtooth', 0.1); }   // a press with no note there counts as a miss
}

/* Breach Protocol layout on the 480 x 270 screen */
const BREACH = { x: 86, y: 70, cell: 28 };

function breachCellAt(sx, sy) {
  const col = Math.floor((sx - BREACH.x) / BREACH.cell), row = Math.floor((sy - BREACH.y) / BREACH.cell);
  return row >= 0 && row < HACK.size && col >= 0 && col < HACK.size ? [row, col] : null;
}

function breachPickable(g, row, col) {
  return !g.used.has(row * HACK.size + col) && (g.axis === 'row' ? row === g.line : col === g.line);
}

function hackClick() {
  const g = hackGame;
  if (g.type !== 'breach') return;
  const cell = breachCellAt(mouse.sx, mouse.sy);
  if (!cell) return;
  const [row, col] = cell;
  if (!breachPickable(g, row, col)) { Sound.click(); return; }
  g.used.add(row * HACK.size + col); g.buf.push(g.grid[row][col]);
  Sound.tone(700 + g.buf.length * 90, 0.07, 'square', 0.1);
  if (g.axis === 'row') { g.axis = 'col'; g.line = col; } else { g.axis = 'row'; g.line = row; }
  if (breachDone(g)) { finishHack(true); return; }
  let moves = 0;
  for (let k = 0; k < HACK.size; k++) if (g.axis === 'row' ? breachPickable(g, g.line, k) : breachPickable(g, k, g.line)) moves++;
  if (g.buf.length >= HACK.buffer) finishHack(false, 'Buffer full');
  else if (!moves) finishHack(false, 'Dead end');
}

/** True once the sequence appears, in order and unbroken, somewhere in the buffer. */
function breachDone(g) {
  return g.buf.join(' ').includes(g.seq.join(' '));
}

/** How much of the sequence the end of the buffer already matches (for highlighting). */
function breachProgress(g) {
  for (let k = Math.min(g.seq.length, g.buf.length); k > 0; k--) {
    if (g.buf.slice(g.buf.length - k).join(' ') === g.seq.slice(0, k).join(' ')) return k;
  }
  return 0;
}

function finishHack(ok, why) {
  const sec = hackGame.sec; hackGame = null;
  if (ok) {
    sec.hacked = true;
    for (const st of floorStates) for (const c of st.cameras || []) { c.off = true; c.sees = false; }   // every floor: there is one server room per building
    say('Every camera in the building is offline', 3);
    Sound.tone(660, 0.12, 'square', 0.14); if (Sound.ctx) { Sound.tone(880, 0.12, 'square', 0.14, 0, Sound.ctx.currentTime + 0.12); Sound.tone(1320, 0.25, 'square', 0.14, 0, Sound.ctx.currentTime + 0.24); }
  } else {
    sec.lockT = HACK.lockout;
    say((why ? why + '. ' : '') + 'Laptop locked for ' + HACK.lockout + 's', 2.5);
    Sound.tone(300, 0.35, 'sawtooth', 0.18, 80);
  }
}

function cancelHack(msg) {
  if (!hackGame) return;
  hackGame = null;
  if (msg) say(msg, 1.5);
}

/* ---------- score ---------- */
let stats = { spotted: 0 };      // this attempt: how many enemies (or cameras, which count double) have spotted you
let mapAttempts = 0;             // tries on this map (1 = no respawns)
let bestGrades = {};             // best grade and score per difficulty, kept between visits
try { bestGrades = JSON.parse(localStorage.getItem(GRADES_KEY)) || {}; } catch (err) { bestGrades = {}; }

function missionScore() {
  const par = SCORE.parBase + floorStates.length * SCORE.parPerFloor + (clients.length - 1) * SCORE.parPerClient;
  const respawns = Math.max(0, mapAttempts - 1);
  const rows = [
    ['Speed', fmtTime(missionTime) + ' (par ' + fmtTime(par) + ')', Math.round(40 * clamp((2 * par - missionTime) / par, 0, 1)), 40],
    ['Health', player.hp + '/' + CFG.player.hp, Math.round(30 * player.hp / CFG.player.hp), 30],
    ['Clean', respawns ? respawns + ' respawn' + (respawns > 1 ? 's' : '') : 'no respawns', Math.max(0, 30 - SCORE.perRespawn * respawns), 30],
  ];
  const stealth = ['Stealth bonus', stats.spotted ? 'spotted ' + stats.spotted + 'x' : 'never seen', Math.round(25 * clamp(1 - stats.spotted / SCORE.spottedZero, 0, 1)), 25];
  const core = rows.reduce((a, r0) => a + r0[2], 0);
  let grade = SCORE.grades.find(([, min]) => core >= min)[0];
  if (grade === 'S' && stealth[2] >= SCORE.plusStealth) grade = 'S+';   // a near-perfect run nobody saw
  return { rows, stealth, core, total: core + stealth[2], grade };
}

/* =====================================================================
   12. BULLETS + PARTICLES
   ===================================================================== */
/** w is the WEAPONS entry for player bullets; enemy bullets pass nothing and always deal 1. */
/** Smart Link: bend a bullet toward the nearest enemy it has a clear line to. It follows open doorways but never cuts through walls. */
function steerBullet(b, dt) {
  const L = CYBERWARE.smartlink;
  let best = null, bestD = L.seek;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - b.x, e.y - b.y);
    if (d < bestD && hasLOS(b.x, b.y, e.x, e.y)) { best = e; bestD = d; }
  }
  if (!best) return;
  let ax = best.x, ay = best.y, turn = L.turn;
  if (best.type === 'shield' && best.blocking) {          // raised riot shield: swing wide to its side, then curl in behind it
    const off = angDiff(Math.atan2(b.y - best.y, b.x - best.x), best.angle);
    const flank = s => { const a = best.angle + s * (best.cfg.blockArc + 1.1); return [best.x + Math.cos(a) * 22, best.y + Math.sin(a) * 22]; };
    if (b.shieldSide === undefined) {                    // go around whichever side has room (no wall in the way)
      const pref = off >= 0 ? 1 : -1, open = s => { const [fx, fy] = flank(s); return hasLOS(b.x, b.y, fx, fy) && hasLOS(fx, fy, best.x, best.y); };
      b.shieldSide = open(pref) ? pref : open(-pref) ? -pref : 0;
    }
    if (b.shieldSide && Math.abs(off) < best.cfg.blockArc + 0.35) {      // still in front of the shield: head for a point off its flank
      [ax, ay] = flank(b.shieldSide);
      turn = L.turn * 1.8;
    } else if (b.shieldSide) turn = L.turn * 7;           // cleared the shield: curl in hard so it does not sail past
  }
  b.angle = turnToward(b.angle, Math.atan2(ay - b.y, ax - b.x), turn * dt);
  b.vx = Math.cos(b.angle) * b.speed; b.vy = Math.sin(b.angle) * b.speed;
}

function spawnBullet(x, y, angle, speed, from, w) {
  bullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, angle, from, speed,
                 w: w || null, range: w ? w.range : 340, traveled: 0, dead: false, ox: x, oy: y,
                 smart: from === 'player' && player.smart > 0 });     // fired while Smart Link is on: this round homes
}

/** Player bullet damage, with distance falloff for guns that have it (the shotgun). */
function bulletDamage(b) {
  const w = b.w;
  if (!w.falloff) return w.dmg;
  return Math.max(w.minDmg, w.dmg * (1 - b.traveled / w.falloff));
}

function updateBullets(dt) {
  const stepsFor = b => Math.max(3, Math.ceil(b.speed * dt / 4));   // sub-steps so fast bullets cannot skip through things
  for (const b of bullets) {
    if (b.smart) steerBullet(b, dt);
    const STEPS = stepsFor(b);           // faster bullets get more sub-steps, so nothing can skip past a target
    for (let s = 0; s < STEPS && !b.dead; s++) {
      b.x += b.vx * dt / STEPS; b.y += b.vy * dt / STEPS; b.traveled += b.speed * dt / STEPS;
      if (b.from === 'player') {                           // one hit kills a camera
        const cm = cameraAt(b.x, b.y, CAMERA.hitRadius);
        if (cm) { destroyCamera(cm); if (!(b.w && b.w.pierce)) { b.dead = true; break; } }
      }
      // pierce = this round ignores walls, doors and furniture, and keeps going after it hits someone (the railgun)
      const blocked = blocksSight(tileOf(b.x), tileOf(b.y)), pierce = !!(b.w && b.w.pierce);
      if (blocked && pierce && !b.inWall) spawnSparks(b.x, b.y, '#ffffff', 5);        // sparks where it punches into a wall
      b.inWall = blocked;
      if (blocked) {                                       // an explosive barrel goes up when anything hits it
        const br = barrelAt(tileOf(b.x), tileOf(b.y));
        if (br) { explodeBarrel(br); if (!pierce) { b.dead = true; break; } }
      }
      if (blocked && !pierce) {
        b.dead = true; spawnSparks(b.x, b.y, b.from === 'player' ? CYAN : YELLOW, 4);
        if (b.w && b.w.breaksDoors && isClosedDoor(tileOf(b.x), tileOf(b.y))) breakDoor(tileOf(b.x), tileOf(b.y));
      } else if (b.from === 'player') {
        for (const e of enemies) {
          if (e.dead || Math.hypot(e.x - b.x, e.y - b.y) >= e.r + 2) continue;
          if (!pierce) {
            if (shieldBlocks(e, b.angle + Math.PI)) { spawnSparks(b.x, b.y, '#eaffff', 4); Sound.click(); alertEnemy(e, player.x, player.y); }   // pinged off a riot shield
            else damageEnemy(e, b.angle, bulletDamage(b));
            b.dead = true; break;
          }
          if (!(b.hit || (b.hit = [])).includes(e)) { b.hit.push(e); damageEnemy(e, b.angle, bulletDamage(b)); }   // hits everyone on its line, once each
        }
        if (pierce) for (const e of enemies) {             // a railgun round tearing past (even through a wall) spooks anyone it misses
          if (e.dead || Math.hypot(e.x - b.x, e.y - b.y) > AI.railNearMiss || (b.hit && b.hit.includes(e)) || (b.spooked || (b.spooked = [])).includes(e)) continue;
          b.spooked.push(e); makeSuspicious(e, b.ox, b.oy);
        }
      } else if (!player.dead && Math.hypot(player.x - b.x, player.y - b.y) < player.r + 2) {
        damagePlayer(b.angle); b.dead = true;
      }
    }
    if (b.traveled >= b.range || b.x < -40 || b.y < -40 || b.x > WORLD_W + 40 || b.y > WORLD_H + 40) b.dead = true;   // out of range, or off the map
    if (b.dead && b.w && b.w.thrown && !b.dropped) {          // a thrown knife lands where it stopped: pick it back up, and enemies may spot it
      b.dropped = true;
      let kx = b.x, ky = b.y;
      for (let k = 0; k < 6 && isSolid(tileOf(kx), tileOf(ky)); k++) { kx -= Math.cos(b.angle) * 4; ky -= Math.sin(b.angle) * 4; }
      floorStates[floorIdx].knives.push({ x: kx, y: ky, a: b.angle });
    }
  }
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);
}

function spawnBlood(x, y, angle, count) {
  for (let i = 0; i < count; i++) {
    const a = angle + rand(-0.9, 0.9), s = rand(30, 170);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.15, 0.45),
                     color: Math.random() < 0.5 ? PINK : '#c4124b', size: randInt(1, 2), stain: true });
  }
}
/** A ring of orange sparks showing an area hack's reach. */
function spawnRing(x, y, r) {
  for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2; spawnSparks(x + Math.cos(a) * r, y + Math.sin(a) * r, '#ff9a1f', 1); }
}

/** A flash of colored light on the world that fades out over life seconds. */
function addLight(x, y, r, color, life, a = 0.5) {
  if (lights.length > 28) lights.shift();
  lights.push({ x, y, r, color, t: life, life, a });
}
/** Drifting smoke puffs: they swell, slow down and fade. */
function spawnSmoke(x, y, count, spread = 10, color = '#8a7fa8') {
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2), s = rand(4, 26), life = rand(0.5, 1.3);
    particles.push({ x: x + rand(-spread, spread), y: y + rand(-spread, spread), vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6,
                     life, max: life, color, size: rand(2, 5), grow: rand(4, 9), smoke: true, stain: false });
  }
}
function spawnSparks(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2), s = rand(40, 140), life = rand(0.08, 0.25);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size: 1, stain: false, glow: true });
  }
  if (count >= 4) addLight(x, y, 14 + count, color, 0.1, 0.4);
}
function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.9; p.vy *= 0.9;
    if (p.smoke) p.size += p.grow * dt;
    p.life -= dt;
    if (p.life <= 0 && p.stain && !isSolid(tileOf(p.x), tileOf(p.y))) {
      decals.fillStyle = p.color;
      decals.fillRect(Math.round(p.x), Math.round(p.y), p.size + 1, p.size + 1);   // blood stays on the floor
    }
  }
  particles = particles.filter(p => p.life > 0);
}

/* =====================================================================
   13. UPDATE
   ===================================================================== */
function update(dt) {
  if (bindsOpen || cyberOpen || pickingDiff || pauseOpen) { ePressed = false; return; }   // a panel, the picker or the pause menu is open: game is paused
  // Sandevistan: the world (enemies, every bullet, grenades) runs slow. You and your timers do not.
  const wdt = state === 'play' && player.sandy > 0 ? dt * CYBERWARE.sandevistan.slow : dt;
  time += dt;
  sway = Math.sin(time * 0.5) * 0.012;           // slow Hotline-style camera tilt
  shake = Math.max(0, shake - dt * 22);
  hurt = Math.max(0, hurt - dt * 2.5);
  banner.t = Math.max(0, banner.t - dt);
  glitchT = Math.max(0, glitchT - dt);
  floorFlash = Math.max(0, floorFlash - dt);
  for (const bm of beams) bm.t -= dt;
  for (const lt of lights) lt.t -= dt;
  lights = lights.filter(lt => lt.t > 0);
  beams = beams.filter(bm => bm.t > 0);
  nextGlitch -= dt;
  if (nextGlitch <= 0) { nextGlitch = rand(5, 11); if (!REDUCED_MOTION) glitchT = 0.12; }

  if (state === 'play') {
    missionTime += dt;
    updateCritical(dt);
    updateWaves(dt);
    arriveFollowers();
    if (state === 'play') updatePlayer(dt);
    if (state === 'play' && hackGame) updateHack(dt);
    if (state === 'play') {
      updateCameras(wdt);
      for (const e of enemies) updateEnemy(e, wdt);
      separateEnemies();
    }
  }
  // walk cycle: feet move with the distance each character actually covered
  for (const o of [player, ...enemies]) {
    if (!o) continue;
    o.walk = (o.walk || 0) + Math.hypot(o.x - (o.wx === undefined ? o.x : o.wx), o.y - (o.wy === undefined ? o.y : o.wy));
    o.wx = o.x; o.wy = o.y;
  }
  if (state !== 'title') { updateGrenades(wdt); updateBullets(wdt); updateParticles(wdt); }
  ePressed = false;

  // camera follows the player and leans toward the cursor
  if (player) {
    const tx = player.x + (mouse.sx - W / 2) * 0.3, ty = player.y + (mouse.sy - H / 2) * 0.3;
    const k = Math.min(1, dt * 8);
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  }
}

/** Cheap repeatable noise in 0..1 from tile coordinates, so painted details stay put between frames and replays. */
function hsh(x, y, k = 0) {
  let n = (Math.imul(x + 11, 374761393) + Math.imul(y + 7, 668265263) + Math.imul(k + 3, 2246822519)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

const hexA = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;

/** Dark floor tiles. Add a case here to make a new floor style. */
function paintFloor(f, style, px, py, x, y) {
  const fill = c => { f.fillStyle = c; f.fillRect(px, py, TILE, TILE); };
  const dot = (c, ...rects) => { f.fillStyle = c; for (const [a, b, w, h] of rects) f.fillRect(px + a, py + b, w, h); };
  switch (style) {
    case 'a': fill('#2a0d38'); dot('#160a25', [0, 0, 8, 8], [8, 8, 8, 8]); break;                         // club checker
    case 'f': fill('#0a2f3a'); dot('#08151e', [0, 0, 8, 8], [8, 8, 8, 8]); break;                         // teal checker
    case 'b': fill('#151936'); dot('#222855', [0, 0, 16, 1], [0, 0, 1, 16]); dot('#3a4390', [2, 2, 1, 1], [13, 13, 1, 1]); break;   // riveted plate
    case 'c': fill('#0a1e27'); dot('#11333f', [0, 7, 16, 1], [7, 0, 1, 16]); dot('#1c5a66', [6, 6, 3, 3]); break;                   // circuit grid
    case 'd': fill('#22103a'); dot('#31175a', [3, 3, 2, 2], [11, 11, 2, 2]); break;                       // carpet
    case 'e': fill('#300b3c'); dot('#4d1260', [2, 12, 4, 1], [6, 8, 4, 1], [10, 4, 4, 1]); break;         // slashed vinyl
    case 'g': fill('#161629'); dot('#23233f', [2, 2, 2, 2], [10, 9, 2, 2]);                               // concrete
              if ((x + y) % 5 === 0) dot('#5c5420', [1, 14, 6, 1], [9, 14, 6, 1]); break;
    case 's': fill('#0b1418'); dot('#132a2e', [0, 0, 16, 1], [0, 0, 1, 16]);                             // raised server floor tiles
              dot('#1d4a3e', [3, 3, 1, 1], [12, 3, 1, 1], [3, 12, 1, 1], [12, 12, 1, 1]);
              if ((x * 7 + y * 3) % 4 === 0) dot('#1a3a5a', [5, 7, 6, 2]); break;                         // floor vents
    case 'D': fill('#18182c'); dot('#4a4418', [0, 0, 4, 1], [8, 0, 4, 1], [4, 15, 4, 1], [12, 15, 4, 1]); break;   // door threshold
    default:  fill('#0d0a1c'); dot('#18133a', [3, 5, 1, 1], [11, 12, 1, 1], [7, 2, 3, 1]);                // wet asphalt
              if (y === STREET_TOP + 3 && x % 3 === 0) dot('#3a3168', [0, 7, 10, 2]);
  }
}

}

/** Pavement along the front of the building: slabs, seams, and a curb. */

  f.fillStyle = '#120f24'; f.fillRect(px0 + (x % 2 ? 0 : 8), py0, 1, TILE - 2); f.fillRect(px0, py0 + 7, TILE, 1);

  f.fillStyle = '#0a0817'; f.fillRect(px0, py0 + TILE - 1, TILE, 1);
}

/** Wear and tear on top of a floor tile: specks, scuffs, stains, floor vents, and puddles on the street. */
function paintGrime(f, l, style, px0, py0, x, y, fi) {
  const h = hsh(x, y, fi), h2 = hsh(x, y, fi + 7);
  if (h < 0.3) { f.fillStyle = 'rgba(0,0,0,0.25)'; f.fillRect(px0 + ((h * 97) | 0) % 13, py0 + ((h * 631) | 0) % 13, 2, 1); }
  if (h > 0.88) { f.fillStyle = 'rgba(255,255,255,0.06)'; f.fillRect(px0 + 2, py0 + ((h * 53) | 0) % 12 + 1, 9, 1); }
  if (style === 'D') return;
  if (style === '.') {
    if (h2 > 0.955) {                                      // puddle that picks up the neon
      f.fillStyle = '#070512'; f.fillRect(px0 + 2, py0 + 5, 12, 6); f.fillRect(px0 + 4, py0 + 3, 8, 10);
      l.fillStyle = hexA(h2 > 0.978 ? PINK : CYAN, 0.1); l.fillRect(px0 + 3, py0 + 5, 10, 5);
    } else if (h2 < 0.02) {                                // manhole
      f.fillStyle = '#05030c'; f.fillRect(px0 + 3, py0 + 3, 10, 10);
      f.fillStyle = '#231f45'; f.fillRect(px0 + 4, py0 + 4, 8, 8);
      f.fillStyle = '#05030c'; f.fillRect(px0 + 4, py0 + 7, 8, 1); f.fillRect(px0 + 7, py0 + 4, 1, 8);
    }
  } else if (h2 > 0.955) {                                 // old stain
    f.fillStyle = 'rgba(0,0,0,0.3)'; f.fillRect(px0 + 3, py0 + 4, 9, 7); f.fillRect(px0 + 5, py0 + 2, 5, 11);
  } else if (h2 < 0.03) {                                  // floor vent
    f.fillStyle = '#05030c'; f.fillRect(px0 + 3, py0 + 3, 10, 10);
    f.fillStyle = '#2a2550'; for (let i = 0; i < 4; i++) f.fillRect(px0 + 4, py0 + 4 + i * 2 + (i > 1 ? 1 : 0), 8, 1);
  }
}

/** A wall tile seen from above: dark sides, a lighter top face, panel seams and the odd rivet. */
function paintWall(w, px0, py0, x, y, horizontal) {
  w.fillStyle = '#07030f'; w.fillRect(px0, py0, TILE, TILE);
  w.fillStyle = '#140c2b'; w.fillRect(px0 + 2, py0 + 2, TILE - 4, TILE - 4);
  w.fillStyle = '#1e1440'; w.fillRect(px0 + 2, py0 + 2, TILE - 4, 1);
  w.fillStyle = '#0a0619';
  if (horizontal) w.fillRect(px0 + 7, py0 + 2, 1, TILE - 4); else w.fillRect(px0 + 2, py0 + 7, TILE - 4, 1);
  if (hsh(x, y, 5) > 0.6) { w.fillStyle = '#3a2f7a'; w.fillRect(px0 + 4, py0 + 4, 1, 1); w.fillRect(px0 + 11, py0 + 11, 1, 1); }
  if (hsh(x, y, 6) > 0.85) { w.fillStyle = '#261c52'; if (horizontal) w.fillRect(px0, py0 + 10, TILE, 2); else w.fillRect(px0 + 10, py0, 2, TILE); }   // conduit
}

/** Rooftop of the neighboring block: tar, seams, and the occasional AC unit or vent stack. */
function paintRoof(w, px0, py0, x, y) {
  w.fillStyle = '#04020a'; w.fillRect(px0, py0, TILE, TILE);
  w.fillStyle = '#0a0716'; w.fillRect(px0, py0, TILE, 1); w.fillRect(px0, py0, 1, TILE);
  const h = hsh(x, y, 3);
  if (h > 0.94) {                                          // AC unit with a fan
    w.fillStyle = '#15122a'; w.fillRect(px0 + 2, py0 + 2, 12, 12);
    w.fillStyle = '#231f45'; w.fillRect(px0 + 4, py0 + 4, 8, 8);
    w.fillStyle = '#0a0716'; w.fillRect(px0 + 7, py0 + 4, 2, 8); w.fillRect(px0 + 4, py0 + 7, 8, 2);
  } else if (h < 0.04) {                                   // vent stack
    w.fillStyle = '#1b1838'; w.fillRect(px0 + 5, py0 + 5, 6, 6);
    w.fillStyle = '#04020a'; w.fillRect(px0 + 7, py0 + 7, 2, 2);
  } else if (h > 0.9) {                                    // skylight
    w.fillStyle = '#0d1a2a'; w.fillRect(px0 + 3, py0 + 5, 10, 6);
    w.fillStyle = '#14304a'; w.fillRect(px0 + 4, py0 + 6, 3, 1);
  }
}

/** Furniture. What it is depends on the room's floor style, so a bar looks like a bar and an office like an office. */
/** A server rack seen from above: a black cabinet with a mesh top, cable trays and a green glow. Its lights blink at runtime. */
function paintServer(w, l, f, px, py) {
  f.fillStyle = 'rgba(0,0,0,0.45)'; f.fillRect(px + 2, py + 3, TILE, TILE);
  w.fillStyle = '#05050c'; w.fillRect(px, py, TILE, TILE);
  w.fillStyle = '#161a26'; w.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);
  w.fillStyle = '#20263a';
  for (let k = 0; k < 4; k++) w.fillRect(px + 2, py + 2 + k * 3, TILE - 4, 2);        // rack units
  w.fillStyle = '#0a0d16'; for (let k = 0; k < 4; k++) w.fillRect(px + 2, py + 4 + k * 3, TILE - 4, 1);
  w.fillStyle = '#39ff88'; w.fillRect(px + 1, py + TILE - 2, TILE - 2, 1);            // the green strip along its base
  l.fillStyle = hexA('#39ff88', 0.12); l.fillRect(px - 2, py - 2, TILE + 4, TILE + 4);
}

function paintFurniture(w, l, style, px0, py0, x, y, col) {
  const q = (c, a, b, ww, hh) => { w.fillStyle = c; w.fillRect(px0 + a, py0 + b, ww, hh); };
  q('#05030c', 0, 0, 16, 16);
  let glow = 0.1;
  switch (style) {
    case '.':                                              // street: dumpster
      q('#1f3a34', 1, 2, 14, 13); q('#2c5248', 1, 2, 14, 4); q('#0f1f1c', 1, 6, 14, 1);
      q('#16302a', 3, 9, 2, 5); q('#16302a', 11, 9, 2, 5); q('#f9f871', 6, 10, 4, 1); glow = 0; break;
    case 'a':                                              // club: arcade cabinet
      q('#221a44', 1, 1, 14, 14); q('#0b0818', 3, 3, 10, 7); q(col, 4, 4, 8, 5); q('#ffffff', 5, 5, 2, 1);
      q('#3a2f7a', 3, 11, 10, 3); q(PINK, 4, 12, 2, 1); q(YELLOW, 8, 12, 2, 1); q(CYAN, 11, 12, 1, 1); glow = 0.3; break;
    case 'f':                                              // bar: table with bottles and glasses
      q('#3b2148', 1, 1, 14, 14); q('#55306a', 2, 2, 12, 12); q('#472857', 3, 3, 10, 10);
      q(CYAN, 4, 4, 2, 3); q('#ffffff', 4, 4, 1, 1); q(PINK, 9, 6, 2, 3); q(YELLOW, 6, 10, 2, 2); q('#cfd8ff', 11, 11, 1, 1); break;
    case 'b':                                              // steel crate
      q('#2a2d4f', 1, 1, 14, 14); q('#3a3f6e', 1, 1, 14, 2); q('#1a1c36', 1, 7, 14, 2); q('#1a1c36', 7, 1, 2, 14);
      q(YELLOW, 3, 4, 3, 1); q('#5560a0', 2, 2, 1, 1); q('#5560a0', 13, 2, 1, 1); q('#5560a0', 2, 13, 1, 1); q('#5560a0', 13, 13, 1, 1); glow = 0; break;
    case 'd':                                              // office: desk, monitor, keyboard, mug
      q('#3a2a52', 1, 2, 14, 12); q('#4b3768', 1, 2, 14, 2); q('#0b0818', 3, 4, 8, 5); q(col, 4, 5, 6, 3);
      q('#ffffff', 5, 5, 2, 1); q('#cfd8ff', 4, 10, 6, 2); q('#19e36b', 12, 5, 2, 2); q('#0b0818', 12, 10, 2, 3); glow = 0.28; break;
    case 'e':                                              // lounge: couch
      q('#40104f', 1, 1, 14, 14); q('#5a1670', 1, 4, 14, 11); q('#8e35a8', 2, 5, 6, 8); q('#8e35a8', 9, 5, 5, 8);
      q('#a84cc2', 2, 5, 6, 1); q('#a84cc2', 9, 5, 5, 1); q(col, 1, 1, 14, 1); break;
    default:                                               // server rack with status LEDs
      q('#1c1740', 1, 1, 14, 14); q('#3a2f7a', 1, 1, 14, 2); q('#0d0a1f', 3, 5, 10, 3); q('#0d0a1f', 3, 10, 10, 3);
      q(col, 4, 6, 2, 1); q(col, 10, 11, 2, 1); q('#ffffff', 8, 6, 1, 1); q('#39ff88', 12, 6, 1, 1); glow = 0.14;
  }
  if (glow) { l.fillStyle = hexA(col, glow); l.fillRect(px0 - 3, py0 - 3, TILE + 6, TILE + 6); }
}

/** A parked car seen from above, painted on the wall layer. Headlights and taillights glow on the light layer. */
function paintCar(w, l, car) {
  const X = car.x * TILE, Y = car.y * TILE, horiz = car.w > car.h;
  const L = (horiz ? car.w : car.h) * TILE, S = (horiz ? car.h : car.w) * TILE;
  w.save(); l.save();
  // draw it pointing right along its length, then rotate into place
  for (const c of [w, l]) {
    if (horiz) { c.translate(X, Y); if (car.flip) { c.translate(L, S); c.rotate(Math.PI); } }
    else { c.translate(X + S, Y); c.rotate(Math.PI / 2); if (car.flip) { c.translate(L, S); c.rotate(Math.PI); } }
  }
  const R = (c, x, y, ww, hh) => { w.fillStyle = c; w.fillRect(x, y, ww, hh); };
  R('rgba(0,0,0,0.45)', 3, 4, L - 2, S - 2);              // shadow
  R('#0b0816', 4, 1, 7, 4); R('#0b0816', L - 13, 1, 7, 4); R('#0b0816', 4, S - 5, 7, 4); R('#0b0816', L - 13, S - 5, 7, 4);   // tyres
  R('#05030c', 2, 3, L - 4, S - 6);                       // outline
  R(car.color, 3, 4, L - 6, S - 8);                       // body
  R('rgba(255,255,255,0.18)', 3, 4, L - 6, 2);            // lit edge
  R('rgba(0,0,0,0.25)', 3, S - 6, L - 6, 2);              // shaded edge
  R('#0e2a40', L - 22, 6, 7, S - 12);                     // windscreen
  R('#1a4a68', L - 21, 7, 2, S - 14);
  R(car.color, 22, 6, L - 44, S - 12); R('rgba(0,0,0,0.18)', 22, 6, L - 44, S - 12);   // roof
  R('#0e2a40', 15, 7, 6, S - 14);                         // rear window
  R('#fff6c8', L - 4, 5, 2, 4); R('#fff6c8', L - 4, S - 9, 2, 4);   // headlights
  R('#ff2a3a', 2, 5, 2, 4); R('#ff2a3a', 2, S - 9, 2, 4);           // taillights
  l.fillStyle = 'rgba(255,246,200,0.16)'; l.fillRect(L - 2, 2, 20, S - 4);
  l.fillStyle = 'rgba(255,40,60,0.16)'; l.fillRect(-8, 3, 10, S - 6);
  w.restore(); l.restore();
}

function paintOneFloor(plv, fi, set) {
  const f = set.floor.getContext('2d'), w = set.wall.getContext('2d'), l = set.light.getContext('2d'), sh = set.shape.getContext('2d');
  const special = new Set();                              // tiles taken by cars and barrels, which get their own art
  for (const c of plv.cars || []) for (let yy = c.y; yy < c.y + c.h; yy++) for (let xx = c.x; xx < c.x + c.w; xx++) special.add(yy * COLS + xx);
  for (const b of plv.barrels || []) special.add(b.y * COLS + b.x);
  for (const sv of plv.servers || []) special.add(sv.y * COLS + sv.x);
  for (const c of [f, w, l]) c.clearRect(0, 0, WORLD_W, WORLD_H);

  // which room owns each tile, so walls and furniture can take that room's neon color
  const roomOf = new Int16Array(COLS * ROWS).fill(-1);
  plv.rooms.forEach((r, i) => {
    for (let yy = r.y; yy < r.y + r.h; yy++) for (let xx = r.x; xx < r.x + r.w; xx++) roomOf[yy * COLS + xx] = i;
  });
  const charAt = (x, y) => (plv.rows[y] || '')[x];
  const accentAt = (x, y) => {
    const i = roomOf[y * COLS + x];
    return i >= 0 ? plv.rooms[i].accent : (y >= STREET_TOP ? CYAN : PINK);
  };

  const furniture = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const ch = charAt(x, y), px0 = x * TILE, py0 = y * TILE, style = plv.floor[y][x];

    if (ch !== '#') {
      if (fi === 0 && y === STREET_TOP && style === '.') paintSidewalk(f, px0, py0, x);
      else paintFloor(f, style, px0, py0, x, y);
      paintGrime(f, l, style, px0, py0, x, y, fi);
      if (charAt(x, y - 1) === '#') {                      // walls cast a shadow onto the floor below them
        f.fillStyle = 'rgba(0,0,0,0.4)'; f.fillRect(px0, py0, TILE, 3);
        f.fillStyle = 'rgba(0,0,0,0.18)'; f.fillRect(px0, py0 + 3, TILE, 2);
      }
      if (charAt(x - 1, y) === '#') {                      // and soft contact shadows along the other sides, so rooms feel sunk in
        f.fillStyle = 'rgba(0,0,0,0.3)'; f.fillRect(px0, py0, 2, TILE);
        f.fillStyle = 'rgba(0,0,0,0.13)'; f.fillRect(px0 + 2, py0, 2, TILE);
      }
      if (charAt(x + 1, y) === '#') { f.fillStyle = 'rgba(0,0,0,0.2)'; f.fillRect(px0 + TILE - 2, py0, 2, TILE); }
      if (charAt(x, y + 1) === '#') { f.fillStyle = 'rgba(0,0,0,0.2)'; f.fillRect(px0, py0 + TILE - 2, TILE, 2); }
    }
    if (ch === 'U' || ch === 'V') paintStairs(f, l, px0, py0, ch === 'U');

    if (ch === '#') {
      // solid rock with nothing walkable around it reads as the rooftops of the block next door
      let deep = true;
      for (let dy = -1; dy <= 1 && deep; dy++) for (let dx = -1; dx <= 1; dx++) {
        const n = charAt(x + dx, y + dy);
        if (n !== undefined && n !== '#') { deep = false; break; }
      }
      if (deep) { paintRoof(w, px0, py0, x, y); continue; }
      paintWall(w, px0, py0, x, y, charAt(x - 1, y) === '#' || charAt(x + 1, y) === '#');
      // neon trim on every side that faces open space, in the color of the room it faces
      for (const [dx, dy] of DIRS) {
        const n = charAt(x + dx, y + dy);
        if (n === undefined || n === '#') continue;
        const col = accentAt(x + dx, y + dy);
        const sign = (x * 31 + y * 17 + dx * 5 + dy * 3) % 9 === 0;      // some stretches get a brighter sign strip
        w.fillStyle = col; l.fillStyle = hexA(col, sign ? 0.45 : 0.2);
        const t = sign ? 2 : 1, glow = sign ? 10 : 4;
        if (dy === -1) { w.fillRect(px0, py0, TILE, t); l.fillRect(px0, py0 - glow, TILE, glow); }
        if (dy === 1)  { w.fillRect(px0, py0 + TILE - t, TILE, t); l.fillRect(px0, py0 + TILE, TILE, glow); }
        if (dx === -1) { w.fillRect(px0, py0, t, TILE); l.fillRect(px0 - glow, py0, glow, TILE); }
        if (dx === 1)  { w.fillRect(px0 + TILE - t, py0, t, TILE); l.fillRect(px0 + TILE, py0, glow, TILE); }
      }
    } else if (ch === 'o') {
      if (special.has(y * COLS + x)) continue;           // car or barrel: drawn separately
      furniture.push([px0, py0]);
      paintFurniture(w, l, style, px0, py0, x, y, accentAt(x, y));
    }
  }
  f.fillStyle = 'rgba(0,0,0,0.42)';                        // furniture drop shadows, after every floor tile is down
  for (const [fx, fy] of furniture) f.fillRect(fx + 2, fy + 3, TILE, TILE);
  for (const car of plv.cars || []) paintCar(w, l, car);
  for (const sv of plv.servers || []) paintServer(w, l, f, sv.x * TILE, sv.y * TILE);

  // the shape layer: what you see of places you have no line of sight to. Walls and bare floor, nothing else.
  sh.fillStyle = '#04020a'; sh.fillRect(0, 0, WORLD_W, WORLD_H);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const ch = charAt(x, y), px0 = x * TILE, py0 = y * TILE;
    if (ch !== '#') {
      sh.fillStyle = fi === 0 && y >= STREET_TOP ? '#07050f' : '#0b0818';
      sh.fillRect(px0, py0, TILE, TILE);
      continue;
    }
    let nearOpen = false;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const n = charAt(x + dx, y + dy);
      if (n !== undefined && n !== '#') nearOpen = true;
    }
    if (!nearOpen) continue;
    sh.fillStyle = '#120d28'; sh.fillRect(px0, py0, TILE, TILE);
    sh.fillStyle = '#3a3470';                              // a dim outline on each side that faces a room
    for (const [dx, dy] of DIRS) {
      const n = charAt(x + dx, y + dy);
      if (n === undefined || n === '#') continue;
      if (dy === -1) sh.fillRect(px0, py0, TILE, 1);
      if (dy === 1)  sh.fillRect(px0, py0 + TILE - 1, TILE, 1);
      if (dx === -1) sh.fillRect(px0, py0, 1, TILE);
      if (dx === 1)  sh.fillRect(px0 + TILE - 1, py0, 1, TILE);
    }
  }

  // pools of neon light: one or two per room (clipped so they do not leak through walls), lamps on the street
  const pool = (x, y, r, col, a) => {
    const grad = l.createRadialGradient(x, y, 2, x, y, r);
    grad.addColorStop(0, hexA(col, a)); grad.addColorStop(1, hexA(col, 0));
    l.fillStyle = grad; l.fillRect(x - r, y - r, r * 2, r * 2);
  };
  for (const r of plv.rooms) {
    l.save();
    l.beginPath(); l.rect(r.x * TILE, r.y * TILE, r.w * TILE, r.h * TILE); l.clip();
    for (const lt of r.lights || []) pool(lt.x, lt.y, lt.r, r.accent, 0.34);
    l.restore();
  }
  if (fi === 0) for (let x = 3, i = 0; x < COLS; x += 7, i++) {
    const lx = x * TILE + 8, ly = (STREET_TOP + 1) * TILE, col = i % 2 ? PINK : CYAN;
    pool(lx, ly, 64, col, 0.3);
    // the wet street mirrors each lamp as a long broken streak
    for (let k = 0; k < 9; k++) {
      const yy = ly + 10 + k * 8, wob = Math.round(Math.sin(k * 2.4 + i) * 2);
      l.fillStyle = hexA(col, 0.2 * (1 - k / 9));
      l.fillRect(lx - 3 + wob, yy, 6, 5);
      l.fillStyle = hexA('#ffffff', 0.07 * (1 - k / 9));
      l.fillRect(lx - 1 + wob, yy + 1, 2, 3);
    }
  }
  if (fi === 0) {                                          // puddles: dark glossy patches with a pale rim of reflected sky
    for (let i = 0; i < 16; i++) {
      const px = (Math.abs(Math.sin(i * 91.7 + plv.rooms.length) * 9973) % 1) * WORLD_W, py = (STREET_TOP + 1.5) * TILE + (Math.abs(Math.sin(i * 47.3) * 7919) % 1) * (ROWS - STREET_TOP - 2.5) * TILE;
      if (charAt(Math.floor(px / TILE), Math.floor(py / TILE)) !== '.') continue;
      const rw = 6 + (i % 4) * 3, rh = 2 + (i % 3);
      f.fillStyle = 'rgba(2,2,12,0.45)'; f.beginPath(); f.ellipse(px, py, rw, rh, 0, 0, Math.PI * 2); f.fill();
      f.strokeStyle = 'rgba(140,200,255,0.16)'; f.beginPath(); f.ellipse(px, py, rw, rh, 0, Math.PI * 1.05, Math.PI * 1.95); f.stroke();
      l.fillStyle = hexA(i % 2 ? PINK : CYAN, 0.1); l.beginPath(); l.ellipse(px, py, rw - 1, Math.max(1, rh - 1), 0, 0, Math.PI * 2); l.fill();
    }
  }
}

/** Soft additive glow, used for visors, eyes and anything else that should look lit. */
function drawGlow(x, y, color, r) {
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = hexA(color, 0.16);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

/** One Sandevistan afterimage: a full copy of the character as they stood there, recolored in the next neon hue. */
function drawGhost(gh) {
  const h = gh.hue, a = gh.life / GHOST_LIFE;
  const look = { body: `hsl(${h},100%,58%)`, trim: `hsl(${(h + 40) % 360},100%,74%)`, head: `hsl(${h},100%,82%)`,
                 accent: DARK, boots: `hsl(${h},100%,45%)`, w: LOOKS.player.w, ghost: true };
  ctx.save();
  ctx.globalAlpha = 0.85 * Math.min(1, a * 1.6);          // stays solid for a moment, then fades out
  artTint = `hsl(${h},100%,72%)`;
  drawFigure(gh.x, gh.y, gh.angle, look, 0, 0, gh.carrying, gh.weapon, gh.walk);
  artTint = null;
  ctx.restore();
}

/** A person seen from above, facing `angle`: boots, arms, the weapon in their hands, torso, head. */
function drawFigure(x, y, angle, look, flash, muzzle, carrying, weapon, walk) {
  const w = look.w, art = WEAPON_ART[weapon] || WEAPON_ART.pistol;
  const X = Math.round(x), Y = Math.round(y);
  if (!look.ghost) {                                       // soft shadow on the floor
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.beginPath(); ctx.ellipse(X + 1, Y + 2, w + 2, w + 1, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save();
  ctx.translate(X, Y); ctx.rotate(angle);
  const body = flash > 0 ? '#fff' : look.body, trim = flash > 0 ? '#fff' : look.trim;
  const step = Math.sin((walk || 0) * 0.35) * 3;           // feet swing with distance walked
  ctx.fillStyle = look.boots || '#1a1430';
  ctx.fillRect(-1 + step, -w + 1, 4, 3); ctx.fillRect(-1 - step, w - 4, 4, 3);
  ctx.fillStyle = 'rgba(8,2,20,0.75)'; ctx.fillRect(-4, -w - 1, 8, w * 2 + 2);        // outline
  ctx.fillStyle = trim;                                                               // arms out to the weapon
  ctx.fillRect(0, w - 3, 6, 2); ctx.fillRect(0, -w + 1, 4, 2); ctx.fillRect(3, -w + 2, 2, w - 1);
  ctx.save(); ctx.translate(4, 1); art.draw(ctx); ctx.restore();
  if (art.glow && !artTint) {                              // its energy cells light up the hands holding it
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = hexA(art.glow, 0.22); ctx.fillRect(3, -3, art.len + 3, 9);
    ctx.globalCompositeOperation = 'source-over';
  }                      // the weapon model
  if (muzzle > 0 && !art.melee) {
    const m = 4 + art.len;
    ctx.fillStyle = hexA(artTint || art.glow || '#ff9a1f', 0.45); ctx.fillRect(m, 0, 3, 3);   // a small, dim flash right at the barrel tip
    ctx.fillStyle = hexA(YELLOW, 0.6); ctx.fillRect(m, 1, 1, 1);
  }
  ctx.fillStyle = body; ctx.fillRect(-3, -w, 6, w * 2);                               // torso
  ctx.fillStyle = trim; ctx.fillRect(-3, -w, 6, 2); ctx.fillRect(-3, w - 2, 6, 2);    // shoulder pads
  ctx.fillRect(-1, -w + 3, 1, w * 2 - 6);                                             // seam down the back
  if (look.pack) {                                                                    // medic pack with a green cross
    ctx.fillStyle = '#c9d6e6'; ctx.fillRect(-6, -3, 3, 6);
    ctx.fillStyle = '#19e36b'; ctx.fillRect(-5, -2, 1, 4); ctx.fillRect(-6, -1, 3, 2);
  }
  if (carrying) {                                                                     // client slung over the shoulder
    ctx.fillStyle = 'rgba(8,2,20,0.75)'; ctx.fillRect(-9, -8, 6, 16);
    ctx.fillStyle = '#23203a'; ctx.fillRect(-8, 3, 4, 4);
    ctx.fillStyle = '#d9b44a'; ctx.fillRect(-8, -4, 4, 7);
    ctx.fillStyle = '#ffd1a6'; ctx.fillRect(-8, -7, 4, 3);
  }
  if (look.shield) {                                                                  // riot shield: held out front when blocking, swung aside to shoot
    if (look.shieldUp) {
      ctx.fillStyle = '#0b1026'; ctx.fillRect(6, -9, 4, 18);
      ctx.fillStyle = '#9fb4ff'; ctx.fillRect(7, -8, 2, 16);
      ctx.fillStyle = '#eaffff'; ctx.fillRect(7, -2, 2, 4);
    } else {
      ctx.fillStyle = '#0b1026'; ctx.fillRect(-4, -11, 12, 4);
      ctx.fillStyle = '#9fb4ff'; ctx.fillRect(-3, -10, 10, 2);
    }
  }
  ctx.fillStyle = look.head; ctx.fillRect(-2, -3, 5, 6);                               // head
  if (look.helmet) { ctx.fillStyle = '#2c2c44'; ctx.fillRect(-2, -3, 2, 6); }
  else if (look.hair) { ctx.fillStyle = look.hair; ctx.fillRect(-2, -1, 4, 2); }       // mohawk
  ctx.fillStyle = look.accent; ctx.fillRect(2, -2, 1, 4);                              // visor / eyes
  ctx.restore();
}

/** Leaves a body, and the weapon it dropped, on the floor for the rest of the run. */
function stampCorpse(x, y, angle, look, weapon, noWeapon) {
  const art = WEAPON_ART[weapon] || WEAPON_ART.pistol;
  decals.save();
  decals.translate(Math.round(x), Math.round(y)); decals.rotate(angle + rand(-0.6, 0.6));
  decals.fillStyle = '#c4124b';
  decals.beginPath(); decals.ellipse(2, 0, rand(8, 12), rand(6, 9), 0, 0, Math.PI * 2); decals.fill();
  decals.fillStyle = '#8f0f3c';
