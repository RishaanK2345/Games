const canPair = id => !!(CYBERWARE[id] && id !== 'sandevistan');   // everything except the Sandevistan can share with a second piece

const PINK = '#ff2a6d', CYAN = '#05d9e8', PURPLE = '#7a04eb', YELLOW = '#f9f871', INK = '#f7f3ff', DARK = '#0d0221';
const FONT = '8px "Press Start 2P", monospace';

/* =====================================================================
   2. LEVEL  -  procedurally generated, a new building every map
   A level is plain data:  { floors: [ floor, floor, ... ] }   (1 to 3 floors, ground floor first)
   and each floor is:
     rows   : array of strings, one char per tile
              #  wall   o  furniture (solid)   D  door   X  evac zone   .  open floor
              U  stairs up to the next floor   V  stairs down (always directly above the matching U)
     floor  : array of strings, the floor style under each tile (a-g rooms, D door, . street)
     ents   : [{ t, x, y }]   t = P player, C client, E grunt, H heavy, S backup spawn
     rooms  : [{ x, y, w, h, style, accent, lights }]   interior of each room, in tiles
   Only ONE level is ever kept: the current one. Respawning keeps it; picking a new map
   from the picker (any time) rolls a new one, which overwrites it.
   ===================================================================== */
const COLS = 48, ROWS = 30;
const WORLD_W = COLS * TILE, WORLD_H = ROWS * TILE;
const DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];
const STREET_TOP = 24;                      // ground floor only: rows from here down are the street

const GEN = {
  floorChances: [0.4, 0.35, 0.25],          // chance of a 1, 2 or 3 floor building
  floorSize: { 1: [46, 22], 2: [40, 20], 3: [34, 18] },   // interior [width, height] of every floor: more floors, smaller floors
  stairsMin: 1, stairsMax: 3,               // staircases between each pair of neighboring floors
  minW: 9, minH: 7, maxW: 18, maxH: 11,     // room interior size limits, in tiles
  extraDoorChance: 0.3,                     // chance of a bonus door between rooms that are already connected some other way
  enemiesPerRoom: [1, 1, 1, 2, 2, 3],       // one entry is picked per room: always at least 1, never more than 3
  heavyChance: 0.3,
  shieldChance: 0.15,                       // chance that any one enemy is a riot shield carrier instead
  secondClientChance: 0.5,                  // how often a map has two clients to rescue
  sameRoomChance: 0.4,                      // when there are two: how often they share a room
  criticalChance: 0.4,                      // how often a map has a critical client (never more than one per map)
  criticalCameraBonus: 25,   // extra seconds on a critical client's timer when the building has security cameras to deal with
  criticalMin: 90, criticalBase: 45, criticalPerTile: 1, criticalPerFloor: 45,   // their timer in seconds: base + 1 per tile of walking to reach them + 45 per floor up, at least criticalMin
  backupSpawns: 6,                          // backup spawn points at the far end of the street
  droneChance: 0,                           // chance that any one enemy is a kamikaze drone (easy 4%, medium 7%, hard 10%; wave mode has its own)
  cameraChance: 0,                          // chance that a room gets a security camera in one corner
  securityChance: 0,                        // chance that a floor with cameras also gets a security room (guard + laptop that shuts them off)
};
/* Difficulty of a generated map. You pick it on the win screen for the next map; the very first map is medium.
   Anything listed here replaces the GEN setting of the same name while that map is being generated.
     enemiesPerRoom = one entry is picked per room (so always 1 to 3)      timerMult = multiplies a critical client's timer
     shield / hacker / heavy chances are rolled in that order per enemy   backup = [fewest, most] grunts per backup wave */
const DIFFICULTY = {
  // randomGuns = three random guns each run instead of your picks; finiteAmmo = limited spare mags, and the dead drop their weapons
  easy:   { label: 'Easy',   blurb: 'Fewer, weaker enemies. Your guns, unlimited ammo', randomGuns: false, finiteAmmo: false, secondClientChance: 0,
            enemiesPerRoom: [1, 1, 1, 1, 2], heavyChance: 0.15, shieldChance: 0.05, hackerChance: 0.06,
            criticalChance: 0, timerMult: 1.25, floorChances: [0.6, 0.3, 0.1], backup: [1, 3],
            cameraChance: 0.1, droneChance: 0.04 },   // a few cameras (no server rooms: shoot them) and the odd kamikaze drone
  // secondClientChance = how often there are two clients; critSingleOnly = a critical client only on single-client maps
  medium: { label: 'Medium', blurb: 'Your guns, limited ammo: take weapons off the dead', randomGuns: false, finiteAmmo: true, secondClientChance: 0.4, critSingleOnly: true,
            enemiesPerRoom: [1, 1, 1, 2, 2, 3], heavyChance: 0.3, shieldChance: 0.15, hackerChance: 0.14,
            criticalChance: 0.4, timerMult: 1, floorChances: [0.2, 0.45, 0.35], backup: [3, 6],   // taller layouts fail more often and get re-rolled, so this lands near 75% multi-floor
            singleFloorCritical: true,     // a one-floor medium building always has one client, and they are critical
            cameraChance: 0.22, securityChance: 0.8, cameraMapChance: 0.5, droneChance: 0.07 },   // only half of medium buildings have cameras at all
  hard:   { label: 'Hard',   blurb: 'Two or three clients, one critical. Random guns, limited ammo', randomGuns: true, finiteAmmo: true, secondClientChance: 1, thirdClientChance: 0.3,
            enemiesPerRoom: [1, 2, 2, 2, 3, 3], heavyChance: 0.45, shieldChance: 0.22, hackerChance: 0.2,
            criticalChance: 1, timerMult: 0.85, floorChances: [0, 0.5, 0.5], backup: [6, 10],   // always one critical client, on any floor; never a single-floor building
            bossChance: 0.4, secondBossChance: 0.15,     // hard maps may hide a boss (or two) somewhere in the building
            droneChance: 0.1, cameraChance: 0.3, securityChance: 0.8, alwaysCameras: true },   // a hard building always has at least one camera
  // Wave mode: one big floor, no clients. Walk into the building and waves of hunters come for you, bigger and tougher each time.
  waves:  { label: 'Waves',  blurb: 'Endless waves. Your guns, unlimited ammo', waves: true, randomGuns: false, finiteAmmo: false,
            enemiesPerRoom: [1], heavyChance: 0.3, shieldChance: 0.15, hackerChance: 0.14,
            criticalChance: 0, timerMult: 1, floorChances: [1, 0, 0], backup: [3, 6] },
};

/* Wave mode tuning. Wave n has size(n) enemies; the mix gets nastier and everyone gets tougher as n climbs. */
const WAVES = {
  size: n => Math.min(40, 3 + 2 * n),
  shield: n => Math.min(0.3, 0.04 + 0.02 * n),
  hacker: n => Math.min(0.2, 0.02 + 0.015 * n),
  heavy: n => Math.min(0.5, 0.1 + 0.04 * n),
  drone: n => Math.min(0.15, 0.03 + 0.01 * n),
  hpMult: n => Math.min(2, 1 + 0.06 * (n - 1)),
  minSpawnDist: 11 * 16,       // new enemies appear at least this far from you, somewhere you cannot see
  rest: 30,                    // seconds between a cleared wave and the next: time to run to the evac zone and change gear (the skip key starts it early)
  // Bosses: from wave 5 on, one guaranteed boss per 5 waves (waves 5-9: 1, 10-14: 2, 15-19: 3, ...) plus a 20% chance of one more.
  // Waves 3 and 4 have a 20% chance of a single early boss.
  bosses: n => (n >= 5 ? Math.floor(n / 5) : 0) + (n >= 3 && Math.random() < 0.2 ? 1 : 0),
};

/* Elite enemies ("bosses" in the code). Wave mode and hard maps. An elite is a grunt or heavy with far more health, a better gun, and either its own
   Sandevistan or one or two quickhacks it uses on you. Red aura, health bar at the top of the screen.
   bigHit = what a one-shot weapon (railgun, katana, both mantis blades) takes off a boss, as a share of its max health. */
const BOSS = {
  hpMult: 3, speed: 1.25, sight: 260, reaction: 0.5, bigHit: 0.25,
  sandy: { duration: 3.5, cooldown: 12, speed: 2.6, fire: 0.35 },          // the boss's own Sandevistan: it moves and fires much faster
  hacks: ['overheat', 'detonate', 'optics'],
  hackRange: 230, hackWarn: 0.9, hackCooldown: [7, 10],                     // a red warning line for hackWarn seconds before it lands
  playerBurn: 3, playerBurnSlow: 0.6, playerBlind: 5,                       // Overheat on you: 1 health a second for 3s and slowed; Reboot Optics: 5s of near darkness
};
const diffOf = lv => DIFFICULTY[lv && lv.diff] || DIFFICULTY.medium;

/* Security cameras. One sits in a corner of some rooms and sweeps back and forth. If you stay in its cone for notice
   seconds, the few enemies nearest you are told where you are (again every repeat seconds while it still sees you).
   Any hit destroys one. A floor's cameras can also be shut off together from the laptop in its security room. */
const CAMERA = { range: 150, fov: 1.0, sweep: 0.7, sweepSpeed: 0.6, notice: 0.4, repeat: 2.5, hitRadius: 5,
                 bodySenders: 2,
                 alertMin: 3, alertMax: 5 };   // a camera that sees you sends the 3 to 5 enemies nearest you after you, not the whole floor   // a camera that sees a body: the nearest bodySenders calm enemies go check it, the rest of the floor goes wary
/* Server room (medium and hard, at most one per building, on a floor that has cameras): a guard with a pistol sits at
   a laptop. He stays seated, facing the screen, until he notices something himself (sees you, hears a fight, gets hit).
   Floor-wide alarms from cameras, drones or shouting do not get him up. reach = how close you stand to use the laptop. */
const SECURITY = { reach: 26, guardSight: 110, guardFov: 1.3, closeDetect: 24, closeArc: 1.85 };   // closeArc: radians either side of where he faces
/* The laptop hack: one of two minigames, picked at random. Win = every camera in the building goes dark for good.
   Lose = the laptop locks for lockout seconds, then you can try again. Taking a hit or pressing Esc drops out. */
const HACK = {
  lockout: 3,
  // Breach Protocol: pick codes from the matrix, alternating between the highlighted row and column, to type the sequence
  codes: ['1C', '55', 'BD', 'E9', '7A'], size: 5, buffer: 6, time: 25, seqMedium: 3, seqHard: 4,
  // Rhythm: three lanes on keys 1, 2 and 3. Hit each note on its lane key as it crosses the line.
  // window = seconds early or late that still counts; fall = seconds a note takes to drop to the line (higher = slower, easier to read). Miss more than maxMiss (stray presses count) and it fails.
  rhythm: { keys: ['Digit1', 'Digit2', 'Digit3'], numpad: ['Numpad1', 'Numpad2', 'Numpad3'], labels: ['1', '2', '3'], notes: 12, bpm: 104, window: 0.2, maxMiss: 5, fall: 1.7, halfChance: 0 },
};
/* Mission score, shown when you get every client out. The grade comes from three parts, out of 100:
     speed 40 (full at or under par, nothing at twice par), health 30, clean 30 (minus 12 per respawn on this map).
     par = base + per floor + per extra client.
   Stealth is a bonus on top, out of 25: you lose a bit for every enemy that spotted you, more for a camera. It never
   lowers your grade, but an S run that also scores at least plusStealth stealth becomes S+. */
const SCORE = { parBase: 75, parPerFloor: 55, parPerClient: 35, spottedZero: 8, perRespawn: 12, plusStealth: 20,
                grades: [['S', 90], ['A', 78], ['B', 62], ['C', 45], ['D', 0]] };
const GRADE_RANK = ['D', 'C', 'B', 'A', 'S', 'S+'];
const GRADES_KEY = 'flatline.bestGrades';

const ACCENTS = ['#ff2a6d', '#05d9e8', '#b537f2', '#f9f871', '#39ff88'];   // neon color per room
const SAVE_KEY = 'flatline.lastMap.v2';

let level = null;      // the only map kept anywhere
let levelNum = 0;

function generateLevel(diff = 'medium') {
  for (let attempt = 0; attempt < 200; attempt++) {
    const lv = tryGenerateLevel(diff);
    if (lv) { lv.diff = diff; return lv; }
  }
  throw new Error('Level generation failed');
}

/** Walking distance from a ground-floor tile to every tile on every floor, using stairs. -1 = unreachable. */
function floodFloors(grids, sx, sy) {
  const dist = grids.map(() => new Int32Array(COLS * ROWS).fill(-1));
  const queue = [[0, sx, sy]]; dist[0][sy * COLS + sx] = 0;
  for (let qi = 0; qi < queue.length; qi++) {
    const [f, cx, cy] = queue[qi], d = dist[f][cy * COLS + cx];
    const visit = (nf, nx, ny) => {
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return;
      const c = grids[nf][ny][nx], ni = ny * COLS + nx;
      if (c === '#' || c === 'o' || dist[nf][ni] !== -1) return;
      dist[nf][ni] = d + 1; queue.push([nf, nx, ny]);
    };
    for (const [dx, dy] of DIRS) visit(f, cx + dx, cy + dy);
    const here = grids[f][cy][cx];
    if (here === 'U') visit(f + 1, cx, cy);
    if (here === 'V') visit(f - 1, cx, cy);
  }
  return dist;
}

function tryGenerateLevel(diff) {
  const D = { ...GEN, ...(DIFFICULTY[diff] || DIFFICULTY.medium) };       // GEN, with this difficulty's numbers on top
  const pick = arr => arr[randInt(0, arr.length - 1)];
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const grid = ch => Array.from({ length: ROWS }, () => Array(COLS).fill(ch));

  // --- 1. how many floors, and the footprint they all share (more floors = smaller footprint) ---
  let nFloors = D.floorChances.length, roll = Math.random();
  for (let i = 0; i < D.floorChances.length; i++) {
    if (roll < D.floorChances[i]) { nFloors = i + 1; break; }
    roll -= D.floorChances[i];
  }
  if (D.singleFloorCritical && nFloors === 1) { D.secondClientChance = 0; D.criticalChance = 1; }   // small building: make up for it with a clock
  const [bw, bh] = D.floorSize[nFloors];
  const B = { x: 1 + ((COLS - 2 - bw) >> 1), y: STREET_TOP - 1 - bh, w: bw, h: bh };   // sits on the street, centered

  // --- 2. each floor: split the footprint into rooms (binary space partition) and carve them out ---
  const floors = [];
  for (let f = 0; f < nFloors; f++) {
    const g = grid('#'), fl = grid('.'), rooms = [];
    (function split(x, y, w, h) {
      const canV = w >= D.minW * 2 + 1, canH = h >= D.minH * 2 + 1;
      const wideOver = w > D.maxW, tallOver = h > D.maxH;
      if ((canV || canH) && (wideOver || tallOver || Math.random() < 0.2)) {
        let vertical;
        if (!canH) vertical = true;
        else if (!canV) vertical = false;
        else if (wideOver !== tallOver) vertical = wideOver;
        else if (w / h > 1.5) vertical = true;
        else if (h / w > 1.5) vertical = false;
        else vertical = Math.random() < 0.5;
        if (vertical) {
          const k = randInt(D.minW, w - D.minW - 1);
          split(x, y, k, h); split(x + k + 1, y, w - k - 1, h);
        } else {
          const k = randInt(D.minH, h - D.minH - 1);
          split(x, y, w, k); split(x, y + k + 1, w, h - k - 1);
        }
        return;
      }
      rooms.push({ x, y, w, h });
    })(B.x, B.y, B.w, B.h);

    for (const r of rooms) {
      r.style = f === 0 && Math.random() < 0.125 ? 'g' : pick('abcdef'.split(''));   // garages only ever on the ground floor
      r.accent = pick(ACCENTS);
      r.lights = [];
      const nLights = r.w * r.h > 90 ? 2 : 1;
      for (let i = 0; i < nLights; i++) {
        r.lights.push({ x: Math.round(rand(r.x + 1, r.x + r.w - 1) * TILE), y: Math.round(rand(r.y + 1, r.y + r.h - 1) * TILE), r: Math.round(rand(48, 78)) });
      }
      for (let yy = r.y; yy < r.y + r.h; yy++) for (let xx = r.x; xx < r.x + r.w; xx++) { g[yy][xx] = '.'; fl[yy][xx] = r.style; }
    }
    if (f === 0) for (let yy = STREET_TOP; yy < ROWS; yy++) for (let xx = 0; xx < COLS; xx++) g[yy][xx] = '.';
    floors.push({ g, fl, rooms, ents: [], cars: [], barrels: [] });
  }
  const roomIndex = (F, x, y) => F.rooms.findIndex(r => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h);

  // --- 3. stairs: 1 to 3 staircases between each pair of floors, in the same spot on both ---
  // A staircase needs open floor all around it on both floors, which also keeps it away from walls and doors.
  const openAround = (g, x, y) => { for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (g[y + dy][x + dx] !== '.') return false; return true; };
  const stairs = [];
  for (let f = 0; f + 1 < nFloors; f++) {
    const want = randInt(D.stairsMin, D.stairsMax), placed = [];
    for (let tries = 0; tries < 400 && placed.length < want; tries++) {
      const x = randInt(B.x + 1, B.x + B.w - 2), y = randInt(B.y + 1, B.y + B.h - 2);
      if (!openAround(floors[f].g, x, y) || !openAround(floors[f + 1].g, x, y)) continue;
      if (placed.some(s => Math.abs(s.x - x) + Math.abs(s.y - y) < 8)) continue;       // spread them out
      placed.push({ f, x, y });
    }
    if (!placed.length) return null;
    for (const s of placed) { floors[f].g[s.y][s.x] = 'U'; floors[f + 1].g[s.y][s.x] = 'V'; stairs.push(s); }
  }

  // --- 4. doors. The whole building is one graph: rooms are joined by stairs first, then doors are added
  //        only where they are still needed (plus a few bonus ones). So with several staircases, part of a
  //        floor can end up walled off on that floor and only reachable by going through another floor. ---
  const offset = []; let N = 0;
  for (const F of floors) { offset.push(N); N += F.rooms.length; }
  const STREET = N;
  const parent = Array.from({ length: N + 1 }, (_, i) => i);
  const find = i => (parent[i] === i ? i : (parent[i] = find(parent[i])));
  const join = (a, b) => { parent[find(a)] = find(b); };

  for (const s of stairs) join(offset[s.f] + roomIndex(floors[s.f], s.x, s.y), offset[s.f + 1] + roomIndex(floors[s.f + 1], s.x, s.y));

  // one or two street entrances on the ground floor's bottom wall
  const G0 = floors[0];
  const frontRooms = shuffle(G0.rooms.filter(r => r.y + r.h === STREET_TOP - 1));
  if (!frontRooms.length) return null;
  for (const r of frontRooms.slice(0, randInt(1, Math.min(2, frontRooms.length)))) {
    const s = randInt(r.x, r.x + r.w - 2);
    for (const t of [s, s + 1]) { G0.g[STREET_TOP - 1][t] = 'D'; G0.fl[STREET_TOP - 1][t] = 'D'; }
    join(STREET, offset[0] + G0.rooms.indexOf(r));
  }

  const edges = [];
  floors.forEach((F, f) => {
    for (let i = 0; i < F.rooms.length; i++) for (let j = i + 1; j < F.rooms.length; j++) {
      for (const [a, b] of [[F.rooms[i], F.rooms[j]], [F.rooms[j], F.rooms[i]]]) {
        if (a.x + a.w + 1 === b.x) {                     // a is directly left of b
          const from = Math.max(a.y, b.y), to = Math.min(a.y + a.h, b.y + b.h) - 1;
          if (to - from >= 1) edges.push({ f, i, j, vertical: true, at: a.x + a.w, from, to });
        }
        if (a.y + a.h + 1 === b.y) {                     // a is directly above b
          const from = Math.max(a.x, b.x), to = Math.min(a.x + a.w, b.x + b.w) - 1;
          if (to - from >= 1) edges.push({ f, i, j, vertical: false, at: a.y + a.h, from, to });
        }
      }
    }
  });
  const placeDoor = e => {
    const F = floors[e.f], s = randInt(e.from, e.to - 1);          // doors are 2 tiles wide
    for (const t of [s, s + 1]) {
      if (e.vertical) { F.g[t][e.at] = 'D'; F.fl[t][e.at] = 'D'; } else { F.g[e.at][t] = 'D'; F.fl[e.at][t] = 'D'; }
    }
  };
  for (const e of shuffle(edges)) {
    const a = offset[e.f] + e.i, b = offset[e.f] + e.j;
    if (find(a) !== find(b)) { join(a, b); placeDoor(e); }
    else if (Math.random() < D.extraDoorChance) placeDoor(e);
  }
  for (let n = 0; n < N; n++) if (find(n) !== find(STREET)) return null;      // a room nobody can get to: start over

  // --- 5. the street: evac zone on one end, backup spawns on the other, dumpsters for cover ---
  const evacLeft = Math.random() < 0.5;
  const ex = evacLeft ? 1 : COLS - 7;
  for (let yy = STREET_TOP + 1; yy <= STREET_TOP + 4; yy++) for (let xx = ex; xx < ex + 6; xx++) G0.g[yy][xx] = 'X';
  const start = { t: 'P', x: evacLeft ? 9 : COLS - 10, y: STREET_TOP + 2 };
  G0.ents.push(start);
  for (let i = 0; i < D.backupSpawns; i++) {            // spawn points, in columns of 3
    const col = Math.floor(i / 3);
    G0.ents.push({ t: 'S', x: evacLeft ? COLS - 3 - col : 2 + col, y: STREET_TOP + 1 + (i % 3) });
  }
  for (let i = randInt(2, 3); i > 0; i--) {
    const dx = randInt(12, COLS - 14), dy = Math.random() < 0.5 ? STREET_TOP + 1 : STREET_TOP + 4;
    G0.g[dy][dx] = 'o'; G0.g[dy][dx + 1] = 'o';
  }

  // --- 6. clients. The first goes in the room that is the longest walk (stairs included) from the street. ---
  let dist = floodFloors(floors.map(F => F.g), start.x, start.y);
  let far = null, best = -1;
  for (let f = 0; f < nFloors; f++) for (const r of floors[f].rooms) {
    const d = dist[f][(r.y + (r.h >> 1)) * COLS + r.x + (r.w >> 1)];
    if (d < 0) return null;
    if (d > best) { best = d; far = { f, r }; }
  }
  const cls = [];
  const placeClient = (f, r) => {
    for (let tries = 0; tries < 30; tries++) {
      const x = randInt(r.x + 1, r.x + r.w - 2), y = randInt(r.y + 1, r.y + r.h - 2);
      if (floors[f].g[y][x] !== '.') continue;
      if (cls.some(c => c.f === f && Math.abs(c.x - x) + Math.abs(c.y - y) <= 2)) continue;
      const ent = { t: 'C', x, y };
      cls.push({ f, x, y, ent }); floors[f].ents.push(ent);
      return true;
    }
    return false;
  };
  if (!D.waves && !placeClient(far.f, far.r)) return null;          // wave mode has no clients
  if (!D.waves && Math.random() < D.secondClientChance) {          // sometimes a second client: same room, or any other room on any floor
    const others = [];
    floors.forEach((F, f) => F.rooms.forEach(r => { if (r !== far.r) others.push({ f, r }); }));
    const spot = Math.random() < D.sameRoomChance || !others.length ? far : pick(others);
    if (!placeClient(spot.f, spot.r) && D.secondClientChance >= 1) return null;   // two are guaranteed here: try another layout
    if (D.thirdClientChance && Math.random() < D.thirdClientChance) {   // hard: sometimes a third, again in the same room or anywhere else
      const spot3 = Math.random() < D.sameRoomChance || !others.length ? pick([far, spot]) : pick(others);
      placeClient(spot3.f, spot3.r);
    }
  }
  if (cls.length && !(D.critSingleOnly && cls.length > 1) && Math.random() < D.criticalChance) {   // one client, never both, may be critical: bleeding out on a clock
    const cand = D.critNotGround ? cls.filter(c => c.f > 0) : cls;       // hard: the critical one is always upstairs
    if (!cand.length) return null;                                        // nobody upstairs to make critical: try another layout
    const c = pick(cand), walk = dist[c.f][c.y * COLS + c.x];
    c.ent.crit = Math.max(D.criticalMin, Math.round((D.criticalBase + walk * D.criticalPerTile + c.f * D.criticalPerFloor) * D.timerMult / 5) * 5);   // a longer walk and more stairs buy more time
  }
  const nearClient = (f, xx, yy) => cls.some(c => c.f === f && Math.abs(xx - c.x) + Math.abs(yy - c.y) <= 1);
  const nearStairs = (g, xx, yy) => { for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const c = g[yy + dy][xx + dx]; if (c === 'U' || c === 'V') return true; } return false; };

  // --- 6b. security cameras in some room corners, and on floors that have them maybe one security room ---
  for (const F of floors) { F.cameras = []; F.reserved = new Set(); F.security = null; }
  const clientRoom = (f, r) => cls.some(c => c.f === f && c.x >= r.x && c.x < r.x + r.w && c.y >= r.y && c.y < r.y + r.h);
  const camMap = D.cameraMapChance === undefined || Math.random() < D.cameraMapChance;   // some difficulties roll first whether this building has cameras at all
  floors.forEach((F, f) => {
    if (!D.cameraChance || !camMap) return;
    for (const r of F.rooms) {
      if (Math.random() >= D.cameraChance) continue;
      const corners = shuffle([[r.x, r.y, Math.PI / 4], [r.x + r.w - 1, r.y, Math.PI * 3 / 4], [r.x, r.y + r.h - 1, -Math.PI / 4], [r.x + r.w - 1, r.y + r.h - 1, -Math.PI * 3 / 4]]);
      for (const [cx, cy, a] of corners) {
        if (F.g[cy][cx] !== '.' || nearStairs(F.g, cx, cy) || nearClient(f, cx, cy)) continue;
        if ([[-1, 0], [1, 0], [0, -1], [0, 1]].some(([dx, dy]) => F.g[cy + dy][cx + dx] === 'D')) continue;   // not right beside a doorway
        F.cameras.push({ x: cx, y: cy, a }); F.reserved.add(cy * COLS + cx);
        break;
      }
    }
  });
  // One server room for the whole building (if any), on a random floor that has cameras. Its laptop shuts off every camera in the building.
  if (D.securityChance && Math.random() < D.securityChance) {
    for (const f of shuffle(floors.map((F, k) => k).filter(k => floors[k].cameras.length))) {
      const F = floors[f];
      // The server room: a small room walled off in one corner of a bigger room, one door, racks of servers along
      // the back wall, and the guard at his laptop. Interior SW x SH tiles.
      const SW = 6, SH = 4;
      const tryCarve = (r, right, bottom) => {
        const ix = right ? r.x + r.w - SW : r.x, iy = bottom ? r.y + r.h - SH : r.y;
        const sideX = right ? ix - 1 : ix + SW, frontY = bottom ? iy - 1 : iy + SH;
        const backY = bottom ? iy + SH : iy - 1, outerX = right ? ix + SW : ix - 1;     // the bigger room's own walls around this corner
        const walls = [];
        for (let y = Math.min(iy, frontY); y <= Math.max(iy + SH - 1, frontY); y++) walls.push([sideX, y]);
        for (let x = ix; x < ix + SW; x++) walls.push([x, frontY]);
        const doorX = right ? ix + SW - 3 : ix + 1;                 // a 2-wide door in the front wall
        const door = [[doorX, frontY], [doorX + 1, frontY]];
        const outside = door.map(([x, y]) => [x, y + (bottom ? -1 : 1)]);
        const inside = [];
        for (let y = iy; y < iy + SH; y++) for (let x = ix; x < ix + SW; x++) inside.push([x, y]);
        const free = ([x, y]) => F.g[y][x] === '.' && !nearStairs(F.g, x, y) && !nearClient(f, x, y) && !F.reserved.has(y * COLS + x);
        if (![...inside, ...walls, ...outside].every(free)) return false;
        for (let x = ix - 1; x <= ix + SW; x++) if (F.g[backY][x] === 'D') return false;          // no doors into it but its own
        for (let y = iy - 1; y <= iy + SH; y++) if (F.g[y][outerX] === 'D') return false;
        for (const [x, y] of walls) { F.g[y][x] = '#'; F.fl[y][x] = '.'; }
        for (const [x, y] of door) { F.g[y][x] = 'D'; F.fl[y][x] = 'D'; }
        for (const [x, y] of inside) { F.fl[y][x] = 's'; F.reserved.add(y * COLS + x); }
        for (const [x, y] of outside) F.reserved.add(y * COLS + x);
        // racks along the back wall, one more in the far front corner; the desk in the row in front of the racks
        const back = bottom ? iy + SH - 1 : iy, mid = bottom ? iy + SH - 2 : iy + 1, chairY = bottom ? iy + SH - 3 : iy + 2;
        F.servers = [];
        for (let x = ix; x < ix + SW; x++) { F.g[back][x] = 'o'; F.servers.push({ x, y: back }); }
        const deskX = right ? ix + 1 : ix + SW - 3;                  // the desk sits away from the door side
        const cornerX = right ? ix + SW - 1 : ix;
        F.g[mid][cornerX] = 'o'; F.servers.push({ x: cornerX, y: mid });
        F.g[mid][deskX] = 'o'; F.g[mid][deskX + 1] = 'o';
        F.security = { x: deskX, y: mid, flip: bottom };
        F.ents.push({ t: 'Q', x: deskX, y: chairY, w: 'pistol', face: bottom ? 1 : -1 });
        F.rooms.unshift({ x: ix, y: iy, w: SW, h: SH, style: 's', accent: '#39ff88', server: true,
                          lights: [{ x: (ix + SW / 2) * TILE, y: (iy + SH / 2) * TILE, r: 52 }] });   // listed first, so it wins the room lookup
        return true;
      };
      for (const r of shuffle(F.rooms.filter(r => r.style !== 'g' && r.w >= SW + 4 && r.h >= SH + 4 && !clientRoom(f, r)))) {
        const corners = shuffle([[false, false], [true, false], [false, true], [true, true]]);
        if (corners.some(([rt, bt]) => tryCarve(r, rt, bt))) break;
      }
      if (F.security) break;
    }
  }
  if ((D.alwaysCameras || (camMap && D.cameraMapChance)) && !floors.some(F => F.cameras.length)) return null;   // meant to have cameras but none rolled: try another layout
  if (floors.some(F => F.cameras.length)) for (const c of cls) if (c.ent.crit) c.ent.crit += D.criticalCameraBonus;   // cameras slow you down: more time on the clock

  floors.forEach((F, f) => {
    // --- 7. furniture. Never on the outer ring of a room, so doors can never be blocked; never beside stairs or a client. ---
    const fits = (x0, y0, w, h, r) => {
      if (x0 < r.x + 1 || y0 < r.y + 1 || x0 + w > r.x + r.w - 1 || y0 + h > r.y + r.h - 1) return false;
      for (let yy = y0; yy < y0 + h; yy++) for (let xx = x0; xx < x0 + w; xx++) {
        if (F.g[yy][xx] !== '.' || nearClient(f, xx, yy) || nearStairs(F.g, xx, yy) || F.reserved.has(yy * COLS + xx)) return false;
      }
      return true;
    };
    for (const r of F.rooms) {
      if (r.server) continue;                              // the server room is already furnished
      if (r.style === 'g') {                               // garage: a car or two and some explosive barrels, on top of the usual racks
        for (let n = r.w >= 10 && r.h >= 7 ? randInt(1, 2) : 1; n > 0; n--) {
          for (let tries = 0; tries < 40; tries++) {
            const horiz = Math.random() < 0.5, w = horiz ? 4 : 2, h = horiz ? 2 : 4;
            const x0 = randInt(r.x + 1, r.x + r.w - 1 - w), y0 = randInt(r.y + 1, r.y + r.h - 1 - h);
            if (!fits(x0 - 1, y0 - 1, w + 2, h + 2, { x: r.x - 1, y: r.y - 1, w: r.w + 2, h: r.h + 2 })) continue;   // room to walk round it
            for (let yy = y0; yy < y0 + h; yy++) for (let xx = x0; xx < x0 + w; xx++) F.g[yy][xx] = 'o';
            F.cars.push({ x: x0, y: y0, w, h, flip: Math.random() < 0.5, color: pick(['#c4124b', '#2a7fd0', '#e0b83a', '#1fae8a', '#7a3ad0', '#d8dce6']) });
            break;
          }
        }
        for (let n = randInt(1, 4); n > 0; n--) {
          for (let tries = 0; tries < 30; tries++) {
            const x0 = randInt(r.x + 1, r.x + r.w - 2), y0 = randInt(r.y + 1, r.y + r.h - 2);
            if (!fits(x0, y0, 1, 1, r)) continue;
            F.g[y0][x0] = 'o'; F.barrels.push({ x: x0, y: y0 });
            break;
          }
        }
      }
      for (let n = r.style === 'g' ? randInt(0, 2) : randInt(1, 3); n > 0; n--) {
        const [fw, fh] = pick([[2, 1], [1, 2], [2, 2], [3, 1], [1, 3]]);
        const fx = randInt(r.x + 1, r.x + r.w - 1 - fw), fy = randInt(r.y + 1, r.y + r.h - 1 - fh);
        for (let yy = fy; yy < fy + fh; yy++) for (let xx = fx; xx < fx + fw; xx++) {
          if (F.g[yy][xx] === '.' && !nearClient(f, xx, yy) && !nearStairs(F.g, xx, yy) && !F.reserved.has(yy * COLS + xx)) F.g[yy][xx] = 'o';
        }
      }
    }
    // --- 8. enemies: 1 to 3 per room, on random free tiles (wave mode starts empty: they come later) ---
    if (!D.waves) for (const r of F.rooms) {
      if (r.server) continue;                              // only the guard in there
      const free = [];
      for (let yy = r.y; yy < r.y + r.h; yy++) for (let xx = r.x; xx < r.x + r.w; xx++) {
        if (F.g[yy][xx] === '.' && !nearClient(f, xx, yy) && !nearStairs(F.g, xx, yy) && !F.reserved.has(yy * COLS + xx)) free.push([xx, yy]);
      }
      shuffle(free);
      const count = Math.max(1, Math.min(3, pick(D.enemiesPerRoom)));
      for (let i = 0; i < count && i < free.length; i++) {
        F.ents.push({ t: Math.random() < D.droneChance ? 'Y' : Math.random() < D.shieldChance ? 'R' : Math.random() < D.hackerChance ? 'N' : Math.random() < D.heavyChance ? 'H' : 'E', x: free[i][0], y: free[i][1], w: rollEnemyWeapon() });
      }
    }
  });

  // --- 8b. hard maps: maybe turn a grunt or heavy into a boss, never in a room with a client ---
  if (D.bossChance && Math.random() < D.bossChance) {
    const pool = [];
    floors.forEach((F, f) => F.ents.forEach(en => {
      if ((en.t === 'E' || en.t === 'H') && !cls.some(c => c.f === f && roomIndex(F, c.x, c.y) === roomIndex(F, en.x, en.y))) pool.push(en);
    }));
    shuffle(pool);
    const want = Math.random() < D.secondBossChance ? 2 : 1;
    for (let i = 0; i < want && i < pool.length; i++) pool[i].boss = 1;
  }

  // --- 9. safety net: everything must be reachable on foot from the start ---
  dist = floodFloors(floors.map(F => F.g), start.x, start.y);
  for (let f = 0; f < nFloors; f++) for (const e of floors[f].ents) if (dist[f][e.y * COLS + e.x] < 0) return null;

  return { floors: floors.map(F => ({ rows: F.g.map(r => r.join('')), floor: F.fl.map(r => r.join('')), ents: F.ents, rooms: F.rooms, cars: F.cars, barrels: F.barrels,
                                       cameras: F.cameras, security: F.security, servers: F.servers || [] })) };
}

/** One save slot. A new map overwrites the old one. */
function saveLevel() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ num: levelNum, level })); } catch (err) { /* storage unavailable: fine */ }
}
function loadSavedLevel() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    const lv = d && d.level;
    const okFloor = F => F && Array.isArray(F.rows) && F.rows.length === ROWS && F.rows.every(r => r.length === COLS) &&
                         Array.isArray(F.floor) && F.floor.length === ROWS && Array.isArray(F.ents) && Array.isArray(F.rooms);
    if (lv && Array.isArray(lv.floors) && lv.floors.length >= 1 && lv.floors.length <= 3 && lv.floors.every(okFloor) &&
        lv.floors[0].ents.some(e => e.t === 'P') && (lv.diff === 'waves' || lv.floors.some(F => F.ents.some(e => e.t === 'C')))) {
      level = lv; levelNum = d.num || 1;
      return true;
    }
  } catch (err) { /* nothing saved, or unreadable */ }
  return false;
}
function newLevel(diff) {
  mapAttempts = 0;
  level = generateLevel(diff);
  levelNum++;
  saveLevel();
  paintStaticLayers();
}

/* =====================================================================
   3. SMALL HELPERS
   ===================================================================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const turnToward = (cur, target, maxStep) => cur + clamp(angDiff(target, cur), -maxStep, maxStep);
const tileOf = v => Math.floor(v / TILE);
const fmtTime = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

/* =====================================================================
   4. DOM + CANVASES
   ===================================================================== */
const stage = document.getElementById('stage');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const overlay = document.getElementById('overlay');
const oTitle = document.getElementById('o-title');
const oBody = document.getElementById('o-body');
const oHint = document.getElementById('o-hint');
const oChoices = document.getElementById('o-choices');
let pickingDiff = false;              // true while the win screen is asking how hard the next map should be
const bindsEl = document.getElementById('binds');
const cyberEl = document.getElementById('cyber');
const pauseEl = document.getElementById('pause');
let pauseOpen = false;                // the Esc menu: pauses the game, holds the volume sliders
let cyberOpen = false;
let gunPick = null;                   // which weapon slot's chart is open on the Guns tab, or null
let cyberTab = 'cyber';               // which tab of that menu is showing: 'cyber' or 'guns'                // the cyberware menu also pauses the game
let bindsOpen = false;                // the controls panel (key 8) pauses the game while open

function makeLayer() {
  const c = document.createElement('canvas');
  c.width = WORLD_W; c.height = WORLD_H;
  return c;
}
// Every floor gets its own set of layers: static floors, static walls, neon light, and blood decals.
let layerSets = [];
let floorLayer, wallLayer, lightLayer, decalLayer, shapeLayer, decals;      // the set for the floor you are on
function ensureLayerSets(n) {
  while (layerSets.length < n) layerSets.push({ floor: makeLayer(), wall: makeLayer(), light: makeLayer(), decal: makeLayer(), shape: makeLayer() });
}
/* ---------- line of sight ----------
   You only see what you have a clear line to. Everything else is covered by the floor's "shape" layer:
   bare walls and empty floor, so you can read the layout of the next room but not what is in it. */
let visible = new Uint8Array(COLS * ROWS);            // 1 = you can see this tile right now
const fogMask = document.createElement('canvas');     // one pixel per tile: opaque where visible
fogMask.width = COLS; fogMask.height = ROWS;
const fogMaskCtx = fogMask.getContext('2d');
const fogImg = fogMaskCtx.createImageData(COLS, ROWS);
const fogLayer = makeLayer(), fogCtx = fogLayer.getContext('2d');
const SIGHT_RAYS = 540;                               // rays cast around you each frame; more = finer edges

/** Casts rays out from the player. A ray lights every tile it crosses and stops at a wall or a shut door.
    Furniture does not block your view, only theirs. */
function updateVisibility() {
  if (!CFG.lineOfSight) { visible.fill(1); return; }      // switched off: everything counts as seen
  visible.fill(0);
  if (!player || !tiles.length) return;
  for (let i = 0; i < SIGHT_RAYS; i++) {
    const a = i / SIGHT_RAYS * Math.PI * 2, dx = Math.cos(a) * 4, dy = Math.sin(a) * 4;
    let x = player.x, y = player.y;
    for (let s = 0; s < 240; s++) {
      const tx = tileOf(x), ty = tileOf(y);
      if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) break;
      visible[ty * COLS + tx] = 1;
      const t = tiles[ty][tx];
      if (t === '#' || (t === 'D' && !doorOpen[ty * COLS + tx])) break;      // the wall or door itself is seen, nothing past it
      x += dx; y += dy;
    }
  }
  const d = fogImg.data;
  for (let i = 0; i < COLS * ROWS; i++) d[i * 4 + 3] = visible[i] ? 255 : 0;
  fogMaskCtx.putImageData(fogImg, 0, 0);
}

/** Can you see the tile under this world position right now? */
function isVisible(x, y) {
  const tx = tileOf(x), ty = tileOf(y);
  return tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS && visible[ty * COLS + tx] === 1;
}

/** Covers everything you cannot see with the shape layer. The mask is scaled up smoothly, so the edge is soft. */
function drawFog() {
  if (!CFG.lineOfSight) return;
  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.drawImage(shapeLayer, 0, 0);
  fogCtx.globalCompositeOperation = 'destination-out';
  fogCtx.imageSmoothingEnabled = true;
  fogCtx.drawImage(fogMask, 0, 0, WORLD_W, WORLD_H);
  ctx.drawImage(fogLayer, 0, 0);
}

function useLayerSet(i) {
  const s = layerSets[i];
  floorLayer = s.floor; wallLayer = s.wall; lightLayer = s.light; decalLayer = s.decal; shapeLayer = s.shape;
  decals = decalLayer.getContext('2d');
}

function fitStage() {
  const availW = document.documentElement.clientWidth;
  const availH = document.body.clientHeight;
  const scale = Math.max(0.5, Math.min(availW / W, availH / H));
  stage.style.width = Math.floor(W * scale) + 'px';
  stage.style.height = Math.floor(H * scale) + 'px';
  stage.style.fontSize = (8 * scale) + 'px';
}
window.addEventListener('resize', fitStage);
fitStage();

/* =====================================================================
   5. WORLD STATE
   ===================================================================== */
let tiles = [];                       // tiles[y][x] = one char per tile, for the floor you are on
let doorOpen = new Uint8Array(COLS * ROWS);
let doors = [];                       // {x, y, vertical}
let player, client, evac;             // client = the one you are carrying, otherwise the nearest one still inside
let clients = [], backupCalled = false;
let wave = { n: 0, started: false, rest: 0, best: 0 };   // wave mode progress
let bestWave = 0;                     // most waves ever cleared, kept between visits
try { bestWave = +localStorage.getItem('flatline.bestWave') || 0; } catch (err) { /* fine */ }
let floorStates = [], floorIdx = 0;   // one state per floor (tiles, doors, enemies, pickups, stairs); floorIdx = where you are
let stairLock = false, floorFlash = 0;
let enemies = [], bullets = [], particles = [], spawns = [];
let pickups = [], grenades = [], blasts = [], ghosts = [], beams = [];
let lights = [];                      // short-lived dynamic lights: muzzle flashes, explosions, sparks
const GHOST_GAP = 14;                 // px you travel between Sandevistan afterimages
const GHOST_LIFE = 0.9;              // seconds a Sandevistan afterimage lasts
let state = 'title';                  // title | play | dead | win
let time = 0, missionTime = 0, kills = 0;
let shake = 0, hurt = 0, sway = 0, glitchT = 0, nextGlitch = 6;
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let banner = { text: '', t: 0 };
const cam = { x: 0, y: 0 };

/** Builds the live state of every floor from the level data and puts you on the ground floor. */
function buildWorld() {
  bullets = []; particles = []; spawns = [];
  grenades = []; blasts = []; ghosts = []; beams = []; clients = []; backupCalled = false;
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;

  floorStates = level.floors.map((F, f) => {
    const st = { tiles: F.rows.map(r => r.split('')), doors: [], doorOpen: new Uint8Array(COLS * ROWS), enemies: [], pickups: [], stairs: [], bodies: [],
                 doorBy: new Uint8Array(COLS * ROWS),   // who opened each door tile: 0 nobody, 1 an enemy, 2 you
                 weapons: [], knives: [], incoming: [], barrels: (F.barrels || []).map(b => ({ x: b.x, y: b.y, alive: true })),
                 // cameras hang in the corner of their tile, looking out into the room
                 cameras: (F.cameras || []).map(c => ({ x: c.x * TILE + TILE / 2 - Math.cos(c.a) * 3.5, y: c.y * TILE + TILE / 2 - Math.sin(c.a) * 3.5, base: c.a, angle: c.a,
                                                        t: rand(0, 10), alive: true, off: false, seeT: 0, cd: 0, sees: false })),
                 security: F.security ? { x: F.security.x * TILE + TILE / 2, y: F.security.y * TILE + TILE / 2, flip: !!F.security.flip, hacked: false, lockT: 0 } : null };
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const ch = st.tiles[y][x];
      if (ch === 'X') { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
      if (ch === 'U' || ch === 'V') st.stairs.push({ x, y, up: ch === 'U' });
      if (ch === 'D') {
        const l = st.tiles[y][x - 1] || '#', r = st.tiles[y][x + 1] || '#';
        st.doors.push({ x, y, vertical: l !== '#' && l !== 'D' && r !== '#' && r !== 'D' });
      }
    }
    for (const en of F.ents) {
      const cx = en.x * TILE + TILE / 2, cy = en.y * TILE + TILE / 2;
      if (en.t === 'P') player = makePlayer(cx, cy);
      else if (en.t === 'C') clients.push({ x: cx, y: cy, f, stabilized: false, carried: false, extracted: false, progress: 0, crit: en.crit || 0, timeLeft: en.crit || 0 });
      else if (en.t === 'E' || en.t === 'H') {
        const e = makeEnemy(en.t === 'H' ? 'heavy' : 'grunt', cx, cy, en.w);
        if (en.boss) makeBoss(e);                         // a hard-map boss: same as the wave-mode ones
        st.enemies.push(e);
      }
      else if (en.t === 'R') st.enemies.push(makeEnemy('shield', cx, cy));
      else if (en.t === 'N') st.enemies.push(makeEnemy('hacker', cx, cy, en.w));
      else if (en.t === 'Y') st.enemies.push(makeEnemy('drone', cx, cy, 'pistol'));
      else if (en.t === 'Q') {                               // the security guard, sat at his laptop
        const e = makeEnemy('grunt', cx, cy, 'pistol');
        e.seated = true; e.guard = true; e.seatAngle = (en.face || -1) * Math.PI / 2; e.angle = e.seatAngle;
        st.enemies.push(e);
      }
      else if (en.t === 'S') spawns.push({ x: cx, y: cy });
    }
    return st;
  });
  evac = { x: x0 * TILE, y: y0 * TILE, w: (x1 - x0 + 1) * TILE, h: (y1 - y0 + 1) * TILE };
  floorIdx = -1; stairLock = false; floorFlash = 0;
  loadFloor(0);
  // wave mode has nobody to rescue: a stand-in that counts as already out keeps all the client code quiet
  if (!clients.length) clients.push({ x: 0, y: 0, f: -1, stabilized: true, carried: false, extracted: true, progress: 0, crit: 0, timeLeft: 0 });
  if (!diffOf(level).criticalChance) for (const c of clients) { c.crit = 0; c.timeLeft = 0; }   // difficulties without critical clients never get one, even on a map saved before that rule
  client = clients[0];
  wave = { n: 0, started: false, rest: 0, best: 0 };
}

/** Makes floor i the live one. Only the floor you are on is simulated; the others wait exactly as you left them. */
function loadFloor(i) {
  if (floorIdx >= 0) { floorStates[floorIdx].enemies = enemies; floorStates[floorIdx].pickups = pickups; }
  floorIdx = i;
  const st = floorStates[i];
  tiles = st.tiles; doors = st.doors; doorOpen = st.doorOpen; enemies = st.enemies; pickups = st.pickups;
  noGo = st.noGo || (st.noGo = buildNoGo(i));
  useLayerSet(i);
}

/** The staircase you are standing on or next to, if any. */
/** The dropped weapon you are standing over, if any (only with random guns, and not while carrying a client or beside one). */
function weaponNear() {
  if (!player || !player.finite || !floorStates[floorIdx] || client.carried) return null;
  if (client.f === floorIdx && !client.extracted && Math.hypot(client.x - player.x, client.y - player.y) < CFG.interactRange) return null;
  let best = null, bd = 16;
  for (const d of floorStates[floorIdx].weapons) { const k = Math.hypot(d.x - player.x, d.y - player.y); if (k < bd) { bd = k; best = d; } }
  return best;
}

/** Picks up a dropped weapon. Already carrying that gun: you just take its ammo. Otherwise it swaps with the one in your hands,
    which is left on the floor with whatever ammo it still had. */
function takeWeapon(d) {
  const p = player, list = floorStates[floorIdx].weapons, w = WEAPONS[d.id];
  list.splice(list.indexOf(d), 1);
  if (loadout.includes(d.id)) {
    // same gun you already carry: you only strip its loose ammo. A gun you dropped yourself gives back what it had.
    const got = w.melee ? 0 : d.mine ? d.ammo + d.reserve : w.mag * randInt(...AMMO_ONLY_MAGS);
    p.reserve[d.id] += got;
    say(w.melee ? 'Already have ' + w.name : '+' + got + ' ' + w.name + ' ammo', 1.5);
    Sound.reload(); return;
  }
  // a new gun off the dead: full magazine plus a full set of spares (one you dropped yourself keeps what it had)
  let slot = loadout.indexOf(p.weapon); if (slot < 0) slot = 0;
  const old = loadout[slot];
  list.push({ x: p.x + rand(-5, 5), y: p.y + rand(-5, 5), id: old, angle: rand(0, Math.PI * 2), ammo: p.ammo[old], reserve: p.reserve[old], mine: true });
  loadout[slot] = d.id; p.ammo[d.id] = d.ammo; p.reserve[d.id] = d.reserve;
  p.weapon = d.id; p.reloadTimer = 0; p.charge = 0; p.fireTimer = Math.max(p.fireTimer, 0.2);
  say('Took the ' + w.name, 1.5); Sound.reload();
}

function stairNear() {
  if (!player || !floorStates[floorIdx]) return null;
  return floorStates[floorIdx].stairs.find(st => Math.hypot(st.x * TILE + TILE / 2 - player.x, st.y * TILE + TILE / 2 - player.y) < 15) || null;
}

/** Takes the stairs: dir is +1 (up) or -1 (down). You arrive on the matching staircase, same spot. */
/** Backup that arrived while you were upstairs has had time to spread out: along the street (middle or far side,
    never on the evac zone) and inside the building's street entrances. Never right where you come down the stairs. */
function placeStakeout(arriveX, arriveY) {
  const spots = [];
  const ecx = tileOf(evac.x + evac.w / 2), ecy = tileOf(evac.y + evac.h / 2);
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    const t = tileAt(tx, ty);
    if (t !== '.' && t !== 'X') continue;
    if (noGo[ty * COLS + tx]) continue;                    // and never in the server room
    if (Math.abs(tx - ecx) < EVAC_CLEAR) continue;         // never waiting on top of the evac zone
    const onStreet = ty > STREET_TOP;
    const nearDoor = ty === STREET_TOP - 2 && (tileAt(tx, STREET_TOP - 1) === 'D' || tileAt(tx - 1, STREET_TOP - 1) === 'D' || tileAt(tx + 1, STREET_TOP - 1) === 'D');
    if (!onStreet && !nearDoor) continue;
    const x = tx * TILE + TILE / 2, y = ty * TILE + TILE / 2;
    if (Math.hypot(x - arriveX, y - arriveY) < 7 * TILE) continue;       // keep it fair: nobody waiting at the foot of the stairs
    spots.push({ x, y });
  }
  for (const e of enemies) {
    if (!e.stakeout || missionTime - e.born < AI.hunter.travel) continue;
    e.stakeout = false;
    if (!spots.length) continue;
    const s = spots.splice(randInt(0, spots.length - 1), 1)[0];
    e.x = s.x; e.y = s.y; startSearch(e, s.x, s.y, rand(2, 4));
    e.angle = Math.atan2(arriveY - e.y, arriveX - e.x) + rand(-1, 1);
  }
}

/** Enemies who are on to you follow you up or down the stairs. They take as long to arrive as the walk to the staircase. */
function sendFollowers(toFloor) {
  const st = stairNear(); if (!st) return;
  const sx = st.x * TILE + TILE / 2, sy = st.y * TILE + TILE / 2;
  const followers = enemies.filter(e => !e.dead && e.state === 'chase' && e.lostTimer < 5 && Math.hypot(e.x - sx, e.y - sy) < 20 * TILE);
  if (!followers.length) return;
  enemies = enemies.filter(e => !followers.includes(e));
  for (const e of followers) {
    const delay = Math.hypot(e.x - sx, e.y - sy) / Math.max(30, e.cfg.chaseSpeed) * 1.15 + 0.6;
    floorStates[toFloor].incoming.push({ e, t: missionTime + delay, x: sx, y: sy });
  }
}

/** Followers whose walk is done step off the staircase onto the floor you are on, still after you. */
function arriveFollowers() {
  const inc = floorStates[floorIdx].incoming;
  for (let i = inc.length - 1; i >= 0; i--) {
    const a = inc[i]; if (a.t > missionTime) continue;
    inc.splice(i, 1);
    const e = a.e;
    e.x = a.x + rand(-4, 4); e.y = a.y + rand(-4, 4); e.path = null; e.pathTimer = 0; e.lostTimer = 0;
    e.state = 'chase'; e.lastX = player.x; e.lastY = player.y; e.alertT = 0.7; e.cover = false;
    enemies.push(e);
  }
}

function changeFloor(dir) {
  sendFollowers(floorIdx + dir);
  loadFloor(floorIdx + dir);
  if (floorIdx === 0) placeStakeout(player.x, player.y);
  bullets = []; grenades = []; blasts = []; particles = []; ghosts = []; beams = []; lights = [];
  for (const c of clients) if (c.carried) c.f = floorIdx;
  stairLock = true;                       // do not bounce straight back: step off the stairs first
  floorFlash = 0.3;
  say('Floor ' + (floorIdx + 1) + ' of ' + floorStates.length, 2);
  Sound.door();
}

function makePlayer(x, y) {
  return { x, y, r: CFG.player.radius, hp: CFG.player.hp, angle: -Math.PI / 2, dead: false,
           fireTimer: 0, muzzle: 0, flash: 0,
           weapon: loadout[CFG.player.startSlot - 1], reloadTimer: 0, medkits: 0, grenadeCooldown: 0,
           prevWeapon: loadout[CFG.player.startSlot - 1],
           sandy: 0, ghostTimer: 0, ghostHue: 120, slash: 0, jam: 0, charge: 0, fireNow: false, smart: 0, camo: 0, burn: 0, burnTick: 0, blind: 0, ohLeft: 0, ohWindow: 0, cyberCd: Object.fromEntries(Object.keys(CYBERWARE).map(k => [k, 0])),
           ammo: Object.fromEntries(Object.keys(WEAPONS).map(k => [k, WEAPONS[k].mag])),
           // random guns means limited ammo: spare rounds per gun (reloads draw on these). Otherwise ammo never runs out.
           finite: !!diffOf(level).finiteAmmo, swapT: 0,
           reserve: Object.fromEntries(Object.keys(WEAPONS).map(k => [k, WEAPONS[k].thrown ? 0 : WEAPONS[k].mag * randInt(...SPARE_MAGS)])) };   // knives: no spares, pick them up
}

function makeEnemy(type, x, y, weapon) {
  const c = CFG.enemy[type];
  if (type === 'shield') weapon = rollShieldWeapon();       // riot shields: pistol, AR, SMG or a katana (no cyberware). Net hackers carry anything.
  if (type === 'drone') weapon = 'pistol';                 // drones carry nothing; this only gives them a gun's range numbers
  if (!ENEMY_WEAPONS[weapon]) weapon = rollEnemyWeapon();          // backup (and old saves) roll one on the spot
  const base = LOOKS[type];
  // every enemy gets its own jacket color and hair color
  const look = { ...base, body: base.bodies[randInt(0, base.bodies.length - 1)], hair: HAIR[randInt(0, HAIR.length - 1)] };
  return { type, cfg: c, weapon, look, x, y, r: c.radius, hp: c.hp, angle: rand(0, Math.PI * 2),
           homeX: x, homeY: y, state: 'patrol', path: null, wait: rand(0, 2),
           fireTimer: rand(0.2, 0.6), burstLeft: ENEMY_WEAPONS[weapon].burst, reaction: c.reaction,
           lastX: x, lastY: y, lostTimer: 0, pathTimer: 0, searchTimer: 0,
           strafeDir: Math.random() < 0.5 ? -1 : 1, strafeTimer: 1,
           flash: 0, alertT: 0, muzzle: 0, burn: 0, burnDps: 0, cook: 0, blind: 0,
           windup: 0, swing: 0, walk: 0, blocking: type === 'shield', phase: c.phase || 0, hack: 0, hackCd: rand(1, 3),
           hackType: Math.random() < 0.5 ? 'jam' : 'optics',     // net hackers: half jam your guns, half reboot your optics
           wary: false, wonderT: 0, cover: false, coverT: 0, seenBodies: new Set(), seenClues: new Set() };
}

/* ---------- tile queries ---------- */
function tileAt(tx, ty) { return (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) ? '#' : tiles[ty][tx]; }
function isSolid(tx, ty) { const t = tileAt(tx, ty); return t === '#' || t === 'o'; }
function isClosedDoor(tx, ty) { return tileAt(tx, ty) === 'D' && !doorOpen[ty * COLS + tx]; }
function blocksSight(tx, ty) { return isSolid(tx, ty) || isClosedDoor(tx, ty); }

/* Enemies do not wander into the server room on their own: patrolling, roaming and searching all stay outside it.
   One that is alerted (chasing you) can go in to fight, but only through a door that is already open: no enemy
   opens the server room door except the guard, who can always come and go.
   noGo marks its floor and door tiles on the live floor. pathGuard is set while an enemy allowed in is thinking. */
let noGo = new Uint8Array(COLS * ROWS), pathGuard = false;
function buildNoGo(f) {
  const ng = new Uint8Array(COLS * ROWS), lv = level.floors[f], rows = lv.rows;
  for (const r of lv.rooms || []) {
    if (!r.server) continue;
    for (let y = r.y - 1; y <= r.y + r.h; y++) for (let x = r.x - 1; x <= r.x + r.w; x++) {
      const inside = x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;
      if (inside || rows[y][x] === 'D') ng[y * COLS + x] = 1;      // its floor and its door
      if (rows[y][x] === 'D') (ng.doors || (ng.doors = [])).push(y * COLS + x);
    }
  }
  return ng;
}
/** True once the server room door is open (or broken). Only then can an alerted enemy follow you in. */
function serverDoorOpen() {
  return !!(noGo.doors && noGo.doors.some(i => doorOpen[i]));
}
function boxHitsNoGo(x, y, r) {
  const x0 = tileOf(x - r), x1 = tileOf(x + r), y0 = tileOf(y - r), y1 = tileOf(y + r);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS && noGo[ty * COLS + tx]) return true;
  return false;
}

function boxHitsSolid(x, y, r) {
  const x0 = tileOf(x - r), x1 = tileOf(x + r), y0 = tileOf(y - r), y1 = tileOf(y + r);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolid(tx, ty)) return true;
  return false;
}

/** Move with wall sliding: each axis is tried separately. Also pushes doors open. */
function moveEntity(e, dx, dy) {
  // kept out of the server room: any enemy not chasing you, or chasing while its door is still shut. The guard and anyone already inside are free.
  const fenced = e !== player && !e.guard && !(e.state === 'chase' && serverDoorOpen()) && !boxHitsNoGo(e.x, e.y, e.r);
  e.x += dx; if (boxHitsSolid(e.x, e.y, e.r) || (fenced && boxHitsNoGo(e.x, e.y, e.r))) e.x -= dx;
  e.y += dy; if (boxHitsSolid(e.x, e.y, e.r) || (fenced && boxHitsNoGo(e.x, e.y, e.r))) e.y -= dy;
  const x0 = tileOf(e.x - e.r), x1 = tileOf(e.x + e.r), y0 = tileOf(e.y - e.r), y1 = tileOf(e.y + e.r);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isClosedDoor(tx, ty)) openDoor(tx, ty, e);
}

/** Opens a door tile and any door tiles joined to it (double doors). */
function openDoor(tx, ty, who) {
  const stack = [[tx, ty]], by = floorStates[floorIdx] && floorStates[floorIdx].doorBy;
  while (stack.length) {
    const [x, y] = stack.pop();
    if (!isClosedDoor(x, y)) continue;
    doorOpen[y * COLS + x] = 1;
    if (by) by[y * COLS + x] = who === player ? 2 : 1;
    for (const [dx, dy] of DIRS) stack.push([x + dx, y + dy]);
  }
  Sound.door();
}

/** Straight-line visibility between two world points. */
function hasLOS(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, steps = Math.ceil(Math.hypot(dx, dy) / 4);
  for (let i = 1; i < steps; i++) {
    if (blocksSight(tileOf(x0 + dx * i / steps), tileOf(y0 + dy * i / steps))) return false;
  }
  return true;
}

/** Breadth-first search on the tile grid. Returns a list of tiles to walk, or null. */
function findPath(sx, sy, tx, ty) {
  if (isSolid(tx, ty) || isSolid(sx, sy)) return null;
  const start = sy * COLS + sx, goal = ty * COLS + tx;
  if (start === goal) return [];
  const prev = new Int32Array(COLS * ROWS).fill(-1);
  const queue = [start]; prev[start] = start;
  for (let qi = 0; qi < queue.length; qi++) {
    const cur = queue[qi];
    if (cur === goal) break;
    const cx = cur % COLS, cy = (cur / COLS) | 0;
    for (const [dx, dy] of DIRS) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || isSolid(nx, ny)) continue;
      const ni = ny * COLS + nx;
      if (noGo[ni] && !pathGuard && !noGo[start]) continue;   // the server room is off the map for calm enemies (one already inside can leave)
      if (prev[ni] !== -1) continue;
      prev[ni] = cur; queue.push(ni);
    }
  }
  if (prev[goal] === -1) return null;
  const path = [];
  for (let c = goal; c !== start; c = prev[c]) path.push({ x: c % COLS, y: (c / COLS) | 0 });
  return path.reverse();
}

/* =====================================================================
   6. INPUT  -  every key can be rebound from the controls panel
   ===================================================================== */
// action -> default key (a KeyboardEvent.code). Add an action here, give it a row in
// renderBinds() and a case in the keydown switch, and it is rebindable for free.
const DEFAULT_BINDS = {
  up: 'KeyW', left: 'KeyA', down: 'KeyS', right: 'KeyD',
  reload: 'KeyR', slot1: 'Digit1', slot2: 'Digit2', slot3: 'Digit3',
  interact: 'KeyE', medkit: 'Digit4', grenade: 'KeyZ',
  cyber: 'KeyF', cyber2: 'KeyG', cyberMenu: 'KeyL', restart: 'Digit9', mute: 'KeyM', skipWave: 'Enter',   // controls and new map live in the Esc menu
};
const BINDS_KEY = 'flatline.binds.v2';
let BINDS = { ...DEFAULT_BINDS };
let bindNote = '';                    // one-line message shown in the controls panel after a rebind
let rebinding = null;                 // the action waiting for a new key, if any

function loadBinds() {
  try {
    const d = JSON.parse(localStorage.getItem(BINDS_KEY));
    if (d && d.shotgun && !d.slot1) { d.slot1 = d.shotgun; d.slot2 = d.ar; d.slot3 = d.smg; }   // older saves named the slots after guns
    if (d) for (const a in DEFAULT_BINDS) if (typeof d[a] === 'string') BINDS[a] = d[a];
    // two actions on one key would lock something out, so a broken save falls back to the defaults
    if (new Set(Object.values(BINDS)).size !== Object.keys(BINDS).length) BINDS = { ...DEFAULT_BINDS };
  } catch (err) { /* nothing saved */ }
}
function saveBinds() { try { localStorage.setItem(BINDS_KEY, JSON.stringify(BINDS)); } catch (err) { /* fine */ } }
function actionFor(code) { for (const a in BINDS) if (BINDS[a] === code) return a; return null; }

/** Short on-screen name for a key code: KeyW -> W, Digit8 -> 8, ShiftLeft -> LShift. */
function codeLabel(code) {
  if (!code) return '?';
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  if (code.startsWith('Numpad')) return 'Num' + code.slice(6);
  if (code.startsWith('Arrow')) return code.slice(5);
  const names = { ShiftLeft: 'LShift', ShiftRight: 'RShift', ControlLeft: 'LCtrl', ControlRight: 'RCtrl', AltLeft: 'LAlt', AltRight: 'RAlt',
                  CapsLock: 'Caps', Backquote: '`', Minus: '-', Equal: '=', Comma: ',', Period: '.', Slash: '/', Semicolon: ';',
                  Quote: "'", BracketLeft: '[', BracketRight: ']', Backslash: '\\', Backspace: 'Bksp' };
  return names[code] || code.slice(0, 6);
}
const kl = action => codeLabel(BINDS[action]);          // label of the key bound to an action

function finishRebind(code) {
  const action = rebinding; bindNote = '';
  rebinding = null;
  // Esc backs out without changing anything
  if (code !== 'Escape') {
    const other = actionFor(code);
    if (other && other !== action) {                       // key already taken: the two actions swap keys
      BINDS[other] = BINDS[action];
      bindNote = 'That key was in use, so the two swapped.';
    }
    BINDS[action] = code;
    saveBinds();
  }
  renderBinds();
}

const keys = new Set();
const held = action => keys.has(BINDS[action]);
let ePressed = false;                             // true for one frame after a fresh interact press
const mouse = { sx: W / 2, sy: H / 2, down: false };

window.addEventListener('keydown', e => {
  if (rebinding) { e.preventDefault(); if (!e.repeat) finishRebind(e.code); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;        // leave browser shortcuts alone
  if (pickingDiff && e.code === 'Escape') { e.preventDefault(); closePicker(); return; }
  if (pickingDiff && /^(Digit|Numpad)[1234]$/.test(e.code)) {      // choice in the new-map picker: always 1 to 4
    e.preventDefault(); chooseDifficulty(Object.keys(DIFFICULTY)[+e.code.slice(-1) - 1]); return;
  }
  if ((state === 'dead' || state === 'win') && !pauseOpen && !pickingDiff && (e.code === 'Digit0' || e.code === 'Numpad0')) {
    e.preventDefault(); nextMap(); return;                // after a death or a win, 0 goes straight to the new-map picker
  }
  const action = actionFor(e.code);
  if (action || ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);

  if (hackGame && state === 'play' && !pauseOpen) {        // the laptop hack has the keyboard
    if (e.code === 'Escape') { cancelHack('Hack cancelled'); return; }
    if (hackGame.type === 'rhythm') {
      e.preventDefault();
      const R = HACK.rhythm, lane = R.keys.indexOf(e.code) >= 0 ? R.keys.indexOf(e.code) : R.numpad.indexOf(e.code);
      if (lane >= 0) rhythmPress(lane);                    // only 1, 2 and 3 do anything here
    }
    if (action === 'mute') Sound.toggleMute();
    return;
  }

  if (e.code === 'Escape') {                             // Esc closes whatever is open, or opens the pause menu
    if (bindsOpen || cyberOpen) { toggleBinds(false); toggleCyber(false); }
    else if (pauseOpen || state !== 'title') togglePause();     // works mid-run and on the win and death screens
    return;
  }
  if (cyberOpen && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) { cyberTab = cyberTab === 'cyber' ? 'guns' : 'cyber'; gunPick = null; renderCyber(); return; }
  if (cyberOpen && cyberTab === 'cyber' && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) { cycleCyber(e.code === 'ArrowDown' ? 1 : -1); return; }
  // while a panel is open the game is paused, so only menu-type actions go through
  if ((bindsOpen || cyberOpen || pauseOpen) && !['controls', 'cyberMenu', 'restart', 'mute', 'nextMap'].includes(action)) return;
  if (pickingDiff && !['nextMap', 'restart', 'mute'].includes(action)) return;        // new-map picker open: game paused

  switch (action) {
    case 'restart': if (state !== 'win') startMission(); break;     // respawn on this map (not after a win: pick a new map then)
    case 'cyberMenu': toggleCyber(); break;
    case 'cyber': useCyber(); break;
    case 'cyber2':
      if (selectedCyber2) useCyber(selectedCyber2);
      else if (state === 'play') { Sound.click(); say('Nothing on this key. Pick a second cyberware at the evac zone', 2); }
      break;
    case 'reload': startReload(); break;
    case 'medkit': useMedkit(); break;
    case 'grenade': throwGrenade(); break;
    case 'slot1': case 'slot2': case 'slot3': switchWeapon(loadout[+action.slice(4) - 1]); break;
    case 'interact': ePressed = true; break;
    case 'mute': Sound.toggleMute(); break;
    case 'skipWave': skipWaveRest(); break;
  }
  if (bindsOpen) renderBinds();        // keep an open panel in sync
  if (cyberOpen) renderCyber();
});
window.addEventListener('keyup', e => keys.delete(e.code));
let hasFocus = true;                              // false while the keyboard is going somewhere other than the game
window.addEventListener('focus', () => { hasFocus = true; });
window.addEventListener('blur', () => { hasFocus = false; keys.clear(); mouse.down = false; });

window.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.sx = clamp((e.clientX - r.left) / r.width * W, 0, W);
  mouse.sy = clamp((e.clientY - r.top) / r.height * H, 0, H);
});
stage.addEventListener('mousedown', e => {
  // Take keyboard focus back on every click. If focus drifts to the page around the game or to another
  // window, the mouse still works but every key goes dead until the game is focused again.
  if (window.focus) window.focus();
  if (pickingDiff || pauseOpen) return;                  // clicks belong to the new-map picker or the pause menu
  if (bindsOpen || cyberOpen) {                          // clicks belong to the open panel
    if (rebinding && !e.target.closest('#binds')) { rebinding = null; renderBinds(); }   // clicking away cancels a rebind
    return;
  }
  if (state === 'title') { startMission(); return; }
  if (hackGame && state === 'play') { if (e.button === 0) hackClick(); return; }   // clicks pick codes in the hack
  if (e.button === 0) mouse.down = true;
});
window.addEventListener('mouseup', () => { mouse.down = false; });
stage.addEventListener('contextmenu', e => e.preventDefault());

/** Screen (canvas) coordinates to world coordinates, undoing camera and sway. */
function screenToWorld(sx, sy) {
  const x = sx - W / 2, y = sy - H / 2, c = Math.cos(-sway), s = Math.sin(-sway);
  return { x: x * c - y * s + cam.x, y: x * s + y * c + cam.y };
}
function worldToScreen(wx, wy) {
  const x = wx - cam.x, y = wy - cam.y, c = Math.cos(sway), s = Math.sin(sway);
  return { x: x * c - y * s + W / 2, y: x * s + y * c + H / 2 };
}

/* =====================================================================
   7. SOUND  -  tiny WebAudio synth, no assets. M toggles mute.
   ===================================================================== */
const Sound = {
  ctx: null, master: null, muted: false, noiseBuf: null, track: '',
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      const limiter = this.ctx.createDynamicsCompressor();          // keeps loud moments from crackling
      this.master.connect(limiter); limiter.connect(this.ctx.destination);
      this.sfx = this.ctx.createGain(); this.sfx.connect(this.master);            // effects and music each get their own volume
      this.musicBus = this.ctx.createGain(); this.musicBus.connect(this.master);
      this.applyVolume();
      const len = Math.floor(this.ctx.sampleRate * 1);
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.startMusic();
    } catch (err) { this.ctx = null; }
  },
  musicVol: 0.8, sfxVol: 0.8,           // 0 to 1, set from the pause menu and remembered
  applyVolume() {
    if (this.sfx) this.sfx.gain.value = this.sfxVol;
    if (this.musicBus) this.musicBus.gain.value = this.musicVol;
  },
  setVolume(kind, v) {
    this[kind] = clamp(v, 0, 1); this.applyVolume();
    try { localStorage.setItem('flatline.volume', JSON.stringify({ musicVol: this.musicVol, sfxVol: this.sfxVol })); } catch (err) { /* fine */ }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.22;
    if (pauseOpen) renderPause();
  },
  tone(freq, dur, type = 'square', vol = 0.3, slideTo = 0, at = 0) {
    if (!this.ctx) return;
    const t = at || this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.sfx || this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.3, at = 0) {
    if (!this.ctx) return;
    const t = at || this.ctx.currentTime;
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
    s.buffer = this.noiseBuf;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(g); g.connect(this.sfx || this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  /** Noise pushed through a filter whose cutoff sweeps from f0 to f1: the building block for cracks, thumps and tails. */
  fnoise(dur, vol, type, f0, f1, q = 0.8, at = 0) {
    if (!this.ctx) return;
    const t = at || this.ctx.currentTime;
    const s = this.ctx.createBufferSource(), fl = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noiseBuf; s.loop = true; s.playbackRate.value = 0.8 + Math.random() * 0.4;
    fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.sfx || this.master);
    s.start(t, Math.random() * 0.2); s.stop(t + dur + 0.02);
  },
  /** One gunshot, built in layers: a sharp crack, a filtered body that falls away, a low punch you feel,
      and a quick descending electric zap that makes it sound like a powered weapon. Slightly different every shot. */
  gunshot(o) {
    if (!this.ctx) return;
    const v = 0.94 + Math.random() * 0.12;                 // pitch varies a little so bursts do not sound like a machine
    this.fnoise(0.03, o.crack, 'highpass', 3200, 2200, 0.7);                         // crack
    this.fnoise(o.body, o.vol, 'lowpass', o.bright * v, 260, 1.1);                   // body
    this.tone(o.punch * v, o.body * 0.8, 'sine', o.vol * 0.9, 42);                   // punch
    this.tone(o.zap * v, o.zapLen, 'sawtooth', o.zapVol, o.zap * 0.12);              // tech zap
    if (o.tail) this.fnoise(o.tail, o.vol * 0.22, 'bandpass', 900, 300, 0.6, this.ctx.currentTime + 0.03);   // room tail
  },
  /** Railgun spin-up: a magnetic hum and a whine that climb in pitch, a stutter of electric crackle, all getting louder.
      Returns a function that cuts it off, for when the charge is cancelled. */
  railCharge(dur) {
    if (!this.ctx) return () => {};
    const c = this.ctx, t = c.currentTime, out = c.createGain(), nodes = [];
    out.gain.setValueAtTime(0.001, t); out.gain.exponentialRampToValueAtTime(1, t + dur * 0.85);
    out.connect(this.sfx || this.master);
    const osc = (type, f0, f1, vol) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.value = vol; o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05); nodes.push(o);
      return o;
    };
    osc('sawtooth', 70, 210, 0.32);                        // magnetic hum
    osc('square', 72, 214, 0.12);                          // detuned against it, so it throbs
    const whine = osc('sine', 380, 2000, 0.22);             // rising capacitor whine
    const lfo = c.createOscillator(), lg = c.createGain(); // warble on the whine
    lfo.frequency.setValueAtTime(18, t); lfo.frequency.linearRampToValueAtTime(60, t + dur);
    lg.gain.value = 120; lfo.connect(lg); lg.connect(whine.frequency); lfo.start(t); lfo.stop(t + dur + 0.05); nodes.push(lfo);
    const n = c.createBufferSource(), fl = c.createBiquadFilter(), ng = c.createGain();   // electric crackle
    n.buffer = this.noiseBuf; n.loop = true; fl.type = 'bandpass'; fl.Q.value = 3;
    fl.frequency.setValueAtTime(800, t); fl.frequency.exponentialRampToValueAtTime(3500, t + dur);
    ng.gain.value = 0.35; n.connect(fl); fl.connect(ng); ng.connect(out); n.start(t); n.stop(t + dur + 0.05); nodes.push(n);
    for (let i = 0; i < 6; i++) this.fnoise(0.025, 0.17 + i * 0.05, 'bandpass', 2200, 1200, 1.2, t + dur * (0.15 + i * 0.13));   // zaps
    return () => { try { out.gain.cancelScheduledValues(c.currentTime); out.gain.setValueAtTime(0.001, c.currentTime); nodes.forEach(o => o.stop()); } catch (err) { /* already done */ } };
  },

  shotgun()   { this.gun('shotgun'); },

  sniper()    {

    this.fnoise(0.7, 1, 'lowpass', 2800, 90, 1);                                     // roar that sinks into a rumble
    this.tone(110, 0.7, 'sine', 1, 28); this.tone(60, 0.5, 'triangle', 0.6, 30);     // chest thump

  enemyShot() { this.gun('enemy'); },
  hit()       { this.fnoise(0.05, 0.3, 'bandpass', 1400, 500, 2); this.tone(200, 0.07, 'square', 0.14, 70); },   // a wet thud

        stealth   dark phonk, slow and sparse: lone cowbell, long 808s, hat rolls          (nobody has spotted you)
        combat    neo rave, 155: hard kick and a deep held bass, dark chords, builds and drops   (someone is hunting you)
        extract   neo rave, 150: the same weight with a darker four-note chord under it          (carrying a client)
        critical  neo rave, 162: faster, chords twice a bar                                      (a critical client has 30 seconds or less)
      A track with build: true runs in 8-bar phrases: bar 7 brings an 8th-note snare roll and a riser, bar 8 a 16th-note roll,
      then everything cuts out for the last beat and drops back in with a crash.

    const kickDist = shaper(11), kickLP = lowpass(2500), kickOut = ac.createGain(); kickOut.gain.value = 1.1; kickDist.connect(kickLP); kickLP.connect(kickOut); kickOut.connect(drums);
    const hatHP = ac.createBiquadFilter(); hatHP.type = 'highpass'; hatHP.frequency.value = 7500; const hatOut = ac.createGain(); hatHP.connect(hatOut); hatOut.connect(drums);
