<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotline Night City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #2a0f52;
    --ink: #f7f3ff;
    --pink: #ff2a6d;
    --cyan: #05d9e8;
    --purple: #7a04eb;
    --yellow: #f9f871;
    --veil: rgba(13, 2, 33, 0.78);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #0d0221; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --page: #0d0221; color-scheme: dark; }

  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Press Start 2P", ui-monospace, "Courier New", monospace;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }

  /* The stage is sized by JS to the largest 16:9 box that fits.
     Its font-size is set to 8 game pixels so overlay text scales with it. */
  #stage { position: relative; width: 480px; height: 270px; font-size: 8px; cursor: none; }
  #game {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #0d0221;
  }
  /* CRT scanlines + vignette, purely cosmetic */
  #crt {
    position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.20) 0, rgba(0,0,0,0.20) 0.125em, transparent 0.125em, transparent 0.375em),
      radial-gradient(ellipse at center, transparent 55%, rgba(13,2,33,0.55) 100%);
  }
  #overlay {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 1.2em; padding: 1.5em; text-align: center;
    background: var(--veil); cursor: default;
  }
  #overlay.show { display: flex; }

  /* Controls panel (key 8). Its rows are rebuilt from live game state every time it opens. */
  #binds, #cyber, #pause {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5;
    display: none; width: 54em; padding: 1.4em 1.6em; cursor: default;
    background: rgba(7, 3, 15, 0.95); border: 0.125em solid var(--yellow);
    box-shadow: 0.5em 0.5em 0 rgba(255, 42, 109, 0.55);
  }
  #binds.show, #cyber.show, #pause.show { display: block; }
  #binds h2, #cyber h2, #pause h2 { margin: 0 0 1em; font-size: 1.25em; font-weight: 400; color: var(--yellow); }
  #binds .grid {
    display: grid; grid-auto-flow: column; grid-template-rows: repeat(11, auto); grid-template-columns: 1fr 1fr;
    gap: 0.45em 2.2em; font-size: 0.875em;
  }
  #binds .row { display: flex; width: 100%; align-items: center; gap: 0.8em; white-space: nowrap; }
  #binds kbd { font: inherit; min-width: 3.2em; padding: 0.35em 0.4em; text-align: center; color: #0d0221; background: var(--yellow); }
  #binds .row.on kbd { background: var(--cyan); }
  #binds .row.off { opacity: 0.4; }
  #binds .note { color: var(--cyan); margin-left: auto; }
  #binds .foot, #cyber .foot, #pause .foot { margin: 1.2em 0 0; font-size: 0.875em; color: var(--pink); }
  #overlay h1 {
    margin: 0; font-size: 3em; font-weight: 400; line-height: 1.25; color: var(--yellow);
    text-shadow: 0.07em 0.07em 0 var(--pink), -0.07em -0.07em 0 var(--cyan);
  }
  #overlay p { margin: 0; font-size: 1em; line-height: 1.7; max-width: 46em; }
  #o-body b { color: var(--cyan); font-weight: 400; }
  #o-hint { color: var(--yellow); }
  /* the three difficulty buttons shown when you ask for a new map */
  #o-choices { display: none; gap: 1em; flex-wrap: wrap; justify-content: center; max-width: 58em; }
  #o-choices.show { display: flex; }
  #o-choices button {
    font: inherit; color: var(--ink); background: rgba(13, 2, 33, 0.6); border: 0.125em solid var(--yellow);
    width: 13em; padding: 0.9em 1em; text-align: left; line-height: 1.6; cursor: pointer;
  }
  #o-choices button:hover, #o-choices button:focus-visible { background: var(--yellow); color: #0d0221; outline: none; }
  #o-choices strong { display: block; font-weight: 400; font-size: 1.25em; margin-bottom: 0.5em; }
  #o-choices kbd { font: inherit; background: var(--yellow); color: #0d0221; padding: 0 0.3em; margin-right: 0.5em; }
  #o-choices button:hover kbd, #o-choices button:focus-visible kbd { background: #0d0221; color: var(--yellow); }
  #o-choices small { font-size: 0.75em; opacity: 0.85; }
  #o-choices .back { flex-basis: 100%; width: auto; text-align: center; border-color: rgba(247, 243, 255, 0.4); }
  @media (prefers-reduced-motion: no-preference) {
    #o-hint { animation: blink 1.1s steps(2, jump-none) infinite; }
    @keyframes blink { 50% { opacity: 0.35; } }
  }
  /* rows in the controls panel are buttons: click one, then press the new key */
  #binds button, #cyber button {
    font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer;
  }
  #binds button.row:hover kbd, #binds .row.wait kbd { background: var(--pink); color: var(--ink); }
  #binds .foot button { color: var(--yellow); text-decoration: underline; }
  #binds button:focus-visible, #cyber button:focus-visible { outline: 0.125em solid var(--cyan); outline-offset: 0.2em; }

  /* Cyberware menu */
  #cyber { width: 58em; }
  #cyber .sub { margin: -0.4em 0 1em; font-size: 0.875em; opacity: 0.7; }
  #cyber .list { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7em; max-height: 21.5em; overflow-y: auto; }
  #cyber .opt {
    display: grid; grid-template-columns: 1fr auto; gap: 0.4em 0.8em; align-items: baseline; align-content: start;
    padding: 0.6em 1em; border: 0.125em solid rgba(247, 243, 255, 0.25); font-size: 0.875em; line-height: 1.5;
  }
  #cyber .opt:hover { border-color: var(--yellow); }
  #cyber .opt.on { border-color: var(--cyan); background: rgba(5, 217, 232, 0.12); }
  #cyber .kind { color: var(--pink); }
  #cyber .name { color: var(--yellow); font-size: 1.25em; order: 2; grid-column: 1 / -1; }
  #cyber .note { color: var(--cyan); order: 1; }
  #cyber .desc { grid-column: 1 / -1; opacity: 0.85; order: 3; }
  #cyber .second { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6em; margin: 0 0 0.9em; font-size: 0.875em; }
  #cyber .second kbd { font: inherit; padding: 0.2em 0.45em; color: #0d0221; background: var(--yellow); }
  #cyber .pick2 { padding: 0.45em 0.8em; border: 0.125em solid rgba(247, 243, 255, 0.25); }
  #cyber .pick2:hover { border-color: var(--yellow); }
  #cyber .pick2.on { border-color: var(--cyan); background: rgba(5, 217, 232, 0.12); }
  #cyber .tabs { display: flex; gap: 0.6em; margin: 0 0 1.2em; }
  #cyber .tab { padding: 0.5em 0.9em; border: 0.125em solid rgba(247, 243, 255, 0.25); }
  #cyber .tab.on { background: var(--yellow); border-color: var(--yellow); color: #0d0221; }
  #cyber .slots { display: grid; gap: 0.6em; font-size: 0.875em; }
  #cyber .slot { display: grid; grid-template-columns: 9em 1fr auto; gap: 0.6em; align-items: center; }
  #cyber .pick { padding: 0.5em 0.9em; border: 0.125em solid var(--yellow); color: var(--yellow); }
  #cyber .pick:hover { background: var(--yellow); color: #0d0221; }
  #cyber .chart { width: 100%; border-collapse: collapse; font-size: 0.75em; }
  #cyber .chart th { text-align: left; font-weight: 400; color: var(--pink); padding: 0 0.6em 0.6em 0; }
  #cyber .chart td { padding: 0.45em 0.6em 0.45em 0; border-top: 0.1em solid rgba(247, 243, 255, 0.15); white-space: nowrap; }
  #cyber .chart td:first-child { color: var(--yellow); }
  #cyber .chart tbody tr { cursor: pointer; }
  #cyber .chart tbody tr:hover td { background: rgba(249, 248, 113, 0.14); }
  #cyber .chart tr.on td { color: var(--cyan); }
  #cyber .foot button { color: var(--yellow); text-decoration: underline; }
  /* Pause menu */
  #pause { width: 34em; }
  #pause button { font: inherit; color: inherit; background: none; border: 0.125em solid rgba(247, 243, 255, 0.3); padding: 0.6em 0.9em; cursor: pointer; }
  #pause button:hover, #pause button:focus-visible { border-color: var(--yellow); color: var(--yellow); outline: none; }
  #pause .main { display: block; width: 100%; margin-bottom: 1.2em; background: var(--yellow); color: #0d0221; border-color: var(--yellow); }
  #pause .main:hover { color: #0d0221; filter: brightness(1.1); }
  #pause label { display: grid; grid-template-columns: 7em 1fr 3em; align-items: center; gap: 0.8em; margin: 0 0 1em; font-size: 0.875em; }
  #pause input[type=range] { width: 100%; accent-color: #ff2a6d; cursor: pointer; }
  #pause .val { text-align: right; color: var(--cyan); }
  #pause .row { display: flex; gap: 0.6em; flex-wrap: wrap; margin-top: 0.4em; font-size: 0.875em; }
  #cyber .lock { margin: 0 0 1em; padding: 0.6em 0.8em; font-size: 0.875em; color: #0d0221; background: var(--pink); }
  #cyber.locked .opt, #cyber.locked .pick, #cyber.locked .toggle, #cyber.locked .chart tbody tr { opacity: 0.45; cursor: not-allowed; }
  #cyber .arrow { padding: 0.5em 0; border: 0.125em solid rgba(247, 243, 255, 0.25); text-align: center; color: var(--yellow); }
  #cyber .arrow:hover { border-color: var(--yellow); }
  #cyber .gunname { display: flex; justify-content: space-between; padding: 0.5em 0.8em; border: 0.125em solid var(--cyan); background: rgba(5, 217, 232, 0.12); }
  #cyber .toggle { display: flex; align-items: center; gap: 0.8em; margin: 0 0 1em; font-size: 0.875em; }
  #cyber .toggle .box { min-width: 3.6em; padding: 0.35em 0.4em; text-align: center; color: #0d0221; background: rgba(247, 243, 255, 0.45); }
  #cyber .toggle.on .box { background: var(--cyan); }
  #cyber .slot kbd { font: inherit; padding: 0.3em 0.5em; margin-right: 0.6em; color: #0d0221; background: var(--yellow); }
  #cyber .gun { padding: 0.55em 0.2em; border: 0.125em solid rgba(247, 243, 255, 0.25); text-align: center; line-height: 1.6; }
  #cyber .gun .note { display: block; }
  #cyber .gun:hover { border-color: var(--yellow); }
  #cyber .gun.on { border-color: var(--cyan); background: rgba(5, 217, 232, 0.12); }
  #cyber .guninfo { columns: 2; margin: 0.9em 0 0; padding: 0; list-style: none; font-size: 0.75em; line-height: 1.7; opacity: 0.85; }
  #cyber .guninfo b { color: var(--yellow); font-weight: 400; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="270"></canvas>
  <div id="crt"></div>
  <div id="binds"></div>
  <div id="cyber"></div>
  <div id="pause"></div>
  <div id="overlay" class="show">
    <h1 id="o-title"></h1>
    <p id="o-body"></p>
    <div id="o-choices"></div>
    <p id="o-hint"></p>
  </div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   1. CONFIG  -  tune the game here
   ===================================================================== */
const W = 480, H = 270;   // internal resolution (scaled up for the pixel look)
const TILE = 16;

const CFG = {
  player: {
    hp: 8, radius: 5, speed: 105,
    carrySpeedMult: 0.55,          // movement penalty while carrying the client
    // carrying also locks you to the pistol (see WEAPONS)
    startSlot: 2,   // which weapon slot (1 to 3) is in your hands when a run starts
    // guns are defined in WEAPONS below
  },
  enemy: {
    grunt: { hp: 64, radius: 5, patrolSpeed: 32, chaseSpeed: 72, sight: 170, fov: 1.9, reaction: 0.45 },
    heavy: { hp: 96, radius: 6, patrolSpeed: 24, chaseSpeed: 52, sight: 180, fov: 1.9, reaction: 0.6 },
    // Riot shield: always carries a pistol. It holds the shield up for phase seconds, then lowers it to shoot for phase seconds.
    // While the shield is up, nothing from the front (within blockArc radians of where it faces) hurts it except the railgun
    // and explosions. turn = how fast it can swing round to face you, slow enough that you can get beside it.
    // Net hacker: fragile, hangs back at keepAway px, carries any weapon. Once it spots you within hackRange it starts an
    // upload that lands after hackTime seconds: a jam (guns jammed for jam seconds) or optics (near blindness), whichever
    // it rolled. The upload is locked on: only killing the hacker stops it. hackCooldown = seconds before it can try again.
    hacker: { hp: 50, radius: 5, patrolSpeed: 28, chaseSpeed: 58, sight: 200, fov: 1.9, reaction: 0.6, hackRange: 190, hackTime: 1.6, hackCooldown: 9, jam: 5, keepAway: 110 },
    shield: { hp: 80, radius: 6, patrolSpeed: 22, chaseSpeed: 44, sight: 180, fov: 1.9, reaction: 0.5, phase: 5, turn: 1.5, blockArc: 1.2 },
    // Kamikaze drone (every mode, more of them the harder it is): flies straight at you, a good bit slower than you run. Once it is within
    // trigger px it arms: fuse seconds of flashing and beeping, then it blows up. Any hit makes it blow up where it is,
    // so shoot it from a distance. blast = its explosion: radius, damage to enemies, and selfDmg = hits it takes off you.
    drone:  { hp: 1, radius: 4, patrolSpeed: 40, chaseSpeed: 83, sight: 190, fov: 2.4, reaction: 0.2, turn: 9, trigger: 18, fuse: 0.35,
              blast: { radius: 38, dmg: 110, minDmg: 40, selfDmg: 2 } },
  },
  medkit: { dropChance: 0.3, heal: 2 },   // dead enemies may drop one; walk over it, press 4 to use
  // Damage falls from dmg at the center to minDmg at the edge. Walls block the blast.
  grenade: { cooldown: 18, fuse: 0.9, radius: 52, dmg: 130, minDmg: 45, selfDmg: 2, maxThrow: 150 },
  bloom: true,           // soft glow around neon, fire and tracers. Set false if the game runs slow
  lineOfSight: false,   // set to true to bring back line of sight: anything you have no clear view of shows as a bare outline
  critSandySlow: 0.5,      // a critical client's clock runs at this speed while your Sandevistan is on
  critBonusPerFloor: 30,   // seconds added to a critical client's timer when you stabilize them, per floor above the ground
  stabilizeTime: 3,     // seconds of holding E
  interactRange: 22,    // px
};

/* Guns. Enemy health is grunt 64, heavy 96. Damage is per bullet (per pellet for the shotgun).
     mag     = rounds per magazine (reloads are unlimited)
     range   = how far a bullet flies before it disappears, in px
     falloff = distance over which damage drops from dmg to minDmg (0 = no falloff)
   Hits to kill a grunt / heavy: AR and pistols 3 / 4, LMG 4 / 6, SMG 6 / 9, duals 7 / 11.
   Shotgun: 8 pellets, one-shots anything at point blank, tickles at range. */
const WEAPONS = {
  shotgun: { name: 'Shotgun', mag: 6,  reload: 1.6, fireDelay: 0.7,  pellets: 8, dmg: 18, minDmg: 0.5, falloff: 150, range: 230,  spread: 0.22, bulletSpeed: 380, shake: 5,   gunLen: 8, breaksDoors: true },
  ar:      { name: 'AR',      mag: 25, reload: 1.4, fireDelay: 0.16, pellets: 1, dmg: 28, minDmg: 28,  falloff: 0,   range: 5000, spread: 0.03, bulletSpeed: 460, shake: 2.2, gunLen: 9 },
  smg:     { name: 'SMG',     mag: 30, reload: 1.2, fireDelay: 0.045, pellets: 1, dmg: 9, minDmg: 9,   falloff: 0,   range: 150,  spread: 0.09, bulletSpeed: 400, shake: 1.3, gunLen: 6 },
  // Forced on while you carry the client; no key selects it. 3 shots per grunt, 4 per heavy.
  pistol:  { name: 'Pistol',  mag: 15, reload: 1.1, fireDelay: 0.2,  pellets: 1, dmg: 28, minDmg: 28,  falloff: 0,   range: 160,  spread: 0.05, bulletSpeed: 420, shake: 1.8, gunLen: 5, carryOnly: true },
  // One round, kills anything it hits, never runs out of range. charge = seconds it takes to spin up after you pull the trigger.
  sniper:  { name: 'Railgun', pierce: true, charge: 0.5, mag: 1,  reload: 1.8, fireDelay: 0.4,  pellets: 1, dmg: 9999, minDmg: 9999, falloff: 0, range: 5000, spread: 0,    bulletSpeed: 1240, shake: 6,   gunLen: 11 },
  // Sustained fire: AR-level damage per second and twice the mag (4 shots per grunt, 6 per heavy), paid for with
  // loose aim, a 3 second reload, and moving at fireMoveMult speed while the trigger is held.
  lmg:     { name: 'LMG',     mag: 50, reload: 3,   fireDelay: 0.085, pellets: 1, dmg: 16, minDmg: 16,  falloff: 0,   range: 5000, spread: 0.08, bulletSpeed: 440, shake: 1.8, gunLen: 10, fireMoveMult: 0.6 },
  // Melee: one swing kills every enemy within reach px and inside the arc (radians) in front of you. Silent, no ammo.
  katana:  { name: 'Katana',  melee: true, mag: 0, reload: 0, fireDelay: 0.35, reach: 24, arc: 2.2, spread: 0.05, shake: 1.5, gunLen: 13 },
  // Akimbo: the fastest trigger in the game (7 shots per grunt, 11 per heavy), but the shortest reach of any gun.
  // Cyberware arm blades: two blades thrust straight ahead, bladeGap px apart, twice as long as the katana's reach. Both blades on the same target is a kill; one blade takes half its health. Silent, no ammo.
  mantis:  { name: 'Mantis blades', short: 'Mantis', melee: true, rect: true, cyberware: true, mag: 0, reload: 0, fireDelay: 0.4, reach: 48, bladeGap: 6, spread: 0.05, shake: 1.8, gunLen: 12 },
  // Thrown blades: one hit kills (elites take a quarter), completely silent, a shotgun-like rate. With limited ammo you carry 12 and no
  // spares: every knife that lands can be picked back up by walking over it. With unlimited ammo they simply come back.
  knives:  { name: 'Throwing knives', short: 'Knives', thrown: true, mag: 12, reload: 1, fireDelay: 0.6, pellets: 1, dmg: 9999, minDmg: 9999, falloff: 0, range: 220, spread: 0.03, bulletSpeed: 440, shake: 0.8, gunLen: 6 },
  dual:    { name: 'Dual pistols', short: 'Duals', akimbo: true, mag: 40, reload: 1.3, fireDelay: 0.055, pellets: 1, dmg: 9.2, minDmg: 9.2, falloff: 0, range: 110, spread: 0.1, bulletSpeed: 400, shake: 1.1, gunLen: 6 },
};
/* What enemies carry. Each enemy rolls one weapon when the map is made: chance is its share (they add up to 1:
   30% pistol, and the other six split the rest evenly).
   Every bullet or blade hit that lands costs you 1 health.
     burst / burstDelay = shots per trigger pull and the gap between them; fireDelay = pause after a burst
     pellets = bullets per shot; range = how far its bullets fly; keepDist = how close it tries to get
     speedMult = how fast its carrier moves when chasing. The railgun is deliberately not on this list. */
const ENEMY_WEAPONS = {
  pistol:  { chance: 0.3, fireDelay: 0.8, burst: 1, burstDelay: 0,    pellets: 1, spread: 0.11, bulletSpeed: 230, range: 340, keepDist: 70 },
  smg:     { chance: 0.7 / 6, fireDelay: 1.3, burst: 4, burstDelay: 0.08, pellets: 1, spread: 0.19, bulletSpeed: 240, range: 180, keepDist: 60 },
  ar:      { chance: 0.7 / 6, fireDelay: 1.3, burst: 3, burstDelay: 0.13, pellets: 1, spread: 0.10, bulletSpeed: 270, range: 420, keepDist: 95 },
  shotgun: { chance: 0.7 / 6, fireDelay: 1.6, burst: 1, burstDelay: 0,    pellets: 4, spread: 0.26, bulletSpeed: 220, range: 110, keepDist: 42 },
  lmg:     { chance: 0.7 / 6, fireDelay: 2.4, burst: 8, burstDelay: 0.1,  pellets: 1, spread: 0.2,  bulletSpeed: 240, range: 380, keepDist: 100, speedMult: 0.8 },
  // blade: charges you, winds up for windup seconds once within reach, then lands hits health in one cut
  katana:  { chance: 0.7 / 6, melee: true, fireDelay: 0.9, windup: 0.3, reach: 22, hits: 2, keepDist: 12, speedMult: 1.35, burst: 1, burstDelay: 0, pellets: 0, spread: 0 },
};
// mantis blades: a longer, straight thrust with a slightly longer windup. Each blade that lands costs you 1 health,
// so a thrust that catches you dead center costs 2 and a glancing one costs 1.
ENEMY_WEAPONS.mantis = { chance: 0.7 / 6, melee: true, rect: true, fireDelay: 1, windup: 0.38, reach: 40, bladeGap: 6, hits: 2, keepDist: 22, speedMult: 1.3, burst: 1, burstDelay: 0, pellets: 0, spread: 0 };

/** A riot shield's weapon: something you can use one-handed behind a shield. */
function rollShieldWeapon() {
  const r = Math.random();
  return r < 0.4 ? 'pistol' : r < 0.6 ? 'ar' : r < 0.8 ? 'smg' : 'katana';
}

function rollEnemyWeapon() {
  let r = Math.random();
  for (const id in ENEMY_WEAPONS) { r -= ENEMY_WEAPONS[id].chance; if (r < 0) return id; }
  return 'pistol';
}

/* Loadout: which gun sits in weapon slots 1, 2 and 3. Changed on the Guns tab of the cyberware menu.
   Any WEAPONS entry without carryOnly can go in a slot, so a new gun only needs a row above and a line here. */
const GUN_INFO = {
  shotgun: 'close range, breaks doors',
  ar: 'all-rounder, any range',
  smg: 'fastest, medium range',
  sniper: 'pierces walls, 0.5s charge',
  lmg: '50 rounds, slows you',
  katana: 'silent, kills at touch',
  dual: 'fastest fire, shortest range',
  knives: 'silent one-hit kills, pick them back up',
  mantis: 'long thrust, both blades to kill',
};
const LOADOUT_KEY = 'flatline.loadout';
let manualLoadout = ['shotgun', 'ar', 'smg'];    // the guns you picked yourself; used when random guns is off
/** Hard maps hand you three random guns each run; every other mode uses the guns you picked. */
function randomGunsNow() { return !!diffOf(level).randomGuns; }
let loadout = [...manualLoadout];                // what is in slots 1 to 3 right now

/* Cyberware: one slot, chosen in the cyberware menu. Anything with kind 'Quickhack' gets the aim line
   and uses range; to add a quickhack, add an entry here and a case in applyHack(). Cooldowns are per item. */
const CYBERWARE = {
  sandevistan: { name: 'Sandevistan', kind: 'Sandevistan', cooldown: 30, duration: 9, slow: 0.1, speedMult: 1.425, doubleTap: 0.35,   // doubleTap = seconds allowed between the two presses
                 desc: 'Double tap. World at 10% speed for 9s. Takes both slots.' },
  // Your bullets bend in flight toward the nearest enemy they can see, within seek px. turn = how hard they curve (radians a second).
  // They never curve through walls or shut doors, but will follow a target through an open doorway.
  smartlink:   { name: 'Smart Link', kind: 'Cyberware', cooldown: 21, duration: 8, seek: 150, turn: 11,

  // Enemies cannot see you while it runs. Any attack (a shot, a swing, a grenade, a quickhack) ends it early.
  camo:        { name: 'Optical Camo', kind: 'Cyberware', cooldown: 24, duration: 9,
                 desc: 'Invisible for 9s. Attacking breaks it.' },
  // ttk = seconds to burn any enemy from full health to dead; slow = its speed multiplier while burning.

  overheat:    { name: 'Overheat', kind: 'Quickhack', cooldown: 10, range: WEAPONS.smg.range, ttk: 2.5, slow: 0.5, radius: 40, charges: 2, window: 3,

  // the target arms one of its own grenades; it blows after fuse seconds using the normal grenade blast
  detonate:    { name: 'Grenade Detonate', kind: 'Quickhack', cooldown: 20, range: WEAPONS.smg.range * 2, fuse: 0.7,
                 desc: 'Target pulls a grenade and it blows. Double range.' },
  
  
                 
};
const CYBER_KEY = 'flatline.cyber';
let selectedCyber = 'sandevistan';
// Quickhacks are lighter than the big cyberware: with a quickhack in the first slot you can fit a second one, on its own key.
let selectedCyber2 = null;
