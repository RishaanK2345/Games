  if (!noWeapon) { decals.save(); decals.translate(rand(-4, 8), look.w + rand(4, 9)); decals.rotate(rand(-1.5, 1.5)); art.draw(decals); decals.restore(); }
  decals.restore();
}

/** The evac zone: a landing pad with an armored medevac AV idling on it, nose out, ramp down toward the street. */
function drawEvac(pulse) {
  const cx = evac.x + evac.w / 2, cy = evac.y + evac.h / 2;
  ctx.fillStyle = `rgba(5,217,232,${0.07 + pulse * 0.07})`;
  ctx.fillRect(evac.x, evac.y, evac.w, evac.h);
  ctx.strokeStyle = CYAN; ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]); ctx.lineDashOffset = -time * 12;
  ctx.strokeRect(evac.x + 1.5, evac.y + 1.5, evac.w - 3, evac.h - 3);
  ctx.setLineDash([]);
  ctx.fillStyle = CYAN; ctx.fillText('EVAC', cx, evac.y - 6);

  const flip = cx > WORLD_W / 2 ? -1 : 1;                  // nose toward the edge of the map, ramp toward the street
  const bob = Math.round(Math.sin(time * 2.2));            // idling on its thrusters
  const pods = [[-24, -25], [-24, 25], [20, -25], [20, 25]];
  const R = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
  const disc = (c, x, y, r) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };

  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.scale(flip, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';                      // shadow on the pad
  ctx.fillRect(-36, -8, 74, 26);
  ctx.translate(0, bob);
  for (const [ex, ey] of pods) {                           // four thruster pods on stub wings
    R('#8f9bad', ex - 3, ey < 0 ? ey : 11, 6, 14);
    R('#6c788a', ex - 3, ey < 0 ? ey : 11, 1, 14);
    disc('#1b2230', ex, ey, 7); disc('#39465c', ex, ey, 5);
    disc(hexA(CYAN, 0.55 + pulse * 0.4), ex, ey, 3); disc('#eaffff', ex, ey, 1);
  }
  ctx.fillStyle = '#e6edf5';                               // hull
  ctx.beginPath(); ctx.moveTo(-42, 0); ctx.lineTo(-33, -11); ctx.lineTo(26, -13); ctx.lineTo(32, -9);
  ctx.lineTo(32, 9); ctx.lineTo(26, 13); ctx.lineTo(-33, 11); ctx.closePath(); ctx.fill();
  R('#c4cfdc', -30, 8, 56, 3);                             // shaded lower edge
  R('#ffffff', -30, -11, 56, 2);                           // lit upper edge
  R('#19c9a0', -24, -8, 46, 2); R('#19c9a0', -24, 6, 46, 2);   // teal stripes
  ctx.fillStyle = '#0f2a3a';                               // cockpit glass
  ctx.beginPath(); ctx.moveTo(-39, 0); ctx.lineTo(-32, -7); ctx.lineTo(-24, -7); ctx.lineTo(-24, 7); ctx.lineTo(-32, 7); ctx.closePath(); ctx.fill();
  R('#2f7f9a', -31, -5, 4, 3); R('#1a4a60', -30, 1, 5, 4);
  R('#aab6c6', -14, -11, 1, 22); R('#aab6c6', 14, -11, 1, 22);   // roof panel seams
  R('#19e36b', -2, -5, 4, 10); R('#19e36b', -5, -2, 10, 4);      // medical cross on the roof
  R('#12121e', 24, -8, 8, 16);                             // open rear bay
  R('#f9d77a', 25, -6, 3, 12);                             // light inside the bay
  R('#59657a', 32, -7, 10, 14);                            // ramp, down
  for (let i = 0; i < 3; i++) R(YELLOW, 34 + i * 3, -7, 1, 14);
  if (Math.floor(time * 2) % 2) { R('#ff3b3b', -36, -12, 2, 2); R('#39ff88', -36, 10, 2, 2); }   // nav lights
  if (time % 1.3 < 0.08) R('#ffffff', 20, -1, 3, 3);       // strobe
  ctx.restore();

  for (const [ex, ey] of pods) drawGlow(cx + flip * ex, cy + ey + bob, CYAN, 11);
  drawGlow(cx + flip * 36, cy + bob, '#f9d77a', 10);
}

/** A client lying on the floor: bleeding until stabilized, with a pulsing ring so you can spot them across a room. */
function drawClient(cl, pulse) {
  const x = Math.round(cl.x), y = Math.round(cl.y);
  const col = cl.crit ? (Math.floor(time * 5) % 2 ? '#ff3b3b' : YELLOW) : cl.stabilized ? CYAN : PINK;   // a critical client flashes red and yellow
  if (cl.crit) { ctx.fillStyle = col; ctx.fillText(Math.max(0, Math.ceil(cl.timeLeft)) + 's', x, y - 17); }
  if (!cl.stabilized) { ctx.fillStyle = '#8f0f3c'; ctx.beginPath(); ctx.ellipse(x - 2, y + 2, 9, 6, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.strokeStyle = col; ctx.globalAlpha = 0.9 - pulse * 0.5;
  ctx.beginPath(); ctx.arc(cl.x, cl.y, 9 + pulse * 5, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(8,2,20,0.75)'; ctx.fillRect(x - 10, y - 4, 20, 8);
  ctx.fillStyle = '#23203a'; ctx.fillRect(x - 9, y - 3, 6, 2); ctx.fillRect(x - 9, y + 1, 6, 2);     // legs
  ctx.fillStyle = '#0d0a1f'; ctx.fillRect(x - 10, y - 3, 1, 2); ctx.fillRect(x - 10, y + 1, 1, 2);   // shoes
  ctx.fillStyle = '#d9b44a'; ctx.fillRect(x - 4, y - 3, 8, 6);                                       // gold jacket
  ctx.fillStyle = '#b8923a'; ctx.fillRect(x - 4, y + 2, 8, 1);
  ctx.fillStyle = '#f4e3a1'; ctx.fillRect(x, y - 1, 3, 2);                                           // shirt
  ctx.fillStyle = PINK; ctx.fillRect(x + 1, y - 1, 1, 2);                                            // tie
  ctx.fillStyle = '#ffd1a6'; ctx.fillRect(x + 4, y - 2, 4, 4);                                       // head
  ctx.fillStyle = '#3a2a22'; ctx.fillRect(x + 7, y - 2, 1, 4);                                       // hair
  if (cl.stabilized) { ctx.fillStyle = '#19e36b'; ctx.fillRect(x - 3, y - 2, 1, 3); ctx.fillRect(x - 4, y - 1, 3, 1); }   // field dressing
  if (cl.progress > 0 && !cl.stabilized) {                 // stabilize progress ring
    ctx.strokeStyle = CYAN; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cl.x, cl.y, 13, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * cl.progress / CFG.stabilizeTime);
    ctx.stroke(); ctx.lineWidth = 1;
  }
}

/** Sliding doors: a lit panel when shut, just the floor track when open, nothing left when destroyed. */
function drawDoors() {
  for (const d of doors) {
    const st = doorOpen[d.y * COLS + d.x], x = d.x * TILE, y = d.y * TILE;
    if (st === 2) continue;
    if (st === 1) {
      ctx.fillStyle = 'rgba(249,248,113,0.32)';
      if (d.vertical) ctx.fillRect(x + 7, y, 2, TILE); else ctx.fillRect(x, y + 7, TILE, 2);
      continue;
    }
    if (d.vertical) {
      ctx.fillStyle = '#0a0612'; ctx.fillRect(x + 4, y, 8, TILE);
      ctx.fillStyle = '#c9a227'; ctx.fillRect(x + 5, y, 6, TILE);
      ctx.fillStyle = YELLOW; ctx.fillRect(x + 5, y, 2, TILE);
      ctx.fillStyle = '#7a6113'; ctx.fillRect(x + 5, y + TILE - 1, 6, 1);
      ctx.fillStyle = PINK; ctx.fillRect(x + 8, y + 7, 2, 2);
    } else {
      ctx.fillStyle = '#0a0612'; ctx.fillRect(x, y + 4, TILE, 8);
      ctx.fillStyle = '#c9a227'; ctx.fillRect(x, y + 5, TILE, 6);
      ctx.fillStyle = YELLOW; ctx.fillRect(x, y + 5, TILE, 2);
      ctx.fillStyle = '#7a6113'; ctx.fillRect(x + TILE - 1, y + 5, 1, 6);
      ctx.fillStyle = PINK; ctx.fillRect(x + 7, y + 8, 2, 2);
    }
  }
}


/** A destroyed drone: scattered dark debris and a scorch, painted into the floor. */
function stampWreck(x, y) {
  decals.fillStyle = 'rgba(6,3,8,0.5)'; decals.beginPath(); decals.arc(x, y, 6, 0, Math.PI * 2); decals.fill();
  for (let i = 0; i < 7; i++) {
    decals.fillStyle = ['#2b2f45', '#4a4f68', '#ff3b3b', '#1a1a2a'][i % 4];
    decals.fillRect(Math.round(x + rand(-8, 8)), Math.round(y + rand(-8, 8)), randInt(1, 3), randInt(1, 2));
  }
  spawnSparks(x, y, '#ff9a1f', 10); spawnSmoke(x, y, 4, 3);
}

/** Kamikaze drone: four spinning rotors around a dark core with a charge strapped on and a red eye, hovering over its shadow. */
function drawDrone(e) {
  const bob = Math.sin(time * 6 + e.homeX) * 1.2, hx = e.x, hy = e.y - 4 + bob;
  ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.beginPath(); ctx.ellipse(e.x + 2, e.y + 3, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
  if (e.fuse > 0) {                                        // armed: its blast radius flashes on the floor
    const k = 1 - e.fuse / e.cfg.fuse;
    ctx.fillStyle = hexA('#ff3b3b', 0.1 + 0.15 * k); ctx.beginPath(); ctx.arc(e.x, e.y, e.cfg.blast.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA('#ff3b3b', 0.6 + 0.4 * (Math.floor(time * 20) % 2)); ctx.beginPath(); ctx.arc(e.x, e.y, e.cfg.blast.radius, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.save(); ctx.translate(Math.round(hx), Math.round(hy)); ctx.rotate(e.angle);
  ctx.strokeStyle = '#141626'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-5, -5); ctx.lineTo(5, 5); ctx.moveTo(-5, 5); ctx.lineTo(5, -5); ctx.stroke(); ctx.lineWidth = 1;
  for (const [rx, ry] of [[-5, -5], [5, -5], [-5, 5], [5, 5]]) {
    ctx.fillStyle = 'rgba(190,210,255,0.22)'; ctx.beginPath(); ctx.arc(rx, ry, 3.2, 0, Math.PI * 2); ctx.fill();
    const a = time * 40 + rx; ctx.strokeStyle = 'rgba(230,240,255,0.7)';
    ctx.beginPath(); ctx.moveTo(rx - Math.cos(a) * 3, ry - Math.sin(a) * 3); ctx.lineTo(rx + Math.cos(a) * 3, ry + Math.sin(a) * 3); ctx.stroke();
  }
  ctx.fillStyle = e.flash > 0 ? '#ffffff' : DARK; ctx.fillRect(-4, -3, 8, 6);
  ctx.fillStyle = e.flash > 0 || (e.fuse > 0 && Math.floor(time * 20) % 2) ? '#ffffff' : e.look.body; ctx.fillRect(-3, -2, 6, 4);
  ctx.fillStyle = '#ff9a1f'; ctx.fillRect(-2, -1, 2, 2);  // the charge it carries
  const on = e.fuse > 0 ? 1 : e.state === 'chase' ? Math.floor(time * 10) % 2 : 1;
  ctx.fillStyle = on ? '#ff3b3b' : '#6a1a22'; ctx.fillRect(2, -1, 2, 2);   // the eye, at the front
  ctx.restore();
}

/** Cameras: a sweeping cone of light (red while it can see you), the camera body, and its status light. */
function drawCameras() {
  for (const c of floorStates[floorIdx].cameras || []) {
    if (c.alive && !c.off) {
      const n = 12, a0 = c.angle - CAMERA.fov / 2;
      const col = c.sees ? '#ff3b3b' : '#ffe9a8', g = ctx.createRadialGradient(c.x, c.y, 2, c.x, c.y, CAMERA.range);
      g.addColorStop(0, hexA(col, c.sees ? 0.3 : 0.16)); g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(c.x, c.y);
      for (let i = 0; i <= n; i++) {                       // the cone stops at walls and shut doors
        const a = a0 + CAMERA.fov * i / n, ca = Math.cos(a), sa = Math.sin(a);
        let d = 6;
        while (d < CAMERA.range && !blocksSight(tileOf(c.x + ca * d), tileOf(c.y + sa * d))) d += 4;
        ctx.lineTo(c.x + ca * d, c.y + sa * d);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.save(); ctx.translate(Math.round(c.x), Math.round(c.y));
    ctx.strokeStyle = '#141626'; ctx.lineWidth = 2;          // the bracket back into the corner
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-Math.cos(c.base) * 5, -Math.sin(c.base) * 5); ctx.stroke(); ctx.lineWidth = 1;
    ctx.rotate(c.alive ? c.angle : c.base + 0.6);
    ctx.fillStyle = DARK; ctx.fillRect(-4, -3, 9, 6);
    ctx.fillStyle = c.alive ? '#5a5f78' : '#2a2c38'; ctx.fillRect(-3, -2, 6, 4);
    ctx.fillStyle = c.alive ? '#1a1d2e' : '#151520'; ctx.fillRect(3, -2, 3, 4);       // lens hood
    if (c.alive) { ctx.fillStyle = c.off ? '#2a3a55' : '#7fd8ff'; ctx.fillRect(5, -1, 1, 2); }
    ctx.restore();
    if (c.alive) {                                          // status light: green = shut off from the laptop, red = live
      const live = !c.off, blink = c.sees || Math.floor(time * 2 + c.t) % 2;
      ctx.fillStyle = !live ? '#39ff88' : c.bodyFx > 0 ? (Math.floor(time * 12) % 2 ? '#ff9a1f' : '#5a3a10') : blink ? '#ff3b3b' : '#5a1a22';
      ctx.fillRect(Math.round(c.x) - 1, Math.round(c.y) - 5, 2, 2);
    } else if (Math.random() < 0.02) spawnSparks(c.x, c.y, '#ffd27a', 2);   // shot out: it still spits a spark now and then
  }
}

/** Status lights on the server racks: rows of tiny LEDs, each blinking at its own rate. Red ones while the cameras run, all green once hacked. */
function drawServerLights() {
  const servers = (level.floors[floorIdx] || {}).servers;
  if (!servers || !servers.length) return;
  const hacked = floorStates[floorIdx].security && floorStates[floorIdx].security.hacked;
  for (const sv of servers) {
    const px = sv.x * TILE, py = sv.y * TILE;
    for (let k = 0; k < 4; k++) for (let j = 0; j < 4; j++) {
      const ph = Math.sin(time * (2 + ((sv.x * 13 + k * 7 + j * 3) % 9)) + sv.y * 5 + j);
      if (ph < -0.2) continue;
      ctx.fillStyle = !hacked && (k + j + sv.x) % 5 === 0 ? '#ff3b3b' : (j % 2 ? '#39ff88' : '#05d9e8');
      ctx.fillRect(px + 3 + j * 3, py + 2 + k * 3, 1, 1);
    }
  }
}

/** The security room laptop on its desk: code scrolling while it runs the cameras, green once you hacked it. */
function drawLaptop() {
  const sec = floorStates[floorIdx].security;
  if (!sec) return;
  const x = Math.round(sec.x), y = Math.round(sec.y);
  const scr = sec.hacked ? '#39ff88' : sec.lockT > 0 ? (Math.floor(time * 8) % 2 ? '#ff3b3b' : '#5a1a22') : CYAN;
  ctx.globalAlpha = 0.35; drawGlow(x, y - 3, scr, 7); ctx.globalAlpha = 1;   // a faint screen glow, kept low so the shape stays readable
  ctx.save();
  if (sec.flip) { ctx.translate(x * 2, y * 2); ctx.rotate(Math.PI); }   // desk faces down: the screen turns to face the chair
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(x - 6, y - 5, 14, 13);   // shadow on the desk
  // lid: dark bezel around a lit screen with lines of code scrolling up it
  ctx.fillStyle = '#0a0818'; ctx.fillRect(x - 7, y - 7, 14, 8);
  ctx.fillStyle = '#05030c'; ctx.fillRect(x - 6, y - 6, 12, 6);
  for (let i = 0; i < 3; i++) {
    const w = 3 + Math.floor((Math.sin(time * 4 + i * 1.9 + Math.floor(time * 3)) * 0.5 + 0.5) * 7);
    ctx.fillStyle = hexA(scr, i === 1 ? 1 : 0.65); ctx.fillRect(x - 5, y - 5 + i * 2, w, 1);
  }
  if (sec.hacked) { ctx.fillStyle = scr; ctx.fillRect(x + 2, y - 4, 1, 1); ctx.fillRect(x + 3, y - 3, 1, 1); ctx.fillRect(x + 4, y - 4, 1, 1); ctx.fillRect(x + 5, y - 5, 1, 1); }   // a check mark
  ctx.fillStyle = '#6a7090'; ctx.fillRect(x - 7, y + 1, 14, 1);            // the hinge
  // base: grey deck with a grid of keys and a trackpad
  ctx.fillStyle = '#3a3f55'; ctx.fillRect(x - 7, y + 2, 14, 6);
  ctx.fillStyle = '#5a607a';
  for (let ky = 0; ky < 2; ky++) for (let kx = 0; kx < 6; kx++) ctx.fillRect(x - 6 + kx * 2, y + 3 + ky * 2, 1, 1);
  ctx.fillStyle = '#4a5068'; ctx.fillRect(x - 2, y + 7, 4, 1);
  ctx.restore();
  if (!sec.hacked && laptopNear() && !hackGame) {          // a ring tells you this is the thing to use
    ctx.strokeStyle = hexA(CYAN, 0.4 + 0.3 * Math.sin(time * 5)); ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.stroke();
  }
}

/** The laptop hack, drawn over the screen. */
function drawHack() {
  const g = hackGame;
  ctx.fillStyle = 'rgba(4,1,14,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.font = FONT; ctx.textBaseline = 'middle';
  const text = (t, x, y, col, align = 'left') => { ctx.textAlign = align; ctx.fillStyle = DARK; ctx.fillText(t, x + 1, y + 1); ctx.fillStyle = col; ctx.fillText(t, x, y); };
  ctx.fillStyle = '#0b0420'; ctx.fillRect(60, 22, 360, 226);
  ctx.strokeStyle = hexA(g.type === 'breach' ? YELLOW : PINK, 0.8); ctx.strokeRect(60.5, 22.5, 359, 225);
  if (g.type === 'breach') {
    const B = BREACH, N = HACK.size;
    text('BREACH PROTOCOL', 240, 36, YELLOW, 'center');
    text('Pick codes from the lit line. Row, column, row...', 240, 52, INK, 'center');
    // the lit line you must pick from
    ctx.fillStyle = hexA(YELLOW, 0.13);
    if (g.axis === 'row') ctx.fillRect(B.x, B.y + g.line * B.cell, N * B.cell, B.cell); else ctx.fillRect(B.x + g.line * B.cell, B.y, B.cell, N * B.cell);
    const hover = breachCellAt(mouse.sx, mouse.sy);
    for (let r0 = 0; r0 < N; r0++) for (let c0 = 0; c0 < N; c0++) {
      const cx = B.x + c0 * B.cell + B.cell / 2, cy = B.y + r0 * B.cell + B.cell / 2, used = g.used.has(r0 * N + c0), can = breachPickable(g, r0, c0);
      if (hover && hover[0] === r0 && hover[1] === c0 && can) { ctx.strokeStyle = YELLOW; ctx.strokeRect(cx - 12.5, cy - 9.5, 25, 19); }
      text(used ? '[ ]' : g.grid[r0][c0], cx, cy, used ? '#4a4366' : can ? INK : '#8a83a8', 'center');
    }
    ctx.strokeStyle = hexA(CYAN, 0.35); ctx.strokeRect(B.x - 0.5, B.y - 0.5, N * B.cell + 1, N * B.cell + 1);
    const rx = 250, prog = breachProgress(g);
    text('SEQUENCE', rx, 78, CYAN);
    g.seq.forEach((code, i) => { ctx.fillStyle = i < prog ? hexA('#39ff88', 0.25) : 'rgba(255,255,255,0.04)'; ctx.fillRect(rx + i * 30, 88, 26, 16); text(code, rx + 13 + i * 30, 97, i < prog ? '#39ff88' : INK, 'center'); });
    text('BUFFER', rx, 122, CYAN);
    for (let i = 0; i < HACK.buffer; i++) {
      ctx.strokeStyle = hexA(INK, 0.3); ctx.strokeRect(rx + 0.5 + i * 24, 131.5, 20, 15);
      if (g.buf[i]) text(g.buf[i], rx + 10 + i * 24, 140, YELLOW, 'center');
    }
    text('TIME', rx, 164, CYAN);
    ctx.fillStyle = '#1a1030'; ctx.fillRect(rx, 172, 140, 6);
    ctx.fillStyle = g.t < 6 ? PINK : YELLOW; ctx.fillRect(rx, 172, Math.round(140 * g.t / HACK.time), 6);
    text('Click a code to pick it', rx, 196, '#8a83a8');
    text('Esc to drop out', rx, 210, '#8a83a8');
  } else {
    const R = HACK.rhythm, nl = R.keys.length, laneW = 40, left = 240 - laneW * nl / 2, top = 52, hitY = 212;
    const cols = [PINK, CYAN, YELLOW];
    text('SIGNAL SYNC', 240, 36, PINK, 'center');
    text('HITS ' + g.hits + '/' + R.notes, 72, 60, INK);
    text('MISSES ' + g.misses + '/' + R.maxMiss, 72, 74, g.misses >= R.maxMiss ? PINK : INK);
    text('Esc to drop out', 72, 230, '#8a83a8');
    for (let i = 0; i < nl; i++) {
      const lx = left + i * laneW;
      ctx.fillStyle = g.bad[i] > 0 ? hexA('#ff3b3b', 0.18) : g.flash[i] > 0 ? hexA(cols[i], 0.25) : 'rgba(255,255,255,0.03)';
      ctx.fillRect(lx + 1, top, laneW - 2, hitY - top + 10);
      ctx.fillStyle = hexA(cols[i], 0.85); ctx.fillRect(lx + 3, hitY - 1, laneW - 6, 2);   // the hit line
      text(R.labels[i], lx + laneW / 2, hitY + 16, cols[i], 'center');
    }
    for (const n of g.notes) {
      if (n.hit) continue;
      const k = (n.t - g.t) / R.fall; if (k > 1 || k < -0.15) continue;
      const y = Math.round(hitY - k * (hitY - top)), lx = left + n.lane * laneW;
      ctx.fillStyle = n.miss ? '#4a4366' : cols[n.lane]; ctx.fillRect(lx + 5, y - 3, laneW - 10, 6);
      ctx.fillStyle = n.miss ? '#4a4366' : '#ffffff'; ctx.fillRect(lx + 7, y - 1, laneW - 14, 2);
    }
    if (g.t < g.notes[0].t - g.beat * 0.5) text('GET READY: ' + Math.max(1, Math.ceil((g.notes[0].t - g.t) / g.beat)), 240, 130, YELLOW, 'center');
  }
  ctx.fillStyle = CYAN;                                   // the mouse cursor (the crosshair is hidden under the panel)
  const mx = Math.round(mouse.sx), my = Math.round(mouse.sy);
  ctx.fillRect(mx - 4, my, 3, 1); ctx.fillRect(mx + 2, my, 3, 1); ctx.fillRect(mx, my - 4, 1, 3); ctx.fillRect(mx, my + 2, 1, 3);
  ctx.textAlign = 'center';
}

function drawWorld() {
  ctx.drawImage(floorLayer, 0, 0);

  const pulse = 0.5 + 0.5 * Math.sin(time * 4);
  ctx.font = FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (floorIdx === 0) drawEvac(pulse);                   // the evac zone only exists on the ground floor

  ctx.drawImage(decalLayer, 0, 0);

  // staircases: a bobbing yellow arrow points up, a cyan one points down
  for (const st of floorStates[floorIdx].stairs) {
    const cx = st.x * TILE + TILE / 2, cy = st.y * TILE + TILE / 2 + Math.round(Math.sin(time * 4 + st.x) * 1.5), d = st.up ? -1 : 1;
    ctx.fillStyle = DARK; ctx.beginPath(); ctx.moveTo(cx, cy + d * 7); ctx.lineTo(cx - 7, cy - d * 4); ctx.lineTo(cx + 7, cy - d * 4); ctx.fill();
    ctx.fillStyle = st.up ? YELLOW : CYAN; ctx.beginPath(); ctx.moveTo(cx, cy + d * 5); ctx.lineTo(cx - 5, cy - d * 3); ctx.lineTo(cx + 5, cy - d * 3); ctx.fill();
  }

  // explosive barrels: red drums marked with an explosion burst, and a faint warning glow
  for (const br of floorStates[floorIdx].barrels) {
    if (!br.alive) continue;
    const x = br.x * TILE, y = br.y * TILE;
    drawGlow(x + 8, y + 8, '#ff3b3b', 9 + Math.sin(time * 3 + br.x) * 1.5);   // glow first, so it never washes over the symbol
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(x + 9, y + 10, 7, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#05030c'; ctx.beginPath(); ctx.arc(x + 8, y + 8, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c4122e'; ctx.beginPath(); ctx.arc(x + 8, y + 8, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d92440'; ctx.beginPath(); ctx.arc(x + 7, y + 7, 4, 0, Math.PI * 2); ctx.fill();
    // the explosion burst, as crisp black pixels on the red drum
    for (const [px2, py2] of BURST_PX) { ctx.fillStyle = '#05030c'; ctx.fillRect(x + 4 + px2, y + 4 + py2, 1, 1); }
  }

  // dropped weapons (random guns): the model on the floor with a ring in its energy color. Fills while you hold interact.
  for (const d of floorStates[floorIdx].weapons) {
    const art = WEAPON_ART[d.id] || WEAPON_ART.pistol, glow = art.glow || YELLOW;
    ctx.strokeStyle = hexA(glow, 0.35 + 0.2 * Math.sin(time * 4 + d.x)); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(d.x, d.y, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.save(); ctx.translate(Math.round(d.x), Math.round(d.y)); ctx.rotate(d.angle); ctx.translate(-art.len / 2, -1);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(1, 2, art.len, 3);
    art.draw(ctx); ctx.restore();
    if (player.swapT > 0 && weaponNear() === d) {
      ctx.strokeStyle = YELLOW; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(d.x, d.y, 11, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * player.swapT / 0.5); ctx.stroke(); ctx.lineWidth = 1;
    }
  }

  // thrown knives lying where they landed
  for (const k of floorStates[floorIdx].knives) {
    ctx.save(); ctx.translate(Math.round(k.x), Math.round(k.y)); ctx.rotate(k.a); ctx.translate(-4, -1);
    WEAPON_ART.knives.draw(ctx); ctx.restore();
    drawGlow(k.x, k.y, '#9fe8ff', 5);
  }

  // medkit drops
  for (const k of pickups) {
    const bob = Math.round(Math.sin(time * 5 + k.x));
    ctx.fillStyle = DARK; ctx.fillRect(k.x - 5, k.y - 5 + bob, 10, 10);
    ctx.fillStyle = '#eafcff'; ctx.fillRect(k.x - 4, k.y - 4 + bob, 8, 8);
    ctx.fillStyle = '#19e36b'; ctx.fillRect(k.x - 1, k.y - 3 + bob, 2, 6); ctx.fillRect(k.x - 3, k.y - 1 + bob, 6, 2);
  }

  drawDoors();
  drawCameras();

  // client on the ground
  for (const client of clients) {                        // every client still lying in the building
    if (client.carried || client.extracted || client.f !== floorIdx || !isVisible(client.x, client.y)) continue;
    drawClient(client, pulse);
  }

  // enemies
  for (const e of enemies) {
    if (!isVisible(e.x, e.y)) continue;                   // no line of sight to them: not drawn at all
    if (e.boss) {                                          // boss: red aura, its Sandevistan trail, and the warning line for a hack it is casting
      for (const t of e.boss.trail) { ctx.globalAlpha = 0.5 * t.life / 0.45; drawFigure(t.x, t.y, t.a, { ...e.look, ghost: true, body: '#ff5a5a', trim: '#b81d2e' }, 0, 0, false, e.weapon, 0); }
      ctx.globalAlpha = 1;
      // the aura sits under the sprite and only ever adds light, so it never hides the boss or what is behind it.
      // The middle is left clear; the glow lives in a ring around the body and fades out to nothing.
      const pulse = 0.5 + 0.5 * Math.sin(time * 3.2);
      ctx.globalCompositeOperation = 'lighter';
      const aura = ctx.createRadialGradient(e.x, e.y, 5, e.x, e.y, 27 + pulse * 3);
      aura.addColorStop(0, 'rgba(255,40,60,0)');
      aura.addColorStop(0.32, `rgba(255,40,60,${0.22 + pulse * 0.08})`);
      aura.addColorStop(0.62, `rgba(255,20,40,${0.1 + pulse * 0.05})`);
      aura.addColorStop(1, 'rgba(255,20,40,0)');
      ctx.fillStyle = aura;
      ctx.beginPath(); ctx.arc(e.x, e.y, 31, 0, Math.PI * 2); ctx.fill();
      for (let k = 0; k < 3; k++) {                        // three embers orbiting the boss
        const a = time * 2.4 + k * 2.094, r = 15 + Math.sin(time * 5 + k) * 1.5;
        ctx.fillStyle = `rgba(255,${110 + k * 40},90,${0.55 + pulse * 0.3})`;
        ctx.fillRect(Math.round(e.x + Math.cos(a) * r), Math.round(e.y + Math.sin(a) * r), 2, 2);
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = hexA('#ff4a4a', 0.35 + pulse * 0.25); ctx.lineWidth = 1;   // thin turning dashed ring at the edge
      ctx.setLineDash([5, 4]); ctx.lineDashOffset = -time * 14;
      ctx.beginPath(); ctx.arc(e.x, e.y, 19, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      if (e.boss.cast) {
        ctx.strokeStyle = hexA('#ff4a4a', 0.5 + 0.4 * (1 - e.boss.castT / BOSS.hackWarn)); ctx.lineWidth = 2;
        ctx.setLineDash([4, 3]); ctx.lineDashOffset = -time * 40;
        ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(player.x, player.y); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
      }
    }
    if (e.boss) drawGlow(e.x, e.y, e.look.body, 10);     // only elites keep a glow
    if (e.burn > 0) drawGlow(e.x, e.y, '#ff8a1f', 15);
    if (e.blind > 0) drawGlow(e.x, e.y, '#b537f2', 13);
    if (e.cook > 0) {                                      // hacked grenade: show its blast radius
      ctx.strokeStyle = PINK; ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(e.x, e.y, CFG.grenade.radius, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    const blade = ENEMY_WEAPONS[e.weapon];
    if (blade.melee && (e.windup > 0 || e.swing > 0)) {    // a blade attack: red while it winds up (where it will land), white as it cuts
      const cut = e.swing > 0;
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.angle);
      ctx.strokeStyle = cut ? hexA('#ffffff', 0.9 * e.swing / 0.14) : hexA('#ff3b3b', 0.85);
      ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = cut ? 3 : 2;
      if (blade.rect) { ctx.fillRect(6, -blade.bladeGap / 2 - 1, blade.reach - 6, 2); ctx.fillRect(6, blade.bladeGap / 2 - 1, blade.reach - 6, 2); }
      else { ctx.beginPath(); ctx.arc(0, 0, blade.reach - (cut ? 2 : 0), -1.1, 1.1); ctx.stroke(); }
      ctx.restore(); ctx.lineWidth = 1;
    }
    if (e.muzzle > 0) drawGlow(e.x + Math.cos(e.angle) * 12, e.y + Math.sin(e.angle) * 12, '#ff9a1f', 3);
    if (e.hack > 0) {                                      // net hacker uploading: a flickering green line to you that thickens as it finishes
      const k = e.hack / e.cfg.hackTime;
      ctx.strokeStyle = hexA(e.hackType === 'optics' ? '#c77dff' : '#39ff88', (0.35 + 0.5 * k) * (Math.floor(time * 20) % 2 ? 1 : 0.6)); ctx.lineWidth = 1 + k * 2;   // green = jam, purple = optics
      ctx.setLineDash([3, 3]); ctx.lineDashOffset = -time * 40;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(player.x, player.y); ctx.stroke();
      ctx.setLineDash([]); ctx.lineWidth = 1;
    }
    e.look.shieldUp = e.blocking;
    if (e.blocking) {                                      // the arc its shield covers: hits from inside this arc bounce off
      ctx.strokeStyle = hexA('#9fb4ff', 0.55); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, 14, e.angle - e.cfg.blockArc, e.angle + e.cfg.blockArc); ctx.stroke(); ctx.lineWidth = 1;
    }
    if (e.seated) {                                        // his office chair, seen from above, behind him
      ctx.fillStyle = '#141626'; ctx.beginPath(); ctx.arc(e.x, e.y + 1, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a2f45'; ctx.fillRect(Math.round(e.x) - 6, Math.round(e.y) + 4, 12, 3);
    }
    if (e.type === 'drone') drawDrone(e);
    else drawFigure(e.x, e.y, e.angle, e.look, e.flash, e.muzzle, false, e.weapon, e.walk);
    if (e.cook > 0) { ctx.fillStyle = Math.floor(time * 16) % 2 ? YELLOW : PINK; ctx.fillRect(Math.round(e.x) - 2, Math.round(e.y) - 2, 4, 4); }
    if (e.blind > 0) { ctx.fillStyle = '#d58bff'; ctx.font = FONT; ctx.fillText('x', e.x, e.y - 11); }   // blinded
    else if (e.wonderT > 0) { ctx.fillStyle = '#ff9a1f'; ctx.font = FONT; ctx.fillText('?', e.x, e.y - 11); }   // found a body
    else if (e.alertT > 0) { ctx.fillStyle = YELLOW; ctx.font = FONT; ctx.fillText('!', e.x, e.y - 11); }
  }

  // player
  if (player) {
    if (player.dead) {
      ctx.fillStyle = '#c4124b'; ctx.beginPath(); ctx.ellipse(player.x, player.y, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = LOOKS.player.body; ctx.fillRect(player.x - 6, player.y - 4, 12, 8);
      ctx.fillStyle = CYAN; ctx.fillRect(player.x + 5, player.y - 2, 5, 5);
    } else {
      for (const gh of ghosts) drawGhost(gh);              // Sandevistan trail, behind you
      if (player.slash > 0) {                              // melee swing: an arc for the katana, a straight thrust for mantis blades
        const kw = WEAPONS[player.slashWeapon] || WEAPONS.katana, sa = player.slash / 0.14;
        if (kw.rect) {
          ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
          ctx.fillStyle = hexA('#c8ff3d', 0.22 * sa); ctx.fillRect(6, -kw.bladeGap / 2 - 3, kw.reach - 6, kw.bladeGap + 6);
          ctx.fillStyle = hexA('#ffffff', 0.9 * sa); ctx.fillRect(6, -kw.bladeGap / 2 - 1, kw.reach - 6, 2); ctx.fillRect(6, kw.bladeGap / 2 - 1, kw.reach - 6, 2);
          ctx.restore();
        } else {
          ctx.strokeStyle = hexA('#ffffff', 0.9 * sa); ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(player.x, player.y, kw.reach - 3, player.angle - kw.arc / 2, player.angle + kw.arc / 2); ctx.stroke();
          ctx.strokeStyle = hexA(CYAN, 0.7 * sa); ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(player.x, player.y, kw.reach, player.angle - kw.arc / 2, player.angle + kw.arc / 2); ctx.stroke();
        }
      }
      if (player.smart > 0) {                              // Smart Link on: a slowly turning targeting ring around you
        ctx.strokeStyle = hexA('#39ff88', 0.6); ctx.setLineDash([3, 4]); ctx.lineDashOffset = -time * 20;
        ctx.beginPath(); ctx.arc(player.x, player.y, 13, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      }
      if (player.charge > 0) {                             // railgun charging: a blue glow builds at the muzzle
        const k = 1 - player.charge / WEAPONS[player.weapon].charge;
        const gx = player.x + Math.cos(player.angle) * 21, gy = player.y + Math.sin(player.angle) * 21;
        drawGlow(gx, gy, '#3fa9ff', 5 + k * 13);
        drawGlow(gx, gy, '#bfe3ff', 2 + k * 5);
        for (let i = 0; i < 3; i++) {                      // motes drawn in toward the muzzle
          const a = time * 9 + i * 2.1, r = (1 - ((time * 2.5 + i / 3) % 1)) * (10 + k * 8);
          ctx.fillStyle = '#bfe3ff'; ctx.fillRect(Math.round(gx + Math.cos(a) * r), Math.round(gy + Math.sin(a) * r), 1, 1);
        }
      }
      if (player.muzzle > 0) drawGlow(player.x + Math.cos(player.angle) * 13, player.y + Math.sin(player.angle) * 13, (WEAPON_ART[player.weapon] || {}).glow || YELLOW, 3);
      if (player.camo > 0) {                               // cloaked: a faint, flickering outline of you
        ctx.save(); ctx.globalAlpha = 0.28 + 0.1 * Math.sin(time * 18) + (Math.random() < 0.05 ? 0.2 : 0);
        drawFigure(player.x + (Math.random() < 0.08 ? rand(-1, 1) : 0), player.y, player.angle, LOOKS.player, 0, player.muzzle, client.carried, player.weapon, player.walk);
        ctx.restore();
      } else drawFigure(player.x, player.y, player.angle, LOOKS.player, player.flash, player.muzzle, client.carried, player.weapon, player.walk);
    }
  }

  // quickhack aim line: an enemy has to be standing on this line to get hacked
  const hacks = [selectedCyber, selectedCyber2].filter(isHack);
  if (state === 'play' && hacks.length) {
    const longest = hacks.reduce((a, b) => (CYBERWARE[b].range > CYBERWARE[a].range ? b : a));
    const hl = hackLine(longest), hackReady = hacks.some(h => player.cyberCd[h] <= 0);
    if (hacks.length > 1) {                                // two hacks with different reach: mark where the shorter one ends
      const short = hackLine(hacks.find(h => h !== longest));
      if (short.len < hl.len) { ctx.fillStyle = hexA('#39ff88', 0.5); ctx.fillRect(Math.round(short.x + short.dx * short.len) - 1, Math.round(short.y + short.dy * short.len) - 1, 3, 3); }
    }
    const hcol = hackReady ? '#39ff88' : '#9a94b8';
    const ex = hl.x + hl.dx * hl.len, ey = hl.y + hl.dy * hl.len;
    ctx.strokeStyle = hexA(hcol, hackReady ? 0.4 : 0.18); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hl.x + hl.dx * 9, hl.y + hl.dy * 9); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.fillStyle = hexA(hcol, hackReady ? 0.75 : 0.3); ctx.fillRect(Math.round(ex) - 2, Math.round(ey) - 2, 4, 4);   // end of range
    const ht = hackTarget(hl);
    if (ht) { ctx.strokeStyle = hexA(hcol, 0.95); ctx.strokeRect(Math.round(ht.x) - 9.5, Math.round(ht.y) - 9.5, 19, 19); }   // who it would hit
    if (ht && hacks.includes('overheat') && player.cyberCd.overheat <= 0) {   // Overheat's blast radius around the target
      ctx.strokeStyle = hexA('#ff9a1f', 0.45); ctx.beginPath(); ctx.arc(ht.x, ht.y, CYBERWARE.overheat.radius, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // bullets: a bright core with a soft glowing tracer behind it. Faster rounds leave longer streaks.
  for (const b of bullets) {
    if (b.w && b.w.thrown) {                               // a knife in flight spins end over end
      ctx.save(); ctx.translate(Math.round(b.x), Math.round(b.y)); ctx.rotate(b.traveled * 0.12); ctx.translate(-4, -1);
      WEAPON_ART.knives.draw(ctx); ctx.restore();
      continue;
    }
    const mine = b.from === 'player', len = Math.min(18, 4 + b.speed * 0.014);
    const tx = b.x - Math.cos(b.angle) * len, ty = b.y - Math.sin(b.angle) * len;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = hexA(mine ? ((WEAPON_ART[b.w.id] || {}).glow || CYAN) : '#ff9a1f', 0.4); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();   // glowing head
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = b.smart ? '#39ff88' : mine ? '#eaffff' : YELLOW; ctx.lineWidth = mine ? 1 : 2;   // homing rounds have a green core
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(tx, ty); ctx.stroke();
  }
  ctx.lineWidth = 1;

  // live grenades (with blast radius preview) and explosions
  for (const gr of grenades) {
    if (gr.silent) continue;                               // a barrel about to chain-explode: no ring
    ctx.strokeStyle = PINK; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.arc(gr.x, gr.y, CFG.grenade.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = DARK; ctx.fillRect(gr.x - 3, gr.y - 3, 6, 6);
    ctx.fillStyle = Math.floor(time * 16) % 2 ? YELLOW : PINK; ctx.fillRect(gr.x - 2, gr.y - 2, 4, 4);
  }
  for (const b of blasts) {                              // fireball with a white-hot core, then a shockwave ring racing outward
    const k = 1 - b.t / (b.life || 0.25), ease = 1 - (1 - k) * (1 - k), R = b.r || CFG.grenade.radius;
    const fr = R * (0.3 + 0.7 * ease), fg = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, fr);
    fg.addColorStop(0, `rgba(255,255,255,${0.95 * (1 - k)})`);
    fg.addColorStop(0.35, `rgba(255,236,120,${0.85 * (1 - k)})`);
    fg.addColorStop(0.7, `rgba(255,120,40,${0.55 * (1 - k)})`);
    fg.addColorStop(1, 'rgba(255,42,109,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(b.x, b.y, fr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, R * 1.15 * Math.sqrt(k), 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1;
  }

  ctx.drawImage(wallLayer, 0, 0);
  drawServerLights();
  drawLaptop();                                            // sits on top of its desk, so after the furniture

  for (const p of particles) {
    if (p.smoke) {                                         // soft round puffs that thin out as they spread
      ctx.globalAlpha = 0.24 * Math.min(1, p.life / p.max * 1.6);
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; continue;
    }
    const px = Math.round(p.x), py = Math.round(p.y);
    if (p.glow) {                                          // sparks: a hot pixel with a streak behind it and a faint halo
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5);
      ctx.fillStyle = hexA(p.color, 0.35); ctx.fillRect(px - 1, py - 1, 3, 3);
      ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x - p.vx * 0.02), Math.round(p.y - p.vy * 0.02), 1, 1);
      ctx.fillStyle = '#fff'; ctx.fillRect(px, py, 1, 1);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; continue;
    }
    ctx.fillStyle = p.color; ctx.fillRect(px, py, p.size, p.size);
  }

  if (floorIdx === 0) drawRain();                        // it only rains outside

  // neon light pass: added on top so it tints floors, walls and people alike, with a slight flicker
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.9 + Math.sin(time * 13) * 0.04 - (Math.random() < 0.02 ? 0.25 : 0);
  ctx.drawImage(lightLayer, 0, 0);
  ctx.globalAlpha = 1;
  const glowAt = (x, y, rad, col, a) => {
    const g = ctx.createRadialGradient(x, y, 1, x, y, rad);
    g.addColorStop(0, hexA(col, a)); g.addColorStop(0.4, hexA(col, a * 0.45)); g.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  };
  for (const lt of lights) glowAt(lt.x, lt.y, lt.r, lt.color, lt.a * (lt.t / lt.life));
  for (const gr of grenades) if (!gr.silent) glowAt(gr.x, gr.y, 22, PINK, 0.3 + 0.2 * Math.sin(time * 30));
  ctx.globalCompositeOperation = 'source-over';

  drawFog();                                             // hide whatever you have no line of sight to

  // railgun afterglow: drawn over the walls and the fog, because the slug goes through both
  ctx.globalCompositeOperation = 'lighter';
  for (const bm of beams) {
    const k = bm.t / 0.35, bx = bm.x + Math.cos(bm.a) * 12, by = bm.y + Math.sin(bm.a) * 12;
    const ex2 = bm.x + Math.cos(bm.a) * 1000, ey2 = bm.y + Math.sin(bm.a) * 1000;
    ctx.strokeStyle = hexA(CYAN, 0.35 * k); ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex2, ey2); ctx.stroke();
    ctx.strokeStyle = hexA('#ffffff', 0.8 * k); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex2, ey2); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.lineWidth = 1;
}

function hudText(text, x, y, color, align = 'left') {
  ctx.font = FONT; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = DARK; ctx.fillText(text, x + 1, y + 1);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

/** Dark-backed bar with a label inside it. frac is how full it is (1 = full). */
function cooldownBar(x, y, w, frac, text, fill, textCol) {
  ctx.fillStyle = DARK; ctx.fillRect(x, y, w + 2, 12);
  ctx.fillStyle = fill; ctx.fillRect(x + 1, y + 1, w * clamp(frac, 0, 1), 10);
  ctx.font = FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = textCol; ctx.fillText(text, x + 1 + w / 2, y + 2);
}

/** A key cap: the key's name in a yellow box. x is its left edge, or its right edge when rightAligned. Returns its width. */
function keyChip(x, y, text, rightAligned) {
  ctx.font = FONT;
  const w = Math.ceil(ctx.measureText(text).width) + 4, left = rightAligned ? x - w : x;   // measured, so it fits any font
  ctx.fillStyle = DARK; ctx.fillRect(left - 1, y - 1, w + 2, 12);
  ctx.fillStyle = YELLOW; ctx.fillRect(left, y, w, 10);
  ctx.font = FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = DARK; ctx.fillText(text, left + 2, y + 1);
  return w;
}

function drawHUD() {
  const p = player, maxHp = CFG.player.hp;

  // damage flash
  if (hurt > 0) { ctx.fillStyle = `rgba(255,42,109,${hurt * 0.3})`; ctx.fillRect(0, 0, W, H); }

  // health pips
  for (let i = 0; i < maxHp; i++) {
    ctx.fillStyle = DARK; ctx.fillRect(7 + i * 9, 7, 8, 8);
    ctx.fillStyle = i < p.hp ? PINK : '#3a1a4a'; ctx.fillRect(8 + i * 9, 8, 6, 6);
  }

  // timer, map number, reminder of the controls key
  hudText(fmtTime(missionTime), W - 8, 8, INK, 'right');
  hudText('MAP ' + levelNum + ' ' + diffOf(level).label.toUpperCase(), W - 8, 20, YELLOW, 'right');
  if (floorStates.length > 1) hudText('FLOOR ' + (floorIdx + 1) + '/' + floorStates.length, W - 8, 32, CYAN, 'right');
  // top right, under the map info: the keys for the menu and the guns / cyberware menu
  let menuY = floorStates.length > 1 ? 45 : 33;
  for (const [action, label] of [['menu', 'Menu'], ['cyberMenu', 'Guns + hacks']]) {
    hudText(label, W - 8, menuY + 1, INK, 'right');
    keyChip(W - 8 - Math.ceil(ctx.measureText(label).width) - 4, menuY, action === 'menu' ? 'Esc' : kl(action), true);
    menuY += 14;
  }

  if (diffOf(level).waves && wave.n > 0) hudText('WAVE ' + wave.n + (bestWave ? '  BEST ' + bestWave : ''), W / 2, 7, '#ff6b6b', 'center');
  // bosses get no health bar: like a Monster Hunter monster, you keep hitting it until it drops

  // critical client countdown, top center
  const crit = clients.find(c => c.crit && !c.extracted);
  if (crit) {
    const urgent = crit.timeLeft <= 20, txt = 'CRITICAL ' + fmtTime(Math.max(0, Math.ceil(crit.timeLeft)));
    ctx.font = FONT;
    const tw = Math.ceil(ctx.measureText(txt).width);
    ctx.fillStyle = urgent && Math.floor(time * 4) % 2 ? '#ff3b3b' : DARK; ctx.fillRect(W / 2 - tw / 2 - 6, 4, tw + 12, 14);
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(W / 2 - tw / 2 - 6, 17, (tw + 12) * clamp(crit.timeLeft / crit.crit, 0, 1), 2);
    hudText(txt, W / 2, 7, urgent ? '#ffffff' : '#ff6b6b', 'center');
  }

  if (p.jam > 0) hudText('GUNS JAMMED ' + Math.ceil(p.jam) + 's', W / 2, 24, Math.floor(time * 6) % 2 ? '#39ff88' : '#ffffff', 'center');

  // corner brackets, for that heads-up display feel
  ctx.fillStyle = CYAN;
  for (const [bx, by, sx2, sy2] of [[2, 2, 1, 1], [W - 3, 2, -1, 1], [2, H - 3, 1, -1], [W - 3, H - 3, -1, -1]]) {
    ctx.fillRect(sx2 > 0 ? bx : bx - 9, by, 10, 1); ctx.fillRect(bx, sy2 > 0 ? by : by - 9, 1, 10);
  }

  // current gun + ammo
  const wp = WEAPONS[p.weapon], reloading = p.reloadTimer > 0;
  ctx.save(); ctx.translate(18, H - 54); ctx.scale(3, 3);  // the model of the gun in your hands, double size
  (WEAPON_ART[p.weapon] || WEAPON_ART.pistol).draw(ctx);
  ctx.restore();
  const slotN = loadout.indexOf(p.weapon) + 1;             // 0 for the carry pistol, which has no slot
  hudText((slotN ? kl('slot' + slotN) + ' ' : '') + wp.name, 8, H - 30, YELLOW);
  hudText(p.jam > 0 && !wp.melee && !wp.thrown ? 'JAMMED ' + Math.ceil(p.jam) + 's' : p.charge > 0 ? 'Charging' : reloading ? 'Reloading' : wp.melee ? 'Melee' : p.ammo[p.weapon] + '/' + wp.mag + (finiteAmmo(p.weapon) ? ' +' + p.reserve[p.weapon] : ''), 8, H - 18,
          (p.jam > 0 && !wp.melee && !wp.thrown) || reloading || (!wp.melee && p.ammo[p.weapon] === 0) ? PINK : INK);

  // bottom right: cyberware slot, medkits, grenade. Bars fill pink while cooling, flash when ready.
  const blink = Math.floor(time * 3) % 2 ? YELLOW : CYAN;
  const cyberSlot = (id, keyName, y) => {                // name, key cap and READY bar for one cyberware slot
    const cw = CYBERWARE[id], ccd = p.cyberCd[id], cReady = ccd <= 0;
    const activeT = id === 'sandevistan' ? p.sandy : id === 'smartlink' ? p.smart : id === 'camo' ? p.camo : 0;   // a timed cyberware that is running
    hudText(cw.name, W - 8, y, cReady ? YELLOW : '#6b5a8a', 'right');
    keyChip(W - 86, y + 12, kl(keyName), true);           // key cap sits right beside its READY bar
    if (id === 'overheat' && p.ohWindow > 0) cooldownBar(W - 82, y + 11, 72, p.ohWindow / cw.window, 'x' + p.ohLeft + ' ' + Math.ceil(p.ohWindow) + 's', '#ff9a1f', DARK);   // second charge, use it fast
    else if (activeT > 0) cooldownBar(W - 82, y + 11, 72, activeT / cw.duration, 'ON ' + Math.ceil(activeT) + 's', '#39ff88', DARK);
    else cooldownBar(W - 82, y + 11, 72, 1 - ccd / cw.cooldown, cReady ? 'READY' : Math.ceil(ccd) + 's', cReady ? blink : PINK, cReady ? DARK : INK);
  };
  cyberSlot(selectedCyber, 'cyber', H - 72);
  if (selectedCyber2) cyberSlot(selectedCyber2, 'cyber2', H - 100);   // second slot sits above the first

  hudText('Medkit x' + p.medkits, W - 8, H - 46, p.medkits > 0 ? '#5dff9b' : '#6b5a8a', 'right');
  keyChip(W - 8 - Math.ceil(ctx.measureText('Medkit x' + p.medkits).width) - 4, H - 47, kl('medkit'), true);

  const gcd = p.grenadeCooldown, gReady = gcd <= 0;
  hudText('Grenade', W - 8, H - 34, gReady ? YELLOW : '#6b5a8a', 'right');
  keyChip(W - 86, H - 22, kl('grenade'), true);
  cooldownBar(W - 82, H - 23, 72, 1 - gcd / CFG.grenade.cooldown, gReady ? 'READY' : Math.ceil(gcd) + 's', gReady ? blink : PINK, gReady ? DARK : INK);

  // objective line (a timed banner overrides it)
  const near = client.f === floorIdx && Math.hypot(client.x - p.x, client.y - p.y) < CFG.interactRange;
  let line, col = INK;
  if (!hasFocus) { line = 'Click the game to get your keys back'; col = PINK; }
  else if (banner.t > 0) { line = banner.text; col = YELLOW; }
  else if (weaponNear()) {
    const d = weaponNear(), w = WEAPONS[d.id], have = loadout.includes(d.id);
    line = 'Hold ' + kl('interact') + (have ? ' to take its ammo' : ' to take the ' + w.name) + (w.melee || have ? '' : ' (' + d.ammo + ' +' + d.reserve + ')');
    col = YELLOW;
  }
  else if (state === 'play' && !client.carried && !loadoutLocked()) {
    line = diffOf(level).waves && wave.n > 0 && wave.rest > 0
      ? kl('cyberMenu') + ' changes gear. Wave in ' + Math.ceil(wave.rest) + 's, ' + kl('skipWave') + ' starts it'   // break between waves
      : 'Evac zone: press ' + kl('cyberMenu') + ' to change gear';
    col = CYAN;
  }
  else if (laptopNear()) {
    const sec = laptopNear();
    line = sec.lockT > 0 ? 'Laptop locked: ' + Math.ceil(sec.lockT) + 's' : 'Press ' + kl('interact') + ' to shut down every camera in the building';
    col = sec.lockT > 0 ? PINK : CYAN;
  }
  else if (stairNear()) {
    const st = stairNear();
    line = 'Press ' + kl('interact') + ' to take the stairs ' + (st.up ? 'up' : 'down'); col = st.up ? YELLOW : CYAN;
  }
  else if (diffOf(level).waves) {                        // wave mode objective
    const left = enemies.filter(e => !e.dead).length;
    line = !wave.started ? 'Enter the building to start the waves' : wave.rest > 0 ? (wave.n > 0 ? 'Next wave in ' + Math.ceil(wave.rest) + 's. ' + kl('skipWave') + ' to start now' : 'Get ready') : 'Wave ' + wave.n + ': ' + left + ' left';
    col = !wave.started ? INK : wave.rest > 0 ? CYAN : PINK;
  }
  else if (!client.stabilized) line = near ? 'Hold ' + kl('interact') + ' to stabilize the client' : (clients.length > 1 ? 'Find the clients. ' + clients.filter(c => c.extracted).length + ' of ' + clients.length + ' out' : 'Find the client');
  else if (client.carried) { line = 'Carry the client to the evac zone'; col = CYAN; }
  else line = 'Press ' + kl('interact') + ' to pick up the client';
  hudText(line, W / 2, H - 18, col, 'center');

  drawObjectiveArrow();

  // crosshair (the gap grows with the gun's spread)
  const g = Math.round(2 + WEAPONS[p.weapon].spread * 22);
  ctx.fillStyle = CYAN;
  const cx = Math.round(mouse.sx), cy = Math.round(mouse.sy);
  ctx.fillRect(cx - g - 3, cy, 3, 1); ctx.fillRect(cx + g + 1, cy, 3, 1);
  ctx.fillRect(cx, cy - g - 3, 1, 3); ctx.fillRect(cx, cy + g + 1, 1, 3);
  ctx.fillStyle = PINK; ctx.fillRect(cx, cy, 1, 1);
}

/** Edge-of-screen arrow to the evac zone, shown only while you are carrying a client. */
function drawObjectiveArrow() {
  const toEvac = client.carried;
  if (!toEvac) return;                                   // no arrow to the clients: you have to search the building
  let tx = evac.x + evac.w / 2, ty = evac.y + evac.h / 2;
  if (floorIdx > 0) {                                    // upstairs: point at the nearest staircase down instead
    let best = Infinity;
    for (const st of floorStates[floorIdx].stairs) {
      const sx = st.x * TILE + TILE / 2, sy = st.y * TILE + TILE / 2, d = Math.hypot(sx - player.x, sy - player.y);
      if (!st.up && d < best) { best = d; tx = sx; ty = sy; }
    }
  }
  const s = worldToScreen(tx, ty), m = 16;
  if (s.x > m && s.x < W - m && s.y > m && s.y < H - m - 14) return;   // target is on screen
  const a = Math.atan2(s.y - H / 2, s.x - W / 2);
  const k = Math.min((W / 2 - m) / Math.abs(Math.cos(a) || 1e-6), (H / 2 - m - 10) / Math.abs(Math.sin(a) || 1e-6));
  ctx.save();
  ctx.translate(W / 2 + Math.cos(a) * k, H / 2 + Math.sin(a) * k); ctx.rotate(a);
  ctx.fillStyle = DARK; ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -7); ctx.lineTo(-5, 7); ctx.fill();
  ctx.fillStyle = toEvac ? CYAN : PINK; ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -5); ctx.lineTo(-4, 5); ctx.fill();
  ctx.restore();
}

/** Night city behind the level: dark sky and distant neon windows with parallax. */
function drawBackdrop() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04010c'); g.addColorStop(1, '#1b0636');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const cols = [PINK, CYAN, '#b537f2', YELLOW];
  for (let i = 0; i < 90; i++) {
    const sx = (((i * 97.3) % 620 - cam.x * 0.25) % 620 + 620) % 620 - 70;
    const sy = (((i * 57.7) % 360 - cam.y * 0.25) % 360 + 360) % 360 - 45;
    ctx.globalAlpha = 0.25 + 0.3 * (0.5 + 0.5 * Math.sin(time * (0.6 + (i % 7) * 0.2) + i));
    ctx.fillStyle = cols[i % 4];
    ctx.fillRect(Math.round(sx), Math.round(sy), (i % 3 + 1) * 2, 2);
  }
  ctx.globalAlpha = 1;
}

function drawRain() {
  const top = STREET_TOP * TILE, span = WORLD_H - top + 48;
  // splashes: little rings where drops hit the wet street
  ctx.lineWidth = 1;
  for (let i = 0; i < 24; i++) {
    const cyc = time * (1.3 + (i % 4) * 0.25) + i * 0.618, ph = cyc % 1, n = Math.floor(cyc);
    const hx = Math.abs(Math.sin(n * 127.1 + i * 311.7) * 43758.5453) % 1, hy = Math.abs(Math.sin(n * 269.5 + i * 183.3) * 43758.5453) % 1;
    const x = hx * WORLD_W, y = top + TILE + hy * (WORLD_H - top - TILE);
    if (isSolid(tileOf(x), tileOf(y))) continue;
    ctx.strokeStyle = `rgba(190,235,255,${0.3 * (1 - ph)})`;
    ctx.beginPath(); ctx.ellipse(x, y, 1 + ph * 4, 0.5 + ph * 2, 0, 0, Math.PI * 2); ctx.stroke();
  }
  // slanted streaks at three depths: near ones are longer, faster and brighter
  for (let i = 0; i < 110; i++) {
    const depth = i % 3, len = 4 + depth * 3;
    const x = (i * 131.7 + time * (40 + depth * 22)) % (WORLD_W + 96) - 48;
    const y = top + (i * 71.3 + time * (240 + depth * 70 + (i % 5) * 20)) % span;
    ctx.strokeStyle = `rgba(170,225,255,${0.16 + depth * 0.1})`;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len * 0.28, y + len); ctx.stroke();
  }
}

/* Bloom: the brightest parts of the frame bleed a soft glow. Two small blurred copies of the screen are added back on top.
   The copy is multiplied by itself first, which crushes everything dim so only neon, fire and tracers bloom. */
const bloomA = document.createElement('canvas'), bloomB = document.createElement('canvas');
bloomA.width = W / 4; bloomA.height = Math.ceil(H / 4); bloomB.width = W / 8; bloomB.height = Math.ceil(H / 8);
const bloomACtx = bloomA.getContext('2d'), bloomBCtx = bloomB.getContext('2d');
function drawBloom() {
  if (!CFG.bloom) return;
  bloomACtx.globalCompositeOperation = 'copy'; bloomACtx.imageSmoothingEnabled = true;
  bloomACtx.drawImage(canvas, 0, 0, bloomA.width, bloomA.height);
  bloomACtx.globalCompositeOperation = 'multiply'; bloomACtx.drawImage(bloomA, 0, 0);
  bloomBCtx.globalCompositeOperation = 'copy'; bloomBCtx.imageSmoothingEnabled = true;
  bloomBCtx.drawImage(bloomA, 0, 0, bloomB.width, bloomB.height);
  ctx.save();
  ctx.imageSmoothingEnabled = true; ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.32; ctx.drawImage(bloomA, 0, 0, W, H);
  ctx.globalAlpha = 0.4; ctx.drawImage(bloomB, 0, 0, W, H);
  ctx.restore();
  ctx.imageSmoothingEnabled = false;
}

function render() {
  drawBackdrop();
  if (!player) return;

  updateVisibility();
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.rotate(sway);
  ctx.translate(Math.round(-cam.x + rand(-shake, shake)), Math.round(-cam.y + rand(-shake, shake)));
  drawWorld();
  ctx.restore();
  drawBloom();

  if (floorFlash > 0) { ctx.fillStyle = `rgba(13,2,33,${floorFlash / 0.3})`; ctx.fillRect(0, 0, W, H); }   // quick fade when you take the stairs
  if (player.blind > 0) {                                  // Reboot Optics from a boss: everything past a few tiles goes dark
    const sp = worldToScreen(player.x, player.y), fade = Math.min(1, player.blind / 0.5);
    const g = ctx.createRadialGradient(sp.x, sp.y, 26, sp.x, sp.y, 70);
    g.addColorStop(0, 'rgba(2,0,6,0)'); g.addColorStop(1, `rgba(2,0,6,${0.96 * fade})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (player.sandy > 0) { ctx.fillStyle = 'rgba(57,255,136,0.08)'; ctx.fillRect(0, 0, W, H); }   // Sandevistan tint

  if (state !== 'title') drawHUD();
  if (hackGame && state === 'play') drawHack();

  // digital glitch: a few rows of the screen tear sideways (random now and then, and whenever you get hit)
  if (glitchT > 0) {
    for (let i = 0; i < 4; i++) {
      const y = randInt(0, H - 12), h = randInt(3, 12);
      ctx.drawImage(canvas, 0, y, W, h, randInt(-10, 10), y, W, h);
    }
    ctx.fillStyle = 'rgba(5,217,232,0.14)'; ctx.fillRect(0, randInt(0, H), W, 2);
  }
}

/* =====================================================================
   15. MAIN LOOP
   ===================================================================== */
let lastT = 0;
function frame(t) {
  const dt = Math.min(0.033, (t - lastT) / 1000 || 0);
  lastT = t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

loadBinds();
try {
  const savedGuns = JSON.parse(localStorage.getItem(LOADOUT_KEY));
  if (Array.isArray(savedGuns) && savedGuns.length === 3 && new Set(savedGuns).size === 3 &&
      savedGuns.every(id => WEAPONS[id] && !WEAPONS[id].carryOnly)) manualLoadout = savedGuns;
} catch (err) { /* fine */ }
try {
  const saved = localStorage.getItem(CYBER_KEY); if (CYBERWARE[saved]) selectedCyber = saved;
  const saved2 = localStorage.getItem(CYBER2_KEY); if (canPair(saved2) && canPair(selectedCyber) && saved2 !== selectedCyber) selectedCyber2 = saved2;
} catch (err) { /* fine */ }

loadout = [...manualLoadout];

// boot: pick up the one saved map if there is one, otherwise roll the first
if (!loadSavedLevel()) { level = generateLevel(); levelNum = 1; saveLevel(); }
paintStaticLayers();
buildWorld();
cam.x = player.x; cam.y = player.y;
showTitle();
if (document.fonts && document.fonts.load) document.fonts.load(FONT).catch(() => {});
requestAnimationFrame(frame);

// Handy for poking at the game from the browser console while extending it.
window.__game = {
  Sound, CFG, WEAPONS, GEN, generateLevel, nextMap, get level() { return level; }, get levelNum() { return levelNum; }, findPath, hasLOS, startMission, update, render, switchWeapon, startReload,
  get bullets() { return bullets; }, get pickups() { return pickups; }, get grenades() { return grenades; },
  useMedkit, throwGrenade, alertOnSecure, breakDoor, updateCameras, startHack, hackClick, rhythmPress, finishHack, missionScore, laptopNear, makeBreach, breachDone, get hackGame() { return hackGame; }, set hackGame(v) { hackGame = v; }, get stats() { return stats; }, get mapAttempts() { return mapAttempts; }, set mapAttempts(v) { mapAttempts = v; }, winMission, droneDetonate, BREACH, HACK, CAMERA, worldToScreen, paintStaticLayers, roomAt, spawnBullet, get floorIdx() { return floorIdx; }, toggleBinds, breakDoor, assignSlot, rollLoadout, GEN,
  get bestWave() { return bestWave; }, noticeClues, startSearch, get randomGuns() { return randomGunsNow(); }, takeWeapon, weaponNear, togglePause, get pauseOpen() { return pauseOpen; }, barrelAt, get wave() { return wave; }, spawnWave, makeBoss, BOSS, AI, takeCover, roams, get missionTime() { return missionTime; }, DIFFICULTY, chooseDifficulty, loadoutLocked, jamPlayer, get pickingDiff() { return pickingDiff; }, get loadout() { return loadout; }, CYBERWARE, useCyber, selectCyber, toggleCyber, hackLine, hackTarget,
  get ghosts() { return ghosts; }, isVisible, ENEMY_WEAPONS, WEAPON_ART, stairNear, get selectedCyber() { return selectedCyber; }, get selectedCyber2() { return selectedCyber2; }, selectCyber2, get BINDS() { return BINDS; },
  get doors() { return doors; }, get doorOpen() { return doorOpen; }, get bindsOpen() { return bindsOpen; },
  get state() { return state; }, get player() { return player; }, get client() { return client; }, get clients() { return clients; }, changeFloor,
  get floorIdx() { return floorIdx; }, get floorStates() { return floorStates; },
  get enemies() { return enemies; }, get evac() { return evac; }, get spawns() { return spawns; },
  keys, mouse,
};
})();
